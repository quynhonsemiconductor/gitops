# ── ca-sync: ESO mirrors the CNPG CA CERTIFICATE inside data-<env> ──────────
#
# The security rule (§6.3, decided 2026-10-21): CNPG's `pg-*-ca` Secret holds
# ca.crt AND ca.key. The key signs server certificates — outside data-<env>
# it is a DB-MITM capability, so it never leaves the namespace. The mirror is
# ESO itself, not a CronJob:
#
#   pg-rova-ca (CNPG: ca.crt + ca.key)
#        └─ ExternalSecret ca-sync (data-prod) ──► pg-rova-ca-pub (ca.crt ONLY)
#   pg-dev-ca (CNPG: ca.crt + ca.key)
#        └─ ExternalSecret ca-sync (data-dev)  ──► pg-dev-ca-pub  (ca.crt ONLY)
#
# The namespaced SecretStore here reads `property: ca.crt` server-side, so the
# key is never even pulled into the sync; its ServiceAccount holds exactly one
# verb on exactly one Secret (resourceNames). The cnpg-ca ClusterSecretStores
# (stores-onprem.yaml) then distribute pg-*-ca-pub to the product namespaces
# as <product>-db-ca — RBAC on -pub only.
#
# Rotation facts (verified against the CNPG v1.30.1 source, 2026-10-21): the
# CA IS renewed — internal/controller/cluster_pki.go renewCASecret reissues
# ca.crt with the SAME key when IsExpiring(); defaults CertificateDuration=90
# and ExpiringCheckThreshold=7 (internal/configuration/configuration.go:41-45),
# i.e. a fresh ca.crt roughly every 83 days, leaf certs on the same cycle.
# Consumers load the CA ONCE at start (node-postgres ssl.ca, asyncpg
# SSLContext), so the chain must close itself:
#
#   CNPG renews pg-*-ca  ->  ca-sync (1 h refresh) rewrites pg-*-ca-pub and
#   every <product>-db-ca  ->  Reloader (platform/reloader) rolls the pods
#   annotated `secret.reloader.stakater.com/reload` in the chart.
#
# Nothing here is a restart-free path; the subPath mounts stay because
# Reloader restarts the pods anyway. ONE case outside the loop, §14 step 4: a
# REBUILT cluster generates a NEW CA. After a rebuild: force-sync this
# ExternalSecret (`kubectl annotate externalsecret -n data-<env> ca-sync
# force-sync=$(date +%s) --overwrite`), then restart the products that mount
# db-ca (Reloader does it if the value changed; check it did).
---
# ── data-prod ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-ca-sync
  namespace: data-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-ca-sync
  namespace: data-prod
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-rova-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-ca-sync
  namespace: data-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-ca-sync
subjects:
  - kind: ServiceAccount
    name: eso-ca-sync
    namespace: data-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ca-sync
  namespace: data-prod
spec:
  provider:
    kubernetes:
      # this SecretStore lives IN data-prod; the remote read targets the same
      # namespace (the provider default is "default", so set it explicitly)
      remoteNamespace: data-prod
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-ca-sync
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-sync
  namespace: data-prod
  labels:
    qnsc.vn/tenant: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ca-sync
    kind: SecretStore
  target:
    name: pg-rova-ca-pub
    creationPolicy: Owner
  data:
    # `property` is the point: ESO extracts ONLY ca.crt server-side. Even this
    # namespace-scoped identity never syncs ca.key anywhere.
    - secretKey: ca.crt
      remoteRef:
        key: pg-rova-ca
        property: ca.crt
---
# ── data-dev: identical shape for pg-dev ─────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-ca-sync
  namespace: data-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-ca-sync
  namespace: data-dev
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-dev-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-ca-sync
  namespace: data-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-ca-sync
subjects:
  - kind: ServiceAccount
    name: eso-ca-sync
    namespace: data-dev
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ca-sync
  namespace: data-dev
spec:
  provider:
    kubernetes:
      remoteNamespace: data-dev
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-ca-sync
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-sync
  namespace: data-dev
  labels:
    qnsc.vn/tenant: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ca-sync
    kind: SecretStore
  target:
    name: pg-dev-ca-pub
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: pg-dev-ca
        property: ca.crt
