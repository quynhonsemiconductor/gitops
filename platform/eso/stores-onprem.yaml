# ── The on-prem secret stores (ONPREM-PLAN §7.1) ────────────────────────────
#
# FOUR ClusterSecretStore families, replacing the EKS-era per-namespace IRSA
# SecretStore that the chart rendered (that one stays until the values move in
# the dev cutover; this file is on-prem only, applied at bootstrap, and every
# store authenticates with Entra workload identity — no hand-applied credential
# Secret is read).
#
# One store per vault, each with its own workload identity (infra#252 step 5),
# and a `conditions`
# namespaceSelector on `qnsc.vn/env` (../namespaces/onprem.yaml):
#   - dev can never read prod
#   - apps can never read platform credentials
#   - kv-qnsc-admin has NO store on purpose — nobody automated reads it (§7.1)
#
# Each store names its own ServiceAccount below; the controller mints a token
# for it (serviceaccounts/token create, granted by the chart's
# rbac.serviceAccountTokenCreate default) and Entra exchanges it because that
# application carries a federated credential for the subject
# system:serviceaccount:external-secrets:eso-<env>.
#
# No store reads a certificate any more. The bootstrap-time
# qnsc-eso-<env>-cert Secrets stay in the cluster untouched until infra#254
# removes them after all three stores are proven.
#
# Values are never in Git and never in state — OpenTofu (infra/live/identity)
# owns the vaults and the RBAC, never the secrets (§7).
#
# PUBLIC-REPO NOTE (2026-10-21 review): the vault NAMES and URLs below are
# literal. These files are kubectl-applied bootstrap manifests — no values
# channel exists to inject them, and templating bootstrap files would add a
# moving part for a name that carries no credential. ACCEPTED: a vault name
# is not a secret; access is Azure RBAC (the ESO SPs are scoped per vault),
# purge protection and the private-repo boundary for everything else.
#
# Schema note (2026-10-20, checked against the ESO v1 CRD at main): the
# namespace constraint on a ClusterSecretStore is `spec.conditions[]`
# (namespaceSelector or namespaceRegexes), NOT the flat
# `spec.namespaceSelector` of pre-v1 alpha; and the azure certificate auth is
# a single secretKeySelector. The datreeio CRD catalog still carries the old
# shape, so kubeconform with that catalog cannot validate this file.
---
# ── dev identity: Entra workload identity (infra#252 step 5) ─────────────────
#
# The dev store below authenticates with a federated token instead of the SP
# certificate. The ESO controller requests a token for THIS ServiceAccount
# (serviceaccounts/token create, granted by the chart's
# rbac.serviceAccountTokenCreate default), and Entra exchanges it because the
# "QNSC ESO Dev" application carries a federated credential with
#   issuer  https://oidc.qnsc.vn/k3s-onprem
#   subject system:serviceaccount:external-secrets:eso-dev
#   audience api://AzureADTokenExchange
#
# client-id is the QNSC ESO Dev application (client) id — an identifier, not a
# secret. For a store that names this account in serviceAccountRef, ESO reads
# client-id and tenant-id from these annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-dev
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: d9d625c1-b856-4f1e-86fc-ce36bdf9d511
    azure.workload.identity/tenant-id: dc0f2078-ac28-4ff2-b21a-d4b28df32361
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kv-qnsc-dev
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          qnsc.vn/env: dev
  provider:
    azurekv:
      authType: WorkloadIdentity
      # NO tenantId here, deliberately: ESO 2.11.0 fails with "multiple tenantID
      # found" when spec.provider.azurekv.tenantId and the ServiceAccount's
      # azure.workload.identity/tenant-id annotation are both present
      # (providers/v1/azure/keyvault/keyvault.go:1180). The annotation is the
      # single source, as in the upstream referenced-service-account example.
      # Do not add audiences: the token already asks for
      # api://AzureADTokenExchange by default, and extra values are APPENDED
      # (keyvault.go:1194-1197), not substituted.
      vaultUrl: https://kv-qnsc-dev.vault.azure.net
      serviceAccountRef:
        name: eso-dev
        namespace: external-secrets
---
# ── prod identity: Entra workload identity (infra#252 step 5) ───────────────
#
# Same shape as dev (see the dev block above; the tenantId/audiences notes there
# apply here too). The "QNSC ESO Prod" application carries a federated
# credential with
#   issuer  https://oidc.qnsc.vn/k3s-onprem
#   subject system:serviceaccount:external-secrets:eso-prod
#   audience api://AzureADTokenExchange
#
# client-id is the QNSC ESO Prod application (client) id — an identifier, not a
# secret. ESO reads client-id and tenant-id from these annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-prod
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: 9ccb7f4d-bcca-4eca-bf98-9772f3dc1a6f
    azure.workload.identity/tenant-id: dc0f2078-ac28-4ff2-b21a-d4b28df32361
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kv-qnsc-prod
  annotations:
    # Not ready at bootstrap (the workload identity has not been exchanged yet / the CNPG clusters do not exist):
    # must not hold root's sync waves. A real failure shows on the ExternalSecrets that use the store.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          qnsc.vn/env: prod
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-qnsc-prod.vault.azure.net
      serviceAccountRef:
        name: eso-prod
        namespace: external-secrets
---
# ── platform identity: Entra workload identity (infra#252 step 5) ───────────
#
# Same shape as dev and prod (see those blocks; the tenantId/audiences notes
# there apply here too). The "QNSC ESO Platform" application carries a federated
# credential with
#   issuer  https://oidc.qnsc.vn/k3s-onprem
#   subject system:serviceaccount:external-secrets:eso-platform
#   audience api://AzureADTokenExchange
#
# client-id is the QNSC ESO Platform application (client) id — an identifier,
# not a secret. ESO reads client-id and tenant-id from these annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-platform
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: bbdeecf7-0e6f-4e15-8825-5b03c97e4783
    azure.workload.identity/tenant-id: dc0f2078-ac28-4ff2-b21a-d4b28df32361
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kv-qnsc-platform
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          qnsc.vn/env: platform
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-qnsc-platform.vault.azure.net
      serviceAccountRef:
        name: eso-platform
        namespace: external-secrets
---
# ── cnpg-ca: the KUBERNETES-provider stores (§5.6) ──────────────────────────
#
# The CNPG server CA reaches the product namespaces through ESO, not by hand:
# an ExternalSecret in `<product>-<env>` reads the PUBLIC mirror Secret
# `pg-*-ca-pub` of data-<env> and copies it into `<product>-db-ca` (the chart
# mounts it for DATABASE_SSL_CA, §6.3). The stores turn Ready only once the
# clusters exist — on bootstrap (§14 step 2) they stay NotReady until then,
# expected.
#
# WHY A MIRROR AND NOT pg-*-ca DIRECTLY (security decision, 2026-10-21): the
# CNPG-managed `pg-*-ca` Secret holds BOTH the CA certificate AND `ca.key`.
# An ExternalSecret in a product namespace pointed at pg-*-ca could sync the
# whole Secret — key included — and a CA private key in a product namespace
# means anyone there can mint valid server certificates: a DB MITM. So the
# key NEVER crosses the namespace boundary:
#
#   pg-rova-ca         CNPG's Secret (ca.crt + ca.key), data-prod only
#   pg-rova-ca-pub     the mirror: ca.crt ONLY
#
# The CA is STATIC (2026-10-23 review — rotation loop removed): a 10-year CA
# is generated once at bootstrap (../cnpg/ca.md), hand-applied into data-<env>
# as BOTH Secrets and copied into kv-qnsc-admin. Nothing renews it, so the
# -pub mirror is a hand-applied copy too — the ca-sync ExternalSecret and
# Reloader were deleted with the loop (plan §5.6, PR 2026-10-23).
#
# and the RBAC below admits ONLY `pg-*-ca-pub`. The store-adjacent identity
# cannot read pg-*-ca at all — the vector is closed by resourceNames, not by
# template discipline.
#
# §5.6 says "one ClusterSecretStore cnpg-ca"; the kubernetes provider takes its
# REMOTE namespace at store level (`remoteNamespace`), and the CAs live in two
# namespaces — so this is TWO stores, one per data namespace, each read-only on
# exactly one mirrored Secret. The deviation is recorded here and for the plan
# PR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-cnpg-ca-reader
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-cnpg-ca-reader
  namespace: data-prod
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-rova-ca-pub, pg-opshub-ca-pub, pg-kb-ca-pub]   # opshub-prod/kb-prod join with their moves (cluster.sh --env prod --pg-cluster pg-<product> creates the mirror)
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-cnpg-ca-reader
  namespace: data-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-cnpg-ca-reader
subjects:
  - kind: ServiceAccount
    name: eso-cnpg-ca-reader
    namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-cnpg-ca-reader
  namespace: data-dev
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-dev-ca-pub]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-cnpg-ca-reader
  namespace: data-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-cnpg-ca-reader
subjects:
  - kind: ServiceAccount
    name: eso-cnpg-ca-reader
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-ca-prod
  annotations:
    # Not ready at bootstrap (the CNPG clusters do not exist yet): must not hold
    # root's sync waves. A real failure shows on the ExternalSecrets that use the store.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          qnsc.vn/tenant: product
          qnsc.vn/env: prod
  provider:
    kubernetes:
      remoteNamespace: data-prod
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-cnpg-ca-reader
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cnpg-ca-dev
  annotations:
    # Not ready at bootstrap (the CNPG clusters do not exist yet): must not hold
    # root's sync waves. A real failure shows on the ExternalSecrets that use the store.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          qnsc.vn/tenant: product
          qnsc.vn/env: dev
  provider:
    kubernetes:
      remoteNamespace: data-dev
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-cnpg-ca-reader
          namespace: external-secrets
---
# ── coder-db-secrets: the two Coder DB role passwords, coder -> data-prod ────
#
# pg-coder lives in data-prod with the other prod databases, while its two role
# passwords stay in kv-qnsc-platform (namespace `coder` assembles Coder's
# CODER_PG_CONNECTION_URL from the platform vault). CNPG reads
# bootstrap.initdb.secret and managed.roles[].passwordSecret in the Cluster's
# own namespace, so data-prod needs those two Secrets — without a second copy
# of the passwords in a second vault (the duplication the R2 audit removed).
#
# This is a kubernetes-provider store reading namespace `coder`, NOT a second
# vault path: the read identity is bound by a Role in `coder` with
# `resourceNames` on exactly `pg-coder-coder-migrator` and
# `pg-coder-coder-readonly`, and only namespace data-prod may use the store.
# It cannot read any other Secret there, and the platform vault's own store
# stays qnsc.vn/env=platform only (§7.1: a prod data namespace can never read
# the platform vault).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-coder-db-reader
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-coder-db-reader
  namespace: coder
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pg-coder-coder-migrator, pg-coder-coder-readonly]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-coder-db-reader
  namespace: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-coder-db-reader
subjects:
  - kind: ServiceAccount
    name: eso-coder-db-reader
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: coder-db-secrets
  annotations:
    # Not ready at bootstrap (the coder namespace's Secrets appear with the Coder
    # app): must not hold root's sync waves. A real failure shows on the
    # ExternalSecrets that use the store.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: data-prod
  provider:
    kubernetes:
      remoteNamespace: coder
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-coder-db-reader
          namespace: external-secrets
