# ── pg-kb backups: barman-cloud plugin -> R2 `qnsc-backups`, prefix pg-kb/ ──
#
# Continuous WAL archiving plus a nightly base backup, restorable to any point in
# the retention window (PITR). Same design as pg-opshub-backup.yaml. ⚠ INFRA FIRST:
# infra live/onprem/backups.tf locks `pg-rova/pg-rova-g1/wals/` and
# `pg-opshub/pg-opshub-g1/wals/`; the `pg-kb/pg-kb-g1/wals/` lock rule does not exist
# yet (infra lane, the same one-line rule), and without it kb's WAL archive is
# deletable by whoever holds the rw token. Barman prunes (the lifecycle deliberately
# does not), so retentionPolicy equals the lock window.
#
# Credential: the SAME bucket-scoped R2 token the other prod clusters use
# (r2-backup-rw-* in kv-qnsc-prod), already created by the owner. No new secret.
# R2 needs the two checksum variables on the plugin sidecar, or uploads fail with a
# checksum/trailer error (ONPREM-PLAN §6.3).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-kb-r2-backup
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-kb-r2-backup
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: r2-backup-rw-access-key-id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: r2-backup-rw-secret-access-key }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    # Irreversible backup configuration: removal is an explicit owner step, never a prune.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: pg-kb-r2
  namespace: data-prod
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://qnsc-backups/pg-kb/
    endpointURL: https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: { name: pg-kb-r2-backup, key: ACCESS_KEY_ID }
      secretAccessKey: { name: pg-kb-r2-backup, key: ACCESS_SECRET_KEY }
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
      - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
---
# Nightly base backup, 02:30 ICT (19:30 UTC; the cron has a SECONDS field first).
# Scheduled after pg-rova (19:00) and pg-opshub (19:15) so the base backups do not
# overlap. `immediate` takes one at creation so the restore test has a backup to
# restore without waiting for the first night.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-kb-nightly
  namespace: data-prod
spec:
  schedule: "0 30 19 * * *"          # 19:30 UTC
  immediate: true
  backupOwnerReference: self
  cluster: { name: pg-kb }
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
