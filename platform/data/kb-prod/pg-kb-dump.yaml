# ── pg-kb nightly logical dump -> R2 qnsc-backups/dumps/ (ONPREM-PLAN §10.2) ──
#
# The second, independent copy next to barman: a plain `pg_dump -Fc` that restores into
# any Postgres, with no dependency on the barman plugin, the WAL archive or CNPG.
#
#   dumps/daily/    every night       lifecycle 15 d   (infra live/onprem/backups.tf)
#   dumps/weekly/   Sundays           lifecycle 35 d
#   dumps/monthly/  the 1st           lifecycle 100 d
# Bucket lock: dumps/ is locked 14 d, so an object name can be written ONCE (an
# overwrite is refused). Names are dated (pg-kb-YYYY-MM-DD.dump) and the uploader
# skips a key that already exists, so a retried Job or a manual re-run the same day
# is a logged no-op.
#
# Two containers, one emptyDir: the init container dumps (pg_dump 18 from the CNPG
# image) as kb_readonly — SELECT everywhere, no DDL and no ownership. NOT the
# migrator owner, which could write; and the role carries BYPASSRLS because kb
# tables use row-level security and pg_dump otherwise refuses with "query would be
# affected by row-level security policy" (gitops#305). The main container uploads
# (aws-cli with the R2 checksum variables, from its OWN pg-kb-dump-r2 credential:
# the same kv-qnsc-prod keys r2-dump-rw-*, never the pg-dump-r2 Secret that the
# rova and opshub dump jobs read from the platform-data-prod app). Success is two
# log lines: `DUMP-READY ...` and `DUMP-OK <key> ...`.
#
# The dump overrides the role's 30 s statement_timeout for ITS session with
# PGOPTIONS, which a role may do. TLS is verified against the pg-kb-ca-pub mirror.
# The pod waits for pg_isready first: data-prod-admit admits a new pod a few seconds
# after it starts (#91).
#
# Run on demand:  kubectl -n data-prod create job --from=cronjob/pg-kb-dump pg-kb-dump-manual-1
# Restore:        pg_restore -d <empty db> --no-owner <file>   (after download with any S3 client)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-kb-dump-r2
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-kb-dump-r2
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: r2-dump-rw-access-key-id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: r2-dump-rw-secret-access-key }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-kb-dump
  namespace: data-prod
spec:
  schedule: "0 21 * * *"           # 21:00 UTC = 04:00 ICT, after pg-rova's and pg-opshub's dumps and the base backups
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 86400   # 1 day: one Job, one pod; the log is in Loki and the alerting covers a failed run
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-kb-dump
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
              env:
                - { name: PGHOST, value: pg-kb-rw.data-prod.svc }
                - { name: PGDATABASE, value: kb }
                - { name: PGSSLMODE, value: verify-full }
                - { name: PGSSLROOTCERT, value: /etc/pg-ca/ca.crt }
                - { name: PGOPTIONS, value: "-c statement_timeout=0 -c idle_in_transaction_session_timeout=0" }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-kb-kb-readonly, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-kb-kb-readonly, key: password } }
              command:
                - sh
                - -c
                - |
                  set -eu
                  for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done
                  pg_isready -q -t 2 || { echo "DUMP-FAIL server not ready"; exit 1; }
                  pg_dump -Fc -f /work/pg-kb.dump
                  pg_restore --list /work/pg-kb.dump >/dev/null || { echo "DUMP-FAIL dump is not readable"; exit 1; }
                  echo "DUMP-READY bytes=$(wc -c </work/pg-kb.dump) sha256=$(sha256sum /work/pg-kb.dump | cut -d' ' -f1)"
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: pg-ca, mountPath: /etc/pg-ca, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext: &restricted
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          containers:
            - name: upload
              image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
              env:
                - { name: HOME, value: /tmp }
                - { name: AWS_DEFAULT_REGION, value: auto }
                - { name: AWS_ENDPOINT_URL, value: "https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com" }
                - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
                - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: pg-kb-dump-r2, key: ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: pg-kb-dump-r2, key: ACCESS_SECRET_KEY } }
              command:
                - bash
                - -c
                - |
                  set -eu
                  f=/work/pg-kb.dump
                  size=$(wc -c <"$f")
                  name="pg-kb-$(date -u +%F).dump"
                  prefixes="daily"
                  [ "$(date -u +%u)" = 7 ] && prefixes="$prefixes weekly"
                  [ "$(date -u +%d)" = 01 ] && prefixes="$prefixes monthly"
                  for p in $prefixes; do
                    key="dumps/$p/$name"
                    # write-once: the bucket lock refuses an overwrite, so never try one
                    if aws s3api head-object --bucket qnsc-backups --key "$key" >/dev/null 2>&1; then
                      echo "DUMP-SKIP $key already exists"
                      continue
                    fi
                    aws s3 cp --only-show-errors "$f" "s3://qnsc-backups/$key"
                    got=$(aws s3api head-object --bucket qnsc-backups --key "$key" --query ContentLength --output text)
                    [ "$got" = "$size" ] || { echo "DUMP-FAIL $key uploaded $got bytes, expected $size"; exit 1; }
                    echo "DUMP-OK $key bytes=$size"
                  done
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext: *restricted
          volumes:
            - name: work
              emptyDir: { sizeLimit: 8Gi }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            - name: pg-ca
              secret: { secretName: pg-kb-ca-pub }
