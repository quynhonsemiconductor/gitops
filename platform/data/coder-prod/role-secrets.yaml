# ── coder_migrator / coder_readonly passwords, mirrored into data-prod ──────
#
# The pg-coder Cluster in this namespace needs its role password Secrets HERE
# (CNPG reads bootstrap.initdb.secret and managed.roles[].passwordSecret in its
# own namespace), but the passwords live in kv-qnsc-platform — the owner's seven
# coder secrets — because the Coder server builds CODER_PG_CONNECTION_URL in
# namespace `coder` from the platform vault (platform/coder/database.yaml).
#
# One source of truth, no second vault copy: namespace `coder` syncs the two
# Secrets from kv-qnsc-platform, and these ExternalSecrets copy them into
# data-prod through the `coder-db-secrets` ClusterSecretStore (a
# kubernetes-provider store; see platform/eso/stores-onprem.yaml). That store's
# read identity (`eso-coder-db-reader`) is bound by a Role in namespace `coder`
# with `resourceNames` on exactly these two Secrets — it cannot read anything
# else there, and only namespace data-prod may use the store.
#
# data-prod cannot read kv-qnsc-platform directly: the platform vault's
# ClusterSecretStore admits qnsc.vn/env=platform only, and widening it would
# expose every platform credential to every prod data namespace (§7.1).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-coder-migrator
  namespace: data-prod
  annotations:
    # Credential path used by a running workload: removal must be explicit, not a prune.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: coder-db-secrets, kind: ClusterSecretStore }
  target:
    name: pg-coder-coder-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: coder_migrator
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: pg-coder-coder-migrator, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-coder-readonly
  namespace: data-prod
  annotations:
    # Credential path used by a running workload: removal must be explicit, not a prune.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: coder-db-secrets, kind: ClusterSecretStore }
  target:
    name: pg-coder-coder-readonly
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: coder_readonly
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: pg-coder-coder-readonly, property: password } }
