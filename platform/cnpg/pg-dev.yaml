---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-migrator
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-opshub-migrator
