          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-dev-db-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-worker
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
