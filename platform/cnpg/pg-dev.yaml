# ── pg-dev: the dev Postgres, rova's part only (ONPREM-PLAN §6.3, §5.7) ──────
#
# ONE cluster for all dev products (`pg-dev` in `data-dev`, databases rova / opshub /
# kb); this PR adds the rova database and roles, opshub and kb join with their moves.
# values/rova/dev.yaml already points at pg-dev-rw.data-dev.svc.
#
# Roles are CNPG MANAGED roles whose passwords are plain-string Key Vault secrets
# (<product>-dev-db-*), synced here as kubernetes.io/basic-auth Secrets. The chart
# reads the SAME Key Vault secrets (secrets.db / dbWorker / dbMigrator), so a role and
# the app that logs in as it cannot disagree, and a rebuilt cluster gets the same
# passwords. rova_migrator owns the database (initdb), as the data-move runbook expects.
#
# TLS: provided-CA mode (cnpg/ca.md). The static CA Secret `pg-dev-ca` is hand-applied
# into data-dev BEFORE this syncs; CNPG issues and renews the server certificate itself.
#
# Dev is dump-only (§6.3: "pg_dump only, no WAL archiving"), so there is deliberately
# NO barman plugin / ObjectStore here. The nightly pg_dump CronJob is pg-dev-dump.yaml
# (one dump per database, dev/ prefix, 7-day lifecycle).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-dev
  namespace: data-dev
  annotations:
    # Irreversible: the PVCs carry an ownerReference to this Cluster, so deleting it
    # would garbage-collect the dev data. ArgoCD must never prune or cascade-delete it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  storage:
    size: 30Gi
  walStorage:
    size: 10Gi
  resources:
    # Right-sized 2026-11-04: 24h p95 for the dev Postgres was 198Mi against a
    # 2Gi request — the pod reserved the worst case for a database serving three
    # dev products with low traffic. 768Mi keeps request == limit (Guaranteed,
    # §5.7) and still leaves ~4x the measured p95 for page cache and backends.
    requests: { cpu: 500m, memory: 768Mi }
    limits: { memory: 768Mi }
  postgresql:
    parameters:
      timezone: UTC
      max_connections: "100"
      # 25% / 60% of the 768Mi limit (§15d). The old shared_buffers 512MB was
      # 25% of 2Gi; keeping it under a 768Mi cgroup would invite the OOM killer.
      # effective_cache_size is a planner estimate, not an allocation.
      shared_buffers: 192MB
      effective_cache_size: 460MB
      work_mem: 8MB
      maintenance_work_mem: 256MB   # pgvector HNSW builds (kb)
  certificates:
    serverCASecret: pg-dev-ca
  bootstrap:
    initdb:
      database: rova
      owner: rova_migrator
      secret:
        name: pg-dev-rova-migrator
  managed:
    roles:
      - name: rova_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-app
      - name: rova_worker
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-worker
      - name: rova_migrator
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-migrator
      # The dump role: SELECT everywhere, no DDL and no ownership. pg-dev-dump runs as this,
      # never as the migrator.
      - name: rova_readonly
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        # pg_read_all_data does not bypass row-level security: kb tables use RLS, and pg_dump refuses with
        # "query would be affected by row-level security policy". A dump role must read every row.
        bypassrls: true
        passwordSecret:
          name: pg-dev-rova-readonly
      # opshub joins with its dev move (the same three-role shape as rova: app and
      # worker are runtime, the migrator owns the database and holds DDL).
      - name: opshub_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-app
      - name: opshub_worker
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-worker
      - name: opshub_migrator
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-migrator
      - name: opshub_readonly
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        # pg_read_all_data does not bypass row-level security: kb tables use RLS, and pg_dump refuses with
        # "query would be affected by row-level security policy". A dump role must read every row.
        bypassrls: true
        passwordSecret:
          name: pg-dev-opshub-readonly
      # kb joins with its dev move: app (api + worker, one role) and the migrator that owns the database.
      - name: kb_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-kb-app
      - name: kb_migrator
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-kb-migrator
      - name: kb_readonly
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        # pg_read_all_data does not bypass row-level security: kb tables use RLS, and pg_dump refuses with
        # "query would be affected by row-level security policy". A dump role must read every row.
        bypassrls: true
        passwordSecret:
          name: pg-dev-kb-readonly
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-app
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-worker
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-worker
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_worker
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-worker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-migrator
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-migrator
---
# opshub's database. `Database` is a CNPG resource (operator 1.30): the cluster's
# initdb creates only rova, so every other product gets its database here, owned by
# its migrator — the same ownership rova has from initdb.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: opshub
  namespace: data-dev
spec:
  cluster:
    name: pg-dev
  name: opshub
  owner: opshub_migrator
  ensure: present
  databaseReclaimPolicy: retain   # a pruned Database must never drop product data
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-app
  namespace: data-dev
