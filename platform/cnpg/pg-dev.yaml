---
# ── Role timeouts ───────────────────────────────────────────────────────────
# CNPG 1.30 has no per-role GUC field — `Cluster.managed.roles` carries only
# ensure/login/passwordSecret, and the `DatabaseRole` CRD has no `parameters` at
# all (checked against the v1.30.1 CRDs; there is no 1.31 to wait for). So the
# settings must be applied by SQL, and rova's 0073 timeouts had never been
# applied on-prem at all.
#
# PostgreSQL decides this: a role may `ALTER ROLE <itself> SET …` with no
# CREATEROLE (verified: a LOGIN role with rolcreaterole=false altered its own
# rolconfig; the same statement against ANOTHER role fails with "Only roles with
# the CREATEROLE attribute and the ADMIN option …"). So each role applies its own
# timeouts, connecting with the password ESO already syncs for it.
#
# WHY NOT the alternatives:
#   - superuser (`enableSuperuserAccess: true`) would put a `postgres` credential
#     in data-dev for a two-line change. Not worth it when self-alter works.
#   - cluster-wide `postgresql.parameters` would also bind the migrators, whose
#     DDL must be allowed to run longer than 30 s — the exact reason rova's 0073
#     exempts them.
#   - connection-level `options` (node-postgres 8.22.0 does send them:
#     pg/lib/connection-parameters.js:83,151) needs a code change in opshub and
#     rova because their pools are built in code; not this repository's.
#
# One Job, one container per role, re-run on every sync (PostSync): ALTER ROLE …
# SET is idempotent, and a missing role or a stale password fails the hook loudly
# instead of silently doing nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-dev-role-timeouts
  namespace: data-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 259200   # 3 days of logs, then the Job and its pod are deleted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-dev-role-timeouts
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26          # postgres, the image's user
        runAsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rova-app
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-rova-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-rova-app, key: password } }
          # A new pod is admitted by data-dev-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused. Every retry of
          # a Job with restartPolicy Never is a NEW pod, so without this wait all attempts hit
          # that window (5 instant failures on 2026-11-02, and the same bug pg-rova fixed in #91).
          # Wait for the server (up to 2 min); psql still fails loudly on a missing role or a stale password.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE rova_app SET statement_timeout = '30s'; ALTER ROLE rova_app SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: rova-worker
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-rova-worker, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-rova-worker, key: password } }
          # A new pod is admitted by data-dev-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused. Every retry of
          # a Job with restartPolicy Never is a NEW pod, so without this wait all attempts hit
          # that window (5 instant failures on 2026-11-02, and the same bug pg-rova fixed in #91).
          # Wait for the server (up to 2 min); psql still fails loudly on a missing role or a stale password.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE rova_worker SET statement_timeout = '300s'; ALTER ROLE rova_worker SET idle_in_transaction_session_timeout = '300s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
        - name: opshub-app
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-app, key: password } }
          # A new pod is admitted by data-dev-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused. Every retry of
          # a Job with restartPolicy Never is a NEW pod, so without this wait all attempts hit
          # that window (5 instant failures on 2026-11-02, and the same bug pg-rova fixed in #91).
          # Wait for the server (up to 2 min); psql still fails loudly on a missing role or a stale password.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE opshub_app SET statement_timeout = '30s'; ALTER ROLE opshub_app SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
        - name: opshub-worker
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-worker, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-worker, key: password } }
          # A new pod is admitted by data-dev-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused. Every retry of
          # a Job with restartPolicy Never is a NEW pod, so without this wait all attempts hit
          # that window (5 instant failures on 2026-11-02, and the same bug pg-rova fixed in #91).
          # Wait for the server (up to 2 min); psql still fails loudly on a missing role or a stale password.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE opshub_worker SET statement_timeout = '120s'; ALTER ROLE opshub_worker SET idle_in_transaction_session_timeout = '180s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
