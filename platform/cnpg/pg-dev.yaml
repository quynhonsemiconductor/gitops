# ── pg-dev: the dev Postgres, rova's part only (ONPREM-PLAN §6.3, §5.7) ──────
#
# ONE cluster for all dev products (`pg-dev` in `data-dev`, databases rova / opshub /
# kb); this PR adds the rova database and roles, opshub and kb join with their moves.
# values/rova/dev.yaml already points at pg-dev-rw.data-dev.svc.
#
# Roles are CNPG MANAGED roles whose passwords are plain-string Key Vault secrets
# (<product>-dev-db-*), synced here as kubernetes.io/basic-auth Secrets. The chart
# reads the SAME Key Vault secrets (secrets.db / dbWorker / dbMigrator), so a role and
# the app that logs in as it cannot disagree, and a rebuilt cluster gets the same
# passwords. rova_migrator owns the database (initdb), as the data-move runbook expects.
#
# TLS: provided-CA mode (cnpg/ca.md). The static CA Secret `pg-dev-ca` is hand-applied
# into data-dev BEFORE this syncs; CNPG issues and renews the server certificate itself.
#
# Dev is dump-only (§6.3: "pg_dump only, no WAL archiving"), so there is deliberately
# NO barman plugin / ObjectStore here. The nightly pg_dump CronJob is PLT-B7.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-dev
  namespace: data-dev
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql
    major: 18
  storage:
    size: 30Gi
  walStorage:
    size: 10Gi
  resources:
    # §5.7: 500m / 2 Gi, memory limit = request, no CPU limit.
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 2Gi }
  postgresql:
    parameters:
      timezone: UTC
      max_connections: "100"
      shared_buffers: 512MB
      work_mem: 8MB
      maintenance_work_mem: 256MB   # pgvector HNSW builds (kb)
  certificates:
    serverCASecret: pg-dev-ca
  bootstrap:
    initdb:
      database: rova
      owner: rova_migrator
      secret:
        name: pg-dev-rova-migrator
  managed:
    roles:
      - name: rova_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-app
      - name: rova_worker
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-worker
      - name: rova_migrator
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-rova-migrator
      # opshub joins with its dev move (the same three-role shape as rova: app and
      # worker are runtime, the migrator owns the database and holds DDL).
      - name: opshub_app
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-app
      - name: opshub_worker
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-worker
      - name: opshub_migrator
        ensure: present
        login: true
        passwordSecret:
          name: pg-dev-opshub-migrator
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-app
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-worker
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-worker
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_worker
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-worker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-rova-migrator
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-rova-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: rova_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: rova-dev-db-migrator
---
# opshub's database. `Database` is a CNPG resource (operator 1.30): the cluster's
# initdb creates only rova, so every other product gets its database here, owned by
# its migrator — the same ownership rova has from initdb.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: opshub
  namespace: data-dev
spec:
  cluster:
    name: pg-dev
  name: opshub
  owner: opshub_migrator
  ensure: present
  databaseReclaimPolicy: retain   # a pruned Database must never drop product data
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-app
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-opshub-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-dev-db-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-worker
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-opshub-worker
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: opshub_worker
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-dev-db-worker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-dev-opshub-migrator
  namespace: data-dev
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-dev, kind: ClusterSecretStore }
  target:
    name: pg-dev-opshub-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: opshub_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-dev-db-migrator
---
# ── Role timeouts ───────────────────────────────────────────────────────────
# CNPG 1.30 has no per-role GUC field — `Cluster.managed.roles` carries only
# ensure/login/passwordSecret, and the `DatabaseRole` CRD has no `parameters` at
# all (checked against the v1.30.1 CRDs; there is no 1.31 to wait for). So the
# settings must be applied by SQL, and rova's 0073 timeouts had never been
# applied on-prem at all.
#
# PostgreSQL decides this: a role may `ALTER ROLE <itself> SET …` with no
# CREATEROLE (verified: a LOGIN role with rolcreaterole=false altered its own
# rolconfig; the same statement against ANOTHER role fails with "Only roles with
# the CREATEROLE attribute and the ADMIN option …"). So each role applies its own
# timeouts, connecting with the password ESO already syncs for it.
#
# WHY NOT the alternatives:
#   - superuser (`enableSuperuserAccess: true`) would put a `postgres` credential
#     in data-dev for a two-line change. Not worth it when self-alter works.
#   - cluster-wide `postgresql.parameters` would also bind the migrators, whose
#     DDL must be allowed to run longer than 30 s — the exact reason rova's 0073
#     exempts them.
#   - connection-level `options` (node-postgres 8.22.0 does send them:
#     pg/lib/connection-parameters.js:83,151) needs a code change in opshub and
#     rova because their pools are built in code; not this repository's.
#
# One Job, one container per role, re-run on every sync (PostSync): ALTER ROLE …
# SET is idempotent, and a missing role or a stale password fails the hook loudly
# instead of silently doing nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-dev-role-timeouts
  namespace: data-dev
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-dev-role-timeouts
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26          # postgres, the image's user
        runAsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rova-app
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-rova-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-rova-app, key: password } }
          command: ["psql"]
          args:
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-c"
            - "ALTER ROLE rova_app SET statement_timeout = '30s'; ALTER ROLE rova_app SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        - name: rova-worker
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-rova-worker, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-rova-worker, key: password } }
          command: ["psql"]
          args:
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-c"
            - "ALTER ROLE rova_worker SET statement_timeout = '300s'; ALTER ROLE rova_worker SET idle_in_transaction_session_timeout = '300s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
        - name: opshub-app
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-app, key: password } }
          command: ["psql"]
          args:
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-c"
            - "ALTER ROLE opshub_app SET statement_timeout = '30s'; ALTER ROLE opshub_app SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
        - name: opshub-worker
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-dev-rw.data-dev.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-worker, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-dev-opshub-worker, key: password } }
          command: ["psql"]
          args:
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-c"
            - "ALTER ROLE opshub_worker SET statement_timeout = '120s'; ALTER ROLE opshub_worker SET idle_in_transaction_session_timeout = '180s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
