# ── CloudNativePG operator + barman plugin (ONPREM-PLAN §6.3) ───────────────
#
# helm upgrade --install cnpg cloudnative-pg/cloudnative-pg \
#   -n cnpg-system --create-namespace \
#   -f cnpg/values-operator.yaml --version <versions.yaml: platform.cloudnative-pg.version>
#
# helm upgrade --install plugin-barman-cloud cloudnative-pg/plugin-barman-cloud \
#   -n cnpg-system \
#   --version <versions.yaml: platform.plugin-barman-cloud.version>
#
# The plugin chart ships with defaults only — no values file here on purpose:
# its one knob that matters (cert-manager) is enabled by default, and cluster
# backup parameters (R2 bucket, credentials, the R2 checksum env) belong on the
# Cluster resources in wave 0, not on the plugin install (§6.3).
#
# §11.4 — the in-tree Barman Cloud support is deprecated and REMOVED in CNPG
# 1.31, so the plugin is the day-one mechanism, not a migration. The plugin
# chart requires cert-manager (its mTLS) — cert-manager/ is installed first.
#
# Backups go to R2 (§6.3/§10): the sidecars need the two checksum env vars
# R2's S3 API requires. Those belong on the CLUSTER resource (the plugin's
# parameters), not on the operator — they are recorded in the pg-rova
# manifest that lands with the cluster PR (wave 0), not here.
#
# Versions were verified 2026-10-20 against the upstream chart index:
#   cloudnative-pg      0.29.1  -> operator 1.30.1
#   plugin-barman-cloud 0.8.1   -> plugin  v0.15.1
operator:
  # §5.7 — 100m / 384Mi for operator + plugin, requests = limits (§5.7 rule).
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 384Mi }
  monitoring:
    # §12 — the one Alloy scrapes CNPG through a PodMonitor on 9187; the
    # data-prod NetworkPolicy admits `platform` on that port only.
    podMonitorEnabled: true
    grafanaDashboard:
      create: false
  config:
    # No monitoring-config ConfigMap secret yet; the default scrape config is
    # enough for the PodMonitor path above.
    create: false
