# ── data-prod: opshub-prod's access to ITS data only (prep, nothing runs yet) ───────────
#
# opshub-prod reaches only pg-opshub (5432) and valkey-opshub (6379), selected by the pods' own
# labels; rova-prod's access is scoped the same way in data-prod.yaml (audit N-M6), so neither
# product can open the other's instance even with the right credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-prod-opshub-postgres
  namespace: data-prod
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: pg-opshub }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: opshub-prod }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-prod-opshub-valkey
  namespace: data-prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: valkey-opshub }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: opshub-prod }
      ports:
        - { protocol: TCP, port: 6379 }
