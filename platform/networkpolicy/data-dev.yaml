# ── data-dev: the dev data namespace's ingress boundary (audit G-05) ────────
#
# The same shape as data-prod-admit (data-prod.yaml), for pg-dev and the two dev Valkeys. Before this,
# data-dev had no policy: any pod in the cluster, including rova-prod, could open 5432/6379 of the dev
# data (and the dev Valkeys have no auth yet).
#
# Admitted: the three dev product namespaces on 5432 (pg-dev) and 6379 (valkey-dev, valkey-kb-dev); the
# CNPG operator (cnpg-system) on 5432 and its instance-manager API 8000; pods in data-dev itself (the
# role-timeouts Job, instance pods); `platform` (the one Alloy) on the exporter ports 9187 and 9121 only.
# prod namespaces and restore-test are NOT admitted. Egress stays open (as in data-prod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-dev-admit
  namespace: data-dev
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rova-dev }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: opshub-dev }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kb-dev }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: 5432 }   # pg-dev
        - { protocol: TCP, port: 6379 }   # valkey-dev, valkey-kb-dev
    # the CNPG operator's instance-manager API (status, switchover): control plane, operator only
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: 8000 }
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform }
      ports:
        - { protocol: TCP, port: 9187 }   # CNPG exporter
        - { protocol: TCP, port: 9121 }   # valkey exporter
