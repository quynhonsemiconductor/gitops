# ── THE one on-prem NetworkPolicy (ONPREM-PLAN §6.2) ────────────────────────
#
# k3s enforces NetworkPolicies (§5.1), and these policies are the whole on-prem
# tenant boundary. NetworkPolicies are a union: the namespace-wide default-deny
# admits, and the per-cluster rules below narrow each data instance to its own
# product. Before this change, `data-prod-admit` admitted rova-prod to EVERY pod
# in data-prod, so rova-prod could reach pg-opshub/valkey-opshub (the
# data-prod-opshub-* policies on the server side added nothing to that union).
# Audit N-M6.
#
# `data-prod-admit` keeps only the callers that legitimately span the namespace:
# the CNPG operator (it manages every Cluster here), pods in data-prod itself
# (the dump/backup CronJobs run here), and `platform` (the one Alloy) on the
# METRICS ports only. Product access lives on the instance's own pods, selected
# by the label CNPG and the valkey StatefulSet set:
#   - pg-rova       -> rova-prod on 5432, plus restore-test (the weekly restore)
#   - valkey-rova   -> rova-prod on 6379
#
# Egress stays open for the same reason as before: pods must reach the internet
# (Graph, R2, GHCR) without this file becoming an allowlist that only breaks on
# Fridays.
#
# `cnpg-system` is where the CNPG operator and the barman plugin run
# (../namespaces/onprem.yaml, ../cnpg/operator.yaml): the selectors match its
# kubernetes.io/metadata.name, so the operator must be installed THERE.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-prod-admit
  namespace: data-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # The CNPG operator's own connections to the instances it manages (both
    # clusters live here): the SQL port and the instance-manager API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    # Same-namespace pods: the backup and dump CronJobs (§10) run IN
    # data-prod and talk to the instance Services.
    - from:
        - podSelector: {}
    # The observability plane: platform (the one Alloy) on the METRICS ports
    # only — CNPG's built-in exporter (9187) and the valkey exporter (9121).
    # §12: metrics leave the box; this is the ONLY platform traffic into
    # data-prod.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - { protocol: TCP, port: 9187 }
        - { protocol: TCP, port: 9121 }
---
# rova-prod -> pg-rova only. restore-test is the weekly restore (§10.4): it
# reads the R2 archive, but the check that the restored cluster answers is kept
# on this same door so a restore run never needs a new policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-prod-rova-postgres
  namespace: data-prod
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: pg-rova }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rova-prod }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: restore-test }
      ports:
        - { protocol: TCP, port: 5432 }
---
# rova-prod -> valkey-rova only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-prod-rova-valkey
  namespace: data-prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: valkey-rova }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rova-prod }
      ports:
        - { protocol: TCP, port: 6379 }
