# ── valkey-opshub — opshub PRODUCTION cache (§6.4), the same template as valkey-rova ─────────
#
# A DEDICATED instance in data-prod, allkeys-lru, no persistence (a cache may evict and loses nothing
# on restart that it did not already lose to eviction), so opshub prod does not share an eviction
# pool, sessions or a password with rova prod. Plain StatefulSet, no operator (§5.1). It requires a
# login from day one (the ACL ExternalSecret below), unlike the dev Valkeys of 2026-10.
# Image pinned by digest (§11.4): valkey/valkey:8.1.10, NEVER 8.2 (parity with ElastiCache 8.1).
---
# valkey-opshub — opshub prod cache. data-prod, LRU, no persistence: a cache may
# evict and loses nothing on restart that it did not already lose to eviction.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-opshub
  namespace: data-prod
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey-opshub
spec:
  serviceName: valkey-opshub
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: valkey-opshub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: valkey-opshub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # the image's `valkey` user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
          args:
            - valkey-server
            - --maxmemory
            - 96mb              # §5.7 — pod is 192Mi; half for the data, half for the process
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""                # no RDB snapshots — a cache repopulates
            - --appendonly
            - "no"
            - --aclfile
            - /etc/valkey-acl/users.acl     # `default` is OFF in that file: no anonymous access
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: valkey, containerPort: 6379 }
          resources:
            # §5.7 — 50m / 192Mi, requests = limits.
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 192Mi }
          # §9j — liveness is the process: valkey-cli ping answers without
          # touching persistence or replication.
          env:
            - name: EXPORTER_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey-opshub-acl, key: exporter-password } }
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli --no-auth-warning --user exporter --pass \"$EXPORTER_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli --no-auth-warning --user exporter --pass \"$EXPORTER_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: acl
              mountPath: /etc/valkey-acl
              readOnly: true
        # §12 — the one Alloy scrapes valkey metrics here (9121); the data-prod
        # NetworkPolicy admits `platform` on exactly this port.
        - name: exporter
          image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820   # versions.yaml (verified 2026-10-21, Docker Hub; v1.94.0 is <14 days old)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            - { name: REDIS_ADDR, value: "redis://localhost:6379" }
            - { name: REDIS_USER, value: exporter }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey-opshub-acl, key: exporter-password } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: data
          emptyDir: {}          # no persistence on a cache (§6.4)
        - name: tmp
          emptyDir: {}
        - name: acl
          secret: { secretName: valkey-opshub-acl, defaultMode: 0440 }
---
# ── valkey-opshub ACL (the Valkey hardening PR) ────────────────────────────────
# Before this, any pod admitted to 6379 (opshub-prod, restore-test) had unauthenticated
# full access, FLUSHALL and CONFIG included. Now `default` is off and there are two users:
#   opshub    the app: all keys, every command except @admin and @dangerous (no KEYS,
#             FLUSHALL, CONFIG, DEBUG, SHUTDOWN, ACL), plus INFO and CLIENT SETNAME/SETINFO
#             that ioredis sends on connect. EVAL stays allowed: platform-cache's rate
#             limiter, locks and the idempotency interceptor are Lua scripts.
#   exporter  the metrics sidecar and the probes: PING/INFO/CONFIG GET/DBSIZE/SLOWLOG/
#             LATENCY/MEMORY, no key access.
# ONE vault secret, `opshub-prod-redis-url` in kv-qnsc-prod, is the whole credential:
# redis://opshub:<hex>@valkey-opshub.data-prod.svc:6379. opshub reads it as VALKEY_URL (chart
# secrets.env); this ExternalSecret derives the ACL file from the SAME value, so the two can
# never disagree. The exporter password is the sha256 of that URL: derived, not a second
# secret to rotate. The ACL is read at START: after a rotation, restart the pod
# (kubectl -n data-prod rollout restart sts/valkey-opshub) right after opshub's secret refreshes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-opshub-acl
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: valkey-opshub-acl
    template:
      data:
        exporter-password: '{{ .url | sha256sum }}'
        users.acl: |
          user default off
          user opshub on >{{ index (splitList ":" (urlParse .url).userinfo) 1 }} ~* &* +@all -@admin -@dangerous +info +client|setname +client|setinfo
          user exporter on >{{ .url | sha256sum }} +ping +info +config|get +dbsize +slowlog +latency +memory +client|setname +client|setinfo
  data:
    - secretKey: url
      remoteRef: { key: opshub-prod-redis-url }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-opshub
  namespace: data-prod
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey-opshub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: valkey-opshub
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
