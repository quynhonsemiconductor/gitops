# ── pg-opshub: the opshub PRODUCTION Postgres on k3s-01 (ONPREM-PLAN §6.3) ──────
#
# One single-instance CNPG cluster in `data-prod`, one database (`opshub`), four
# roles. Same pattern as pg-dev (platform/cnpg/pg-dev.yaml); differences:
#   - passwords come from kv-qnsc-prod (opshub-prod-db-*), through ClusterSecretStore
#     kv-qnsc-prod, which only admits namespaces labelled qnsc.vn/env=prod;
#   - the CA is `pg-opshub-ca`, hand-applied from kv-qnsc-admin/platform-cnpg-ca-prod
#     BEFORE this syncs (cnpg/ca.md);
#   - a fourth role, opshub_readonly, for the owner's ad-hoc queries;
#   - backup to R2: pg-opshub-backup.yaml (ObjectStore, ScheduledBackup, credential).
#
# SIZING (one node, a few GB of data, a few requests a day): 1 instance,
# 500m / 2 Gi (memory limit = request, no CPU limit, §5.7), shared_buffers 512MB,
# 20 Gi data + 8 Gi WAL. WAL is archived to R2 once the backup PR lands, so the WAL
# volume only has to absorb a bad night of archive failures.
#
# opshub_migrator owns the database (initdb) and is NOCREATEROLE, as the data-move
# runbook expects: the restore runs as it, so it owns every restored object.
# opshub_readonly is a member of pg_read_all_data: SELECT everywhere, now and on
# future tables, without a grant list to maintain.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-opshub
  namespace: data-prod
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  # local-path-retain (platform/storage): PVs of NEW PVCs survive the deletion of the PVC or the
  # Cluster. The live PVCs were created on `local-path` (reclaimPolicy Delete) and are NOT
  # recreated: CNPG leaves existing PVCs alone, so their PVs are set to Retain once by hand
  # (runbooks/pv-retain.md). A rebuilt cluster picks this class up.
  storage:
    size: 20Gi
    storageClass: local-path-retain
  walStorage:
    size: 8Gi
    storageClass: local-path-retain
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 2Gi }
  postgresql:
    parameters:
      timezone: UTC
      max_connections: "100"
      shared_buffers: 512MB
      work_mem: 8MB
      maintenance_work_mem: 256MB
  certificates:
    serverCASecret: pg-opshub-ca
  # WAL archiving through the barman-cloud plugin (ObjectStore in pg-opshub-backup.yaml).
  # serverName is the archive's generation: g1 at the first build; after a recovery
  # into a rebuilt cluster, bump it (g2, ...) so a new timeline never writes into
  # the old archive (ONPREM-PLAN §6.3). Objects land under pg-opshub/pg-opshub-g1/.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-opshub-r2
        serverName: pg-opshub-g1
  bootstrap:
    initdb:
      database: opshub
      owner: opshub_migrator
      secret:
        name: pg-opshub-opshub-migrator
  managed:
    roles:
      - name: opshub_app
        ensure: present
        login: true
        passwordSecret: { name: pg-opshub-opshub-app }
      - name: opshub_worker
        ensure: present
        login: true
        passwordSecret: { name: pg-opshub-opshub-worker }
      - name: opshub_migrator
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret: { name: pg-opshub-opshub-migrator }
      - name: opshub_readonly
        ensure: present
        login: true
        inRoles: [pg_read_all_data]
        passwordSecret: { name: pg-opshub-opshub-readonly }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-opshub-opshub-app
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-opshub-opshub-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-prod-db-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-opshub-opshub-worker
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-opshub-opshub-worker
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_worker
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-prod-db-worker
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-opshub-opshub-migrator
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-opshub-opshub-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-prod-db-migrator
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-opshub-opshub-readonly
  namespace: data-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-prod, kind: ClusterSecretStore }
  target:
    name: pg-opshub-opshub-readonly
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"     # CNPG re-reads the role password when this changes
      data:
        username: opshub_readonly
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: opshub-prod-db-readonly
---
# ── Role timeouts (the dev values: app 30 s / 60 s, worker 120 s / 180 s) ─────────────────────────────────────
# Same mechanism and reasoning as pg-dev-role-timeouts (platform/cnpg/pg-dev.yaml):
# CNPG has no per-role GUC field, and a LOGIN role may ALTER ROLE itself with no
# CREATEROLE, so each role applies its own settings with the password ESO already
# syncs for it. No superuser credential. opshub_migrator is deliberately absent: its
# DDL must be allowed to run longer than 30 s (the reason 0073 exempts it).
# opshub_readonly gets the app's 30 s so a stray ad-hoc query cannot hold the node.
# PostSync, re-run on every sync; ALTER ROLE ... SET is idempotent and a missing
# role or stale password fails the hook loudly.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-opshub-role-timeouts
  namespace: data-prod
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 259200   # 3 days of logs, then the Job and its pod are deleted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-opshub-role-timeouts
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 26          # postgres, the image's user
        runAsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: opshub-app
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-opshub-rw.data-prod.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-app, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-app, key: password } }
          # A new pod is admitted by data-prod-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused.
          # Wait for the server (up to 2 min) instead of failing the first try.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE opshub_app SET statement_timeout = '30s'; ALTER ROLE opshub_app SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        - name: opshub-worker
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-opshub-rw.data-prod.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-worker, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-worker, key: password } }
          # A new pod is admitted by data-prod-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused.
          # Wait for the server (up to 2 min) instead of failing the first try.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE opshub_worker SET statement_timeout = '120s'; ALTER ROLE opshub_worker SET idle_in_transaction_session_timeout = '180s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        - name: opshub-readonly
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          env:
            - { name: PGHOST, value: pg-opshub-rw.data-prod.svc }
            - { name: PGDATABASE, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-readonly, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: pg-opshub-opshub-readonly, key: password } }
          # A new pod is admitted by data-prod-admit only once the network-policy
          # controller has seen it (a few seconds); until then 5432 is refused.
          # Wait for the server (up to 2 min) instead of failing the first try.
          command: ["sh", "-c", "for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done; exec psql -v ON_ERROR_STOP=1 -c \"$0\""]
          args:
            - "ALTER ROLE opshub_readonly SET statement_timeout = '30s'; ALTER ROLE opshub_readonly SET idle_in_transaction_session_timeout = '60s';"
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
