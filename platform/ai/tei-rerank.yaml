# ── tei-rerank — the shared cross-encoder reranker (ONPREM-PLAN §9.1) ────────
#
# Hugging Face text-embeddings-inference serving `BAAI/bge-reranker-v2-m3` at
# `/rerank`. Manifests only: **replicas 0 until KB has a client** — KB's
# CROSS_ENCODER path is off today, and an idle GPU pod would hold a time-slice
# and ~2.8 GB of VRAM for zero requests.
#
# Same pattern as tei-e5: sm_120 image line, model revision pinned, fp32,
# pre-pulled cache PVC, ClusterIP only, egress DNS only.
#
# ── fp32 AND THE VRAM BUDGET ────────────────────────────────────────────────
# The plan's "≈ 2.5 GB for e5 + reranker" is the FP16 figure. e5 runs fp32
# (parity), so the reranker follows at fp32: ~2.3 GB weights, ~2.8 GB with the
# runtime. e5 + rerank ≈ 5.8 GB of the 16 GB card. The reranker is NOT loaded
# while scaled to 0, so the budget only matters once KB enables it; see
# README.md.
#
# ── WHY NO PARITY GATE HERE ─────────────────────────────────────────────────
# The reranker returns scalar relevance scores, not vectors that are stored in
# the database. A slightly different score changes ranking quality, not the
# meaning of stored data, so there is nothing that would need re-embedding if
# it drifted. It is enabled when KB's client exists and evaluated as a search
# improvement, not as a data migration.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-rerank-model-cache
  namespace: ai
  labels:
    app.kubernetes.io/name: tei-rerank
    app.kubernetes.io/part-of: ai
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-rerank
  namespace: ai
  labels:
    app.kubernetes.io/name: tei-rerank
    app.kubernetes.io/part-of: ai
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-rerank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-rerank
        app.kubernetes.io/part-of: ai
    spec:
      nodeSelector:
        qnsc.vn/pool: ai
      tolerations:
        - key: qnsc.vn/pool
          operator: Equal
          value: ai
          effect: NoSchedule
      runtimeClassName: nvidia
      priorityClassName: ai
      terminationGracePeriodSeconds: 60
      containers:
        - name: tei-rerank
          image: ghcr.io/huggingface/text-embeddings-inference:120-1.9.4@sha256:bd8e5b1954146f7fe8590b64b959bc194433c6c38c036592a84d736841ca9400
          imagePullPolicy: IfNotPresent
          args:
            - --model-id=BAAI/bge-reranker-v2-m3
            - --revision=953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
            - --dtype=float32
            # No --pooling: this is a classification head, not an embedding
            # model. TEI detects the reranker task from the model config and
            # exposes /rerank; passing a pooling mode here would be wrong.
            - --max-client-batch-size=32
            - --max-batch-tokens=8192
            - --auto-truncate
            - --huggingface-hub-cache=/data/hub
            - --port=80
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
          ports:
            - { name: http, containerPort: 80, protocol: TCP }
            - { name: metrics, containerPort: 9000, protocol: TCP }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 4Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: model-cache, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tei-rerank-model-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tei-rerank
  namespace: ai
  labels:
    app.kubernetes.io/name: tei-rerank
    app.kubernetes.io/part-of: ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tei-rerank
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-rerank-clients
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tei-rerank
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [kb-dev, kb-prod]
      ports:
        - { protocol: TCP, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-rerank-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tei-rerank
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Suspended pre-pull, same shape as tei-e5's. Resume once before the first
# scale-up; it is the only pod in this file allowed outbound HTTPS.
apiVersion: batch/v1
kind: Job
metadata:
  name: tei-rerank-model-pull
  namespace: ai
  labels:
    app.kubernetes.io/name: tei-rerank-model-pull
    app.kubernetes.io/part-of: ai
spec:
  suspend: true
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-rerank-model-pull
    spec:
      restartPolicy: Never
      nodeSelector:
        qnsc.vn/pool: ai
      tolerations:
        - key: qnsc.vn/pool
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: pull
          image: python:3.13-slim@sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --quiet huggingface_hub==2.2.0
              python - <<'PY'
              from huggingface_hub import snapshot_download
              path = snapshot_download(
                  repo_id="BAAI/bge-reranker-v2-m3",
                  revision="953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e",
                  cache_dir="/data/hub",
              )
              print("cached at", path)
              PY
          env:
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: model-cache, mountPath: /data }
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tei-rerank-model-cache
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-rerank-model-pull-egress
  namespace: ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tei-rerank-model-pull
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
