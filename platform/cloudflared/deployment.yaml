# ── cloudflared — §3 ─────────────────────────────────────────────────────────
#
# The tunnel replaces the LOAD BALANCER, not the routing layer. It has exactly one
# ingress rule — a catch-all to the Gateway — and it is "configured once, never
# edited". Every per-product and per-pull-request route is an HTTPRoute in a
# product namespace, reconciled by ArgoCD.
#
# ONE Deployment per cluster, THREE replicas — not one per product. §3: "Per-product
# tunnels would be 7 × 2 = 14 pods and roughly a gibibyte of RAM proxying, with no
# benefit once Gateway does the routing. Cloudflare load-balances across
# connectors, so three replicas is HA."
#
# What this buys, and it is the strongest property of the architecture (§3):
# outbound only. No public IP, nothing to scan, no inbound surface at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      # Spread across zones: three replicas on one node is one node's worth of HA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      nodeSelector:
        kubernetes.io/arch: arm64
        karpenter.sh/capacity-type: spot
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.1   # versions.yaml
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared          # synced by ESO from qnsc/<env>/platform/ (§8)
                  key: token
          ports:
            - { name: metrics, containerPort: 2000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 128Mi }
          livenessProbe:
            # §9j — the process, and nothing else. cloudflared's /ready reports
            # connector health, which is a DEPENDENCY on Cloudflare's edge; using
            # it here would kill every replica during a Cloudflare blip and turn a
            # degraded edge into a total outage.
            httpGet: { path: /metrics, port: 2000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
