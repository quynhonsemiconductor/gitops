# ── cloudflared — §3 ─────────────────────────────────────────────────────────
#
# The tunnel IS the ingress. ONPREM-PLAN §5.3: there is no Gateway and no
# in-cluster router — the connector only runs `tunnel run` with its token, and
# every per-host+path ingress rule is REMOTELY MANAGED in the Tunnel config owned
# by infra/live/onprem, with a final catch-all http_status:404.
#
# ONE Deployment per cluster, TWO replicas — not one per product. Cloudflare
# load-balances across connectors, so two replicas are HA across restarts on the
# single node (§5.3; the EKS-era count was three).
#
# What this buys, and it is the strongest property of the architecture (§3):
# outbound only. No public IP, nothing to scan, no inbound surface at all.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      # No topology spread: one node (k3s-01, §5). Two replicas are HA across
      # restarts, which is what §5.3 asks for; there is no second zone to spread into.
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2   # versions.yaml (§11.4: monthly, by digest)
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared          # synced by ESO from qnsc/<env>/platform/ (§8)
                  key: token
          ports:
            - { name: metrics, containerPort: 2000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 128Mi }
          livenessProbe:
            # §9j — the process, and nothing else. cloudflared's /ready reports
            # connector health, which is a DEPENDENCY on Cloudflare's edge; using
            # it here would kill every replica during a Cloudflare blip and turn a
            # degraded edge into a total outage.
            httpGet: { path: /metrics, port: 2000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
