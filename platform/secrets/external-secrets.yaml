# §8 — a SecretStore for the PLATFORM namespace, with its own IRSA role, exactly
# as each product gets one. Not a ClusterSecretStore: cluster-wide would mean a
# single compromised namespace could read every product's secrets.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform
  namespace: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
# ONE Grafana credential, in ONE place. §8 records what the alternative cost:
#
#   "On 2026-09-06 the Grafana OTLP credential was rotated and the
#    `observability-token` field was updated in FOUR separate secrets, one per
#    product per environment. The value was wrong — built from the org id rather
#    than the stack id — and rova and opshub shipped no metrics or traces for
#    SEVEN DAYS. With Alloy there is ONE credential in one place."
#
# This is that one place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform, kind: SecretStore }
  target:
    name: grafana-cloud
  dataFrom:
    - find:
        path: qnsc/ENV/platform/grafana/
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: platform, kind: SecretStore }
  target:
    name: cloudflared
  data:
    - secretKey: token
      remoteRef:
        key: qnsc/ENV/platform/cloudflared-token
