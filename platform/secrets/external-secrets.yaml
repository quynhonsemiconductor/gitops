# The platform's own credentials, synced from kv-qnsc-platform (ONPREM-PLAN §7.1).
#
# Read through the `kv-qnsc-platform` ClusterSecretStore (../eso/stores-onprem.yaml),
# whose namespaceSelector admits only namespaces labelled qnsc.vn/env=platform
# (../namespaces/platform.yaml). No per-namespace store, no IRSA, no cloud role:
# ESO's service-principal certificate in `external-secrets` is the only identity.
#
# Without these, Alloy CrashLoopBackOffs on a nil endpoint and cloudflared connects
# to nothing while the cluster looks healthy.
---
# ONE Grafana credential, in ONE place (the 2026-09-06 blackout: four copies of the
# token, one wrong, seven days without metrics). Key Vault secret
# `platform-grafana-alloy` is a JSON object whose keys ARE the env var names Alloy
# reads (GRAFANA_TOKEN, GRAFANA_PROM_URL, GRAFANA_PROM_USER, GRAFANA_LOKI_URL,
# GRAFANA_LOKI_USER, GRAFANA_TEMPO_URL, GRAFANA_TEMPO_USER).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: grafana-cloud
  dataFrom:
    - extract:
        key: platform-grafana-alloy
---
# The `qnsc-apps` tunnel token: a plain-string Key Vault secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: cloudflared
  data:
    - secretKey: token
      remoteRef:
        key: platform-cloudflared-qnsc-apps
