# Not a secret — the cluster's own name, which Alloy stamps as an external label
# on every metric, log, trace and profile.
#
# Without it, dev and prod series collide: `up{namespace="rova"}` would match both
# environments, every dashboard would double-count, and §9h's absence alert would
# never fire because the other cluster is still reporting.
#
# `ENV` is replaced at bootstrap. It is a placeholder rather than derived because
# this file is applied by kubectl before any chart exists to template it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: platform
data:
  name: qnsc-ENV
