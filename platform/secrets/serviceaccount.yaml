# ── The identity the platform SecretStore authenticates as — §8 ──────────────
#
# THIS WAS MISSING, and without it nothing in `platform` can read a secret.
#
# `external-secrets.yaml`'s SecretStore authenticates with
#
#     auth.jwt.serviceAccountRef: { name: external-secrets }
#
# and a serviceAccountRef with no namespace resolves in the STORE's namespace. So ESO
# requests a token for `platform/external-secrets` and exchanges it for AWS
# credentials using the role annotated on THAT ServiceAccount. `eso/values.yaml` says
# as much: "each SecretStore names a product ServiceAccount, and ESO assumes THAT
# role via `auth.jwt.serviceAccountRef`."
#
# The account existed nowhere. `infra/live/cluster-dev` had already created the role
# and pointed its trust policy at exactly this subject —
#
#     system:serviceaccount:platform:external-secrets
#
# — so the AWS half was right and the Kubernetes half was absent. The failure mode is
# quiet: the SecretStore reports a validation error, every ExternalSecret in
# `platform` stays `SecretSyncedError`, and the workloads that mount those Secrets sit
# in `CreateContainerConfigError` — three symptoms, none of which names a missing
# ServiceAccount.
#
# ── NOT THE SAME ACCOUNT AS THE OPERATOR'S ──────────────────────────────────
#
# ESO's controller runs as `external-secrets/external-secrets`, a different account in
# a different namespace. That one exists and is annotated by the Helm chart. Its role
# is only for the operator's own calls; it is NOT what reads a product's secrets, and
# giving the operator blanket read access is precisely what §8's per-namespace stores
# exist to avoid.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: platform
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: qnsc-platform
  annotations:
    # ENV = dev | prod. Created by infra/live/cluster-<env> (§7c), whose trust policy
    # names this exact namespace/name pair — change one and the other must change in
    # the same commit.
    eks.amazonaws.com/role-arn: arn:aws:iam::608983206583:role/qnsc-ENV-external-secrets
