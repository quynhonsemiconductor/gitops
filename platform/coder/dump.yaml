# ── pg-coder nightly logical dump -> R2 qnsc-backups/dumps/ ─────────────────
#
# The pg-rova pattern (platform/data/rova-prod/pg-rova-dump.yaml), for a small
# database: a plain `pg_dump -Fc` that restores into any Postgres without the
# barman plugin or the WAL archive. Names carry the product so the shared
# dumps/ prefixes stay unambiguous:
#   dumps/daily/coder-YYYY-MM-DD.dump    lifecycle 15 d
#   dumps/weekly/...                     Sundays, 35 d
#   dumps/monthly/...                    the 1st, 100 d
# dumps/ is Bucket-Locked 14 d, so an object is written ONCE; the uploader
# skips an existing key, which makes a retried Job a logged no-op.
#
# The dump credential is the separate coder-r2-dump-* token (KV), never
# barman's. TLS is verified against the CNPG-generated pg-coder-ca secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-dump-r2
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: pg-coder-dump-r2
  data:
    - { secretKey: ACCESS_KEY_ID, remoteRef: { key: coder-r2-dump-access-key-id } }
    - { secretKey: ACCESS_SECRET_KEY, remoteRef: { key: coder-r2-dump-secret-access-key } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-coder-dump
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  schedule: "0 20 * * *"          # 20:00 UTC = 03:00 ICT, an hour after the base backup
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-coder-dump
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
              env:
                - { name: PGHOST, value: pg-coder-rw.coder.svc }
                - { name: PGDATABASE, value: coder }
                - { name: PGSSLMODE, value: verify-full }
                - { name: PGSSLROOTCERT, value: /etc/pg-ca/ca.crt }
                - { name: PGOPTIONS, value: "-c statement_timeout=0 -c idle_in_transaction_session_timeout=0" }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-coder-coder-readonly, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-coder-coder-readonly, key: password } }
              command:
                - sh
                - -c
                - |
                  set -eu
                  for i in $(seq 60); do pg_isready -q -t 2 && break; sleep 2; done
                  pg_isready -q -t 2 || { echo "DUMP-FAIL server not ready"; exit 1; }
                  pg_dump -Fc -f /work/pg-coder.dump
                  pg_restore --list /work/pg-coder.dump >/dev/null || { echo "DUMP-FAIL dump is not readable"; exit 1; }
                  echo "DUMP-READY bytes=$(wc -c </work/pg-coder.dump) sha256=$(sha256sum /work/pg-coder.dump | cut -d' ' -f1)"
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: pg-ca, mountPath: /etc/pg-ca, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext: &restricted
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          containers:
            - name: upload
              image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
              env:
                - { name: HOME, value: /tmp }
                - { name: AWS_DEFAULT_REGION, value: auto }
                - { name: AWS_ENDPOINT_URL, value: "https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com" }
                - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
                - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: pg-coder-dump-r2, key: ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: pg-coder-dump-r2, key: ACCESS_SECRET_KEY } }
              command:
                - bash
                - -c
                - |
                  set -eu
                  f=/work/pg-coder.dump
                  size=$(wc -c <"$f")
                  name="coder-$(date -u +%F).dump"
                  prefixes="daily"
                  [ "$(date -u +%u)" = 7 ] && prefixes="$prefixes weekly"
                  [ "$(date -u +%d)" = 01 ] && prefixes="$prefixes monthly"
                  for p in $prefixes; do
                    key="dumps/$p/$name"
                    if aws s3api head-object --bucket qnsc-backups --key "$key" >/dev/null 2>&1; then
                      echo "DUMP-SKIP $key already exists"
                      continue
                    fi
                    aws s3 cp --only-show-errors "$f" "s3://qnsc-backups/$key"
                    got=$(aws s3api head-object --bucket qnsc-backups --key "$key" --query ContentLength --output text)
                    [ "$got" = "$size" ] || { echo "DUMP-FAIL $key uploaded $got bytes, expected $size"; exit 1; }
                    echo "DUMP-OK $key bytes=$size"
                  done
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext: *restricted
          volumes:
            - name: work
              emptyDir: { sizeLimit: 2Gi }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            - name: pg-ca
              secret: { secretName: pg-coder-ca }
