# ── pg-coder restore test (the pg-rova pattern, design §9) ──────────────────
#
# A backup is only a backup once it is restored. ON DEMAND, never scheduled:
#
#   kubectl -n coder create job --from=cronjob/pg-coder-restore-test rt-$(date +%s)
#   kubectl -n coder logs -f job/<job>                    # ends RESTORE-TEST: PASS|FAIL
#   kubectl -n coder get cm pg-coder-restore-test-result -o yaml
#
# The Job applies a throwaway Cluster `pg-coder-restore-test` that RECOVERS from
# s3://qnsc-backups/pg-coder/ (latest base backup + archived WAL), waits for
# Ready, runs sanity queries inside the restored instance, and ALWAYS deletes
# the Cluster on exit. It uses a READ-ONLY R2 token (coder-r2-ro-*), so nothing
# here can write into the production archive. The restored cluster has NO
# plugins block: it never archives WAL of its own.
#
# Stays in namespace `coder` (env=platform) so it can read kv-qnsc-platform. The
# runner's RBAC is a Role in that namespace only; the storage class is the
# default so the throwaway PVC is deleted with the cluster (no retained PV per
# run, unlike local-path-retain).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-r2-restore
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: pg-coder-r2-restore
  data:
    - { secretKey: ACCESS_KEY_ID, remoteRef: { key: coder-r2-ro-access-key-id } }
    - { secretKey: ACCESS_SECRET_KEY, remoteRef: { key: coder-r2-ro-secret-access-key } }
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: pg-coder-r2-read
  namespace: coder
spec:
  configuration:
    destinationPath: s3://qnsc-backups/pg-coder/
    endpointURL: https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId: { name: pg-coder-r2-restore, key: ACCESS_KEY_ID }
      secretAccessKey: { name: pg-coder-r2-restore, key: ACCESS_SECRET_KEY }
    wal: { compression: gzip }
  instanceSidecarConfiguration:
    env:
      - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
      - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-coder-restore-runner
  namespace: coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-coder-restore-runner
  namespace: coder
rules:
  # Create/read are needed to run a restore at all; DELETE is narrowed to the ONE
  # throwaway cluster this runner owns, so the Role can never delete pg-coder.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: ["pg-coder-restore-test"]
    verbs: [delete, patch, update]
  # The restored cluster's pod name is fixed by its Cluster name.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: ["pg-coder-restore-test-1"]
    verbs: [get, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: ["pg-coder-restore-test-1"]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: ["pg-coder-restore-test-result"]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-coder-restore-runner
  namespace: coder
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pg-coder-restore-runner }
subjects:
  - { kind: ServiceAccount, name: pg-coder-restore-runner, namespace: coder }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-coder-restore-test-script
  namespace: coder
data:
  cluster.yaml: |
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: pg-coder-restore-test
      namespace: coder
    spec:
      instances: 1
      imageCatalogRef:
        apiGroup: postgresql.cnpg.io
        kind: ClusterImageCatalog
        name: postgresql
        major: 18
      storage:
        size: 5Gi          # >= pg-coder's data volume
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 512Mi }
      postgresql:
        parameters: { timezone: UTC, shared_buffers: 128MB }
      bootstrap:
        recovery:
          source: pg-coder
          database: coder
          owner: coder_migrator
      externalClusters:
        - name: pg-coder
          plugin:
            name: barman-cloud.cloudnative-pg.io
            parameters:
              barmanObjectName: pg-coder-r2-read
              serverName: pg-coder-g1
      # NO `plugins:` block: this cluster must not archive WAL anywhere.
  run.sh: |
    #!/usr/bin/env bash
    set -uo pipefail
    NS=coder C=pg-coder-restore-test POD=pg-coder-restore-test-1
    REQUIRE_DATA=${REQUIRE_DATA:-0}
    TIMEOUT=${READY_TIMEOUT:-1800}
    status=FAIL detail="did not finish"
    started=$(date -u +%FT%TZ)

    record() {
      kubectl -n "$NS" create configmap pg-coder-restore-test-result \
        --from-literal=status="$status" --from-literal=started="$started" \
        --from-literal=finished="$(date -u +%FT%TZ)" --from-literal=detail="$detail" \
        --from-literal=require_data="$REQUIRE_DATA" --dry-run=client -o yaml \
        | kubectl apply -f - >/dev/null || true
    }
    cleanup() {
      echo "teardown: deleting cluster $C"
      trap '' TERM INT
      kubectl -n "$NS" delete cluster "$C" --wait=true --timeout=300s --ignore-not-found &
      wait $! || true
      record
      echo "RESTORE-TEST: $status ($detail)"
      [ "$status" = PASS ]
    }
    trap 'cleanup; exit $?' EXIT
    trap 'exit 143' TERM INT

    q() { kubectl -n "$NS" exec "$POD" -c postgres -- psql -X -At -v ON_ERROR_STOP=1 -d coder -c "$1"; }
    fail() { detail="$1"; echo "FAIL: $1"; exit 1; }

    kubectl -n "$NS" get cluster "$C" >/dev/null 2>&1 && fail "leftover cluster $C exists; delete it first"

    echo "restoring latest pg-coder-g1 backup + WAL into $C"
    kubectl -n "$NS" apply -f /work/cluster.yaml || fail "apply cluster"
    kubectl -n "$NS" wait --for=condition=Ready "cluster/$C" --timeout="${TIMEOUT}s" &
    wait $! || fail "cluster not Ready within ${TIMEOUT}s (restore failed or no backup)"

    [ "$(q 'select pg_is_in_recovery()')" = f ] || fail "still in recovery"
    [ "$(q "select pg_get_userbyid(datdba) from pg_database where datname='coder'")" = coder_migrator ] \
      || fail "database coder missing or not owned by coder_migrator"
    [ "$(q "select count(*) from pg_roles where rolname in ('coder_migrator','coder_readonly')")" = 2 ] \
      || fail "a coder role is missing"
    [ "$(q "select count(*) from pg_roles where rolname='coder_migrator' and (rolcreaterole or rolsuper)")" = 0 ] \
      || fail "coder_migrator has CREATEROLE or SUPERUSER"

    tables=$(q "select count(*) from pg_tables where schemaname = 'public'") || fail "table count"
    if [ "$(q "select to_regclass('public.schema_migrations') is not null")" = t ]; then
      migs=$(q "select count(*) from public.schema_migrations")
    else
      migs=0
    fi
    readable=$(q "select count(*) from pg_tables t where schemaname = 'public' and has_table_privilege('coder_migrator', format('%I.%I',schemaname,tablename), 'SELECT')")
    for n in "$tables" "$migs" "$readable"; do [[ $n =~ ^[0-9]+$ ]] || fail "a sanity query returned '$n', not a number"; done
    echo "app tables=$tables migrations=$migs coder_migrator_selectable=$readable"

    [ "$readable" = "$tables" ] || fail "coder_migrator cannot SELECT $((tables - readable)) of $tables tables"
    if [ "$REQUIRE_DATA" = 1 ]; then
      [ "$tables" -gt 0 ] || fail "REQUIRE_DATA=1 but no application tables"
      [ "$migs" -gt 0 ] || fail "REQUIRE_DATA=1 but no migrations recorded"
    fi
    status=PASS detail="tables=$tables migrations=$migs data_required=$REQUIRE_DATA"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-coder-restore-test
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  schedule: "0 20 * * 0"
  suspend: true                  # on demand only
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pg-coder-restore-test
        spec:
          serviceAccountName: pg-coder-restore-runner
          restartPolicy: Never
          terminationGracePeriodSeconds: 330
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: run
              image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
              command: ["bash", "/work/run.sh"]
              env:
                - { name: REQUIRE_DATA, value: "0" }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          volumes:
            - name: work
              configMap: { name: pg-coder-restore-test-script }
