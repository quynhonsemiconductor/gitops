# ── Coder's database credentials in namespace `coder` ──────────────────────
#
# The DATABASE ITSELF IS NOT HERE. pg-coder runs in data-prod with the other
# prod databases (platform/data/coder-prod/pg-coder.yaml), so its barman
# backup, dump and restore test use the prod R2 credentials that already exist
# there (r2-backup-rw / r2-dump-rw / r2-backup-ro in kv-qnsc-prod) instead of a
# coder-r2-* copy in kv-qnsc-platform — SA decision 2026-11-06 from the R2 token
# audit; rotating a token then touches one vault.
#
# What this file keeps is the half that belongs to the namespace:
#   - the two role password Secrets, from kv-qnsc-platform (the owner's seven
#     coder secrets) — the Coder server builds its connection URL from them;
#   - `coder-env`, the one Secret the chart reads: CODER_PG_CONNECTION_URL plus
#     the OIDC settings.
# data-prod gets copies of the same two passwords through
# platform/data/coder-prod/role-secrets.yaml (a kubernetes-provider store whose
# RBAC is limited to these Secret names), so there is one source of truth and no
# second vault copy.
#
# The CA in data-prod is the shared prod CA (`pg-coder-ca` / `pg-coder-ca-pub`,
# created by `cluster.sh --env prod --pg-cluster pg-coder`); Coder connects with
# sslmode=require over the pod network, which the coder egress policy bounds.
---
# ── role password Secrets (CNPG re-reads on change) ─────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-coder-migrator
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: pg-coder-coder-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }
      data:
        username: coder_migrator
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: coder-db-migrator } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-coder-coder-readonly
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: pg-coder-coder-readonly
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }
      data:
        username: coder_readonly
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: coder-db-readonly } }
---
# ── Coder's environment: the DB URL, OIDC and the allowed group ─────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-env
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: coder-env
    template:
      data:
        # CNPG's read-write Service in data-prod; sslmode=require (the CA is
        # cluster-local and Coder does not mount it).
        CODER_PG_CONNECTION_URL: "postgresql://coder_migrator:{{ .dbpass }}@pg-coder-rw.data-prod.svc.cluster.local:5432/coder?sslmode=require"
        CODER_OIDC_ISSUER_URL: "{{ .issuer }}"
        CODER_OIDC_CLIENT_ID: "{{ .clientid }}"
        CODER_OIDC_CLIENT_SECRET: "{{ .clientsecret }}"
        CODER_OIDC_ALLOWED_GROUPS: "{{ .allowedgroups }}"
  data:
    - { secretKey: dbpass, remoteRef: { key: coder-db-migrator } }
    - { secretKey: issuer, remoteRef: { key: coder-oidc-issuer-url } }
    - { secretKey: clientid, remoteRef: { key: coder-oidc-client-id } }
    - { secretKey: clientsecret, remoteRef: { key: coder-oidc-client-secret } }
    - { secretKey: allowedgroups, remoteRef: { key: coder-oidc-allowed-groups } }
