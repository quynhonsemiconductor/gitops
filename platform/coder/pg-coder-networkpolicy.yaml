# ── pg-coder: the database's ingress boundary (mirrors data-prod-admit) ─────
#
# The cluster is in a PLATFORM namespace, not data-prod, so data-prod-admit
# does not cover it. Admitted:
#   - the Coder server (namespace coder, app.kubernetes.io/name: coder) on 5432;
#   - the CNPG operator and its instance manager (cnpg-system) on 5432 and the
#     instance-manager API 8000;
#   - the one Alloy collector (platform) on the exporter port 9187;
#   - pods in this namespace (instance pods themselves).
# Nothing else in the cluster may reach Postgres. Egress is not restricted here
# (the operator and replicas need it); the control plane's own egress policy
# already bounds Coder.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-coder-admit
  namespace: coder
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: pg-coder }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: coder }
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform }
      ports:
        - { protocol: TCP, port: 9187 }
    - from:
        - podSelector: {}
