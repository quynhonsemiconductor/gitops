# Coder OSS control plane (VLSI platform design §3, §5; owner "go VLSI" 2026-11-06).
#
# Chart: oci://ghcr.io/coder/chart/coder, pinned in versions.yaml (2.38.6,
# manifest digest recorded there). OSS features only: Entra OIDC with
# CODER_OIDC_ALLOWED_GROUPS, template TTL + activity bump, Kubernetes limits.
# Quotas/audit/group-sync are Premium and are replaced outside Coder (design §5).
# The behavioural notes below were verified on 2.38.1 and re-checked on 2.38.6:
# its `coder server --help` golden is byte-identical between the two tags.
#
# No Cloudflare Access in front: the `coder` CLI, `coder ssh` and the /api/v2
# websockets do not follow an Access redirect (design §5.2). The server is
# reachable over WARP only, through the private route in live/edge (follow-up).
#
# Secrets arrive from kv-qnsc-prod through ESO (database.yaml): the OIDC
# pair, CODER_OIDC_ALLOWED_GROUPS (the grp-qnsc-vlsi object id) and the
# Postgres URL. Nothing here is a value.
coder:
  # commandArgs REPLACES the chart's default args (`[server]`), it does not
  # append: the chart pins `command: [/opt/coder]`, so without `server` first
  # the binary parses this as a root flag and dies with
  # `unknown flag: --external-auth-github-default-provider-enable`.
  # Flags here — not env — for anything Coder's env parser reserves for its own
  # list formats (see the CODER_EXTERNAL_AUTH_* note below).
  commandArgs:
    - server
    - --external-auth-github-default-provider-enable=false
  image:
    repo: ghcr.io/coder/coder
    # tag@digest: Kubernetes accepts both; the digest is the pin and the tag is
    # for readable `docker images`. Digest from ghcr.io/coder/coder:v2.38.6
    # (manifest list) on 2026-11-07.
    tag: "v2.38.6@sha256:c9245405c482ede17699d65deb8c21488a17feff5497fc84d6a350c395da2bdd"
  service:
    # ClusterIP: the tunnel (infra live/edge) is the only path in. No
    # LoadBalancer, no NodePort.
    type: ClusterIP
  # Non-secret environment. The secret half comes from envFrom below.
  env:
    - { name: CODER_ACCESS_URL, value: "https://coder.qnsc.vn" }
    # Workspace apps are served on *.coder.qnsc.vn (private, not proxied).
    # NO SCHEME: the 2.38 `coder server --help` types this as a string in the form
    # "*.example.com" (only --access-url is a `url`). With an https:// prefix the
    # server dies at boot: `parsing env: parse "Wildcard Access URL": hostname
    # pattern must not contain a scheme`.
    - { name: CODER_WILDCARD_ACCESS_URL, value: "*.coder.qnsc.vn" }
    # Plain HTTP inside the pod would break coder ssh's TLS expectations; the
    # wildcard secret below enables TLS on the server itself.
    - { name: CODER_TLS_MIN_VERSION, value: "tls12" }
    # Coder 2.38 coderd/idpsync/group.go: the allow list is only evaluated
    # when GroupField names the claim. Without it CODER_OIDC_ALLOWED_GROUPS is
    # IGNORED and any tenant user can sign up. `groups` is the Entra app-role /
    # group claim name (the app must emit it).
    # https://coder.com/docs/reference/cli/server#--oidc-group-field
    - { name: CODER_OIDC_GROUP_FIELD, value: "groups" }
    # ── email claims from Entra (2026-11-07: "Email not verified") ─────────
    # Entra ID v2 access/ID tokens do not carry `email_verified` (the claim
    # exists only for some account types, and Coder rejects the login when it is
    # absent/untrue: "Verify the <user>@qnsc.vn email address on your OIDC
    # provider"). Coder's documented Microsoft setting is to ignore it:
    # https://coder.com/docs/admin/users/oidc-auth/microsoft
    - { name: CODER_OIDC_IGNORE_EMAIL_VERIFIED, value: "true" }
    # Which claim is the email. Coder's Microsoft guide sets `upn`: the `email`
    # claim is absent for many Entra users and follows the `mail` attribute,
    # while `upn` is the tenant-controlled sign-in name. A guest's UPN carries
    # the `#EXT#` marker and the external domain, so the domain filter below
    # rejects it outright.
    - { name: CODER_OIDC_EMAIL_FIELD, value: "upn" }
    # Only our tenant's verified domain: belt and braces on top of
    # CODER_OIDC_ALLOWED_GROUPS. Guests and B2B identities fail this check.
    - { name: CODER_OIDC_EMAIL_DOMAIN, value: "qnsc.vn" }
    # ── sign-in: Entra OIDC is the only listed door (2026-11-06) ──────────
    # The 2.38 line injects a DEFAULT GitHub OAuth2 app (log:
    # "injecting default github external auth provider") and a default GitHub
    # external-auth provider when nothing is configured, so /setup showed a
    # "GitHub" button. Both are opt-out bools in `coder server --help`
    # (default: true). With them off the only provider on the page is OIDC.
    - { name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE, value: "false" }
    # The EXTERNAL-AUTH one CANNOT be an env var: Coder parses every
    # CODER_EXTERNAL_AUTH_<N>_* as numbered provider N, so the name above made
    # the server exit once the database connected with
    # `error: read external auth providers from env: parse number:
    # GITHUB_DEFAULT_PROVIDER_ENABLE` (reproduced with the pinned image against
    # a throwaway Postgres). It is set as the FLAG at the top of this file.
    # The single sign-in button's label (`--oidc-sign-in-text string`).
    # CODER_OIDC_ICON_URL is deliberately unset: it needs a publicly reachable
    # icon asset, and none is hosted for this deployment (no third-party hotlink).
    - { name: CODER_OIDC_SIGN_IN_TEXT, value: "Sign in with Microsoft" }
    # Password login is DISABLED for everyone. The 2.38 line does NOT exempt Owners
    # (tested 2026-11-07: POST /api/v2/users/login -> "Password authentication
    # is disabled."), so a break-glass sign-in needs a one-line PR flipping this
    # to false, then a revert. Procedure: README, "Break-glass".
    # https://coder.com/docs/reference/cli/server#--disable-password-auth
    - { name: CODER_DISABLE_PASSWORD_AUTH, value: "true" }
    # No usage data leaves the platform.
    # https://coder.com/docs/reference/cli/server#--telemetry-enable
    - { name: CODER_TELEMETRY_ENABLE, value: "false" }
    # ── Prometheus metrics (2026-11-07: only `up` ever reached Mimir) ──────
    # `--prometheus-enable` has NO default in 2.38.1 (cli/server.go), so the
    # exporter was OFF and :2112 was not listening: the scrape failed and the
    # estator saw only `up`=0. The chart injects
    # CODER_PROMETHEUS_ADDRESS=0.0.0.0:2112 and adds the `prometheus-http`
    # containerPort only when this env value is exactly "true".
    # https://coder.com/docs/reference/cli/server#--prometheus-enable
    - { name: CODER_PROMETHEUS_ENABLE, value: "true" }
    # `coderd_agents_up` (one series per workspace, the workspaces panel) is
    # registered only inside the collect-agent-stats branch. Bounded by the
    # workspace count, which is what the Alloy allowlist keeps it for.
    # https://coder.com/docs/reference/cli/server#--prometheus-collect-agent-stats
    - { name: CODER_PROMETHEUS_COLLECT_AGENT_STATS, value: "true" }
  tls:
    # cert-manager writes this Secret (tls.yaml). The chart mounts tls.crt /
    # tls.key and sets CODER_TLS_CERT_FILE / CODER_TLS_KEY_FILE.
    secretNames: ["coder-tls"]
  envFrom:
    # CODER_PG_CONNECTION_URL, CODER_OIDC_ISSUER_URL, CODER_OIDC_CLIENT_ID,
    # CODER_OIDC_CLIENT_SECRET, CODER_OIDC_ALLOWED_GROUPS.
    - secretRef: { name: coder-env }
  resources:
    # Design §7: about 0.5 GB for the control plane. memoryLimit = request
    # (no CPU limit), the platform convention.
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  serviceAccount:
    # Least privilege: Coder gets Role/RoleBinding in vlsi-ws, not a
    # ClusterRole over every workspace namespace.
    workspaceNamespaces:
      - name: vlsi-ws
  # One replica: HA is an Enterprise feature (design §5).
  replicaCount: 1
  # The provisioner runs embedded in the server for ten engineers; a separate
  # provisioner Deployment is a scaling option, not needed now.
