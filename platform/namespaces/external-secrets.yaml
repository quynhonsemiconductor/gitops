---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  # No qnsc.vn/env and no qnsc.vn/tenant (ONPREM-PLAN §6.2: operators, no
  # ExternalSecrets): the ClusterSecretStores select on qnsc.vn/env, so nothing
  # an operator namespace holds can read a vault. The ESO operator RUNS here
  # (helm install -n external-secrets), next to the hand-applied service-principal
  # certificate Secrets the stores authenticate with (§14 step 2, operator stdin,
  # never Git) and the eso-cnpg-ca-reader account of stores-onprem.yaml. It
  # was installed into `platform` before, which put the operator in the namespace
  # the kv-qnsc-platform store serves.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
