---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    qnsc.vn/env: platform
    qnsc.vn/tenant: platform
    # Found in the local k3d bootstrap rehearsal (2026-10-26): eso/stores-
    # onprem.yaml puts the hand-applied SP certificate Secrets and the
    # eso-cnpg-ca-reader Role/RoleBindings in THIS namespace (§14 step 2 —
    # operator stdin, never Git), but nothing created the namespace and the
    # stores' apply failed with `namespaces "external-secrets" not found`.
    # Workload-free by design: it holds the store credentials only.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
