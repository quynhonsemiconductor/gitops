    pod-security.kubernetes.io/warn: restricted
---
# kb prod (kb.qnsc.vn): prep, no Application row yet (appsets/products.yaml). The label
# qnsc.vn/env=prod is what admits it to kv-qnsc-prod through the ClusterSecretStore; the
# namespace is created by the platform bootstrap, never by the product Application.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: kb-prod
  labels:
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Operator namespaces (ONPREM-PLAN §6.2) ───────────────────────────────────
# `—` in the plan's label column: no qnsc.vn/env (no ExternalSecret lives in them,
# so no ClusterSecretStore selects them) and no qnsc.vn/tenant (no admission
# policy binds on them). Declared in git so Helm installs into existing namespaces
# (no --create-namespace). Upstream charts, so `baseline` is enforced and
# `restricted` is audited and warned, the same trade as `platform` and `argocd`.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: cnpg-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Coder (VLSI workspaces control plane) ───────────────────────────────────
# env=platform so its ExternalSecrets may read kv-qnsc-platform (the OIDC pair,
# the DB passwords and the R2 tokens). It is NOT a product namespace: no
# qnsc.vn/tenant label, so the product VAPs do not bind here.
# PSA baseline: the Coder server runs as non-root but writes its home/cache.
# qnsc.vn/env=prod, NOT platform (SA decision 2026-11-06): Coder is a production
# service for the VLSI team, so it reads kv-qnsc-prod like rova/opshub/kb, the
# same vault as its database. All seven coder-* secrets live there; the
# kv-qnsc-platform copies were deleted.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: coder
  labels:
    qnsc.vn/env: prod
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── vlsi-ws: one pod + PVC per VLSI engineer (design §3, §5.1) ──────────────
# NO qnsc.vn/env label on purpose: no ESO store admits this namespace, so a
# workspace can never read a vault. The ResourceQuota/LimitRange and the
# NetworkPolicy land with the vlsi-ws PR.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: vlsi-ws
  labels:
    # restricted, now that the workspace template is hardened (no privilege
    # escalation, ALL capabilities dropped, RuntimeDefault seccomp, non-root).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
