# ArgoCD. §5b, §10b, §13.
#
# helm upgrade --install argocd argo/argo-cd \
#   -n argocd --create-namespace -f values.yaml \
#   --version <versions.yaml: platform.argo-cd.version>
#
# ── IT RUNS IN PROD AND MANAGES BOTH CLUSTERS ────────────────────────────────
# §5b, and §2 footnotes the isolation claim for exactly this reason: "ArgoCD
# reaches both clusters by design… it means the isolation below is 'no shared
# control plane EXCEPT the deployer'."
#
# The $10-15/month that arrangement saves is not why. It is how a deployer has to
# work — and being the only component with credentials on both sides makes its
# own RBAC and its repository access the thing to review carefully.
#
# §2b — one of the THREE components whose API pins the Kubernetes version.

global:
  nodeSelector:
    karpenter.sh/capacity-type: spot

configs:
  cm:
    # SSO through Entra, which rova and opshub already authenticate against (§4b).
    # No local accounts beyond the admin below, which is disabled.
    oidc.config: |
      name: Entra
      issuer: $oidc.entra.issuer
      clientID: $oidc.entra.clientID
      clientSecret: $oidc.entra.clientSecret
      requestedScopes: [openid, profile, email, groups]

    # §10b — the admin account is disabled after bootstrap. It is a shared
    # credential with no name attached, which is the opposite of every other
    # access decision in this design.
    admin.enabled: "false"

    # The chart lives in ECR as an OCI artefact (§11c).
    helm.valuesFileSchemes: >-
      secrets+gpg-import,secrets+age-import,secrets,https

    timeout.reconciliation: 180s

  rbac:
    # §10b — "developers get read + sync on dev, read-only on prod. Production
    # changes go through a reviewed pull request in `gitops`, not through the
    # ArgoCD UI."
    #
    # A UI that can sync prod is a second path around branch protection, which
    # would make branch protection decorative.
    policy.default: ""
    policy.csv: |
      p, role:developer, applications, get, */*, allow
      p, role:developer, applications, sync, products/*-dev, allow
      p, role:developer, applications, action/*, products/*-dev, allow
      p, role:developer, logs, get, */*, allow
      p, role:developer, exec, create, */*, deny

      p, role:platform-admin, applications, *, */*, allow
      p, role:platform-admin, clusters, *, *, allow
      p, role:platform-admin, repositories, *, *, allow

      g, qnsc:developers, role:developer
      g, qnsc:platform, role:platform-admin

    scopes: "[groups, email]"

  params:
    # Cloudflare Access fronts the UI (§4b `protected`), so ArgoCD does not
    # terminate TLS itself.
    server.insecure: true

controller:
  replicas: 1     # a reconciler; a restart costs one reconciliation interval
  serviceAccount:
    annotations:
      # Created by infra/live/cluster-prod. It is what cluster-dev grants an
      # access entry to — the ONE non-human principal with cluster-admin on dev.
      eks.amazonaws.com/role-arn: arn:aws:iam::608983206583:role/qnsc-prod-argocd
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { memory: 1Gi }

repoServer:
  replicas: 2
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::608983206583:role/qnsc-prod-argocd
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 512Mi }

applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 256Mi }

server:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 256Mi }

  # Reached through the tunnel and Cloudflare Access, like every other internal
  # tool (§4b `protected`). No ALB, no public endpoint.
  service:
    type: ClusterIP

redis-ha:
  enabled: false     # §5d — no self-hosted stateful systems for three engineers

dex:
  enabled: false     # Entra directly, no broker in between

notifications:
  enabled: false     # §9e renders the alerts. ArgoCD notifying separately would
                     # be a second alerting path with its own subscriber list —
                     # and §8 records what happened the last time a topic had none
