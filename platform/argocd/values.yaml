# ArgoCD. §5b, §10b, §13.
#
# helm upgrade --install argocd argo/argo-cd \
#   -n argocd -f values.yaml \
#   --version <versions.yaml: platform.argo-cd.version>
#
# The `argocd` namespace is declared in ../namespaces/argocd.yaml (labels first,
# so Helm adopts it). ONE k3s cluster: ArgoCD manages only the cluster it runs in
# (https://kubernetes.default.svc), so there is no cluster registration.
#
# §2b — one of the THREE components whose API pins the Kubernetes version.

configs:
  cm:
    # LOCAL ADMIN, NO SSO (ONPREM-PLAN §9: ArgoCD SSO waits for "a second person
    # needs ArgoCD"; today the UI is behind Cloudflare Access with MFA). The admin
    # password is a bcrypt hash synced by ESO into `argocd-secret`
    # (externalsecret.yaml), never in Git. The previous Entra OIDC block named
    # `$oidc.entra.*` keys nothing ever created, and its RBAC used GitHub-style
    # group names where Entra sends GUIDs, so there was no working login at all.
    admin.enabled: "true"

    # The chart is a PUBLIC OCI artefact on ghcr.io (H-D22) — plain https.
    helm.valuesFileSchemes: >-
      secrets+gpg-import,secrets+age-import,secrets,https

    timeout.reconciliation: 180s

    # ONPREM-PLAN §11.2: root orders its child Applications by sync wave, which only
    # works if an Application reports its OWN health (the default check ignores
    # child Applications, so every wave would be "healthy" at once).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  # No `rbac` block: the built-in admin account holds role:admin, and the group
  # bindings that used to be here (qnsc:developers, qnsc:platform) only mean
  # something with SSO. They come back with it (ONPREM-PLAN §9).

  params:
    # Cloudflare Access fronts the UI (§4b `protected`), so ArgoCD does not
    # terminate TLS itself.
    server.insecure: true

controller:
  replicas: 1     # a reconciler; a restart costs one reconciliation interval
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { memory: 1Gi }
  # §12 — metrics Service, scraped by the k8s-monitoring collector
  # (platform/alloy) by port name `http-metrics` in the argocd namespace.
  # ServiceMonitor stays off: there is no operator managing these Services.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  replicas: 2
  # NO IRSA ANNOTATION, and the one that used to be here was INERT.
  #
  # It named `qnsc-prod-argocd`, whose trust policy in
  # `infra/live/cluster-prod/iam.tf` allows exactly one subject:
  # `system:serviceaccount:argocd:argocd-application-controller`. This pod's
  # ServiceAccount is `argocd-repo-server`, so the token exchange would have
  # failed with "Not authorized to perform sts:AssumeRoleWithWebIdentity" — the
  # same ServiceAccount-name-versus-trust-condition mismatch already recorded for
  # eso on 2026-09-16, found again here on 2026-09-19.
  #
  # Removed rather than fixed by widening the trust, deliberately: that role is
  # what cluster-dev grants an EKS access entry to, so adding this subject would
  # hand dev cluster-admin to the component that renders untrusted Helm charts.
  #
  # The repo-server needs no cloud identity: the chart is PUBLIC on
  # ghcr.io/quynhonsemiconductor/charts and is pulled anonymously (H-D22) —
  # no repository credential, and the ECR token refresher this used to need
  # is long gone.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 512Mi }
  # §12 — metrics Service, scraped by the k8s-monitoring collector
  # (platform/alloy) by port name `http-metrics` in the argocd namespace.
  # ServiceMonitor stays off: there is no operator managing these Services.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 256Mi }
  # §12 — metrics Service, scraped by the k8s-monitoring collector
  # (platform/alloy) by port name `http-metrics` in the argocd namespace.
  # ServiceMonitor stays off: there is no operator managing these Services.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

server:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 256Mi }
  # §12 — metrics Service, scraped by the k8s-monitoring collector
  # (platform/alloy) by port name `http-metrics` in the argocd namespace.
  # ServiceMonitor stays off: there is no operator managing these Services.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  # Reached through the tunnel and Cloudflare Access, like every other internal
  # tool (§4b `protected`). No ALB, no public endpoint.
  service:
    type: ClusterIP

redis-ha:
  enabled: false     # §5d — no self-hosted stateful systems for three engineers

dex:
  enabled: false     # no SSO yet, so no broker (ONPREM-PLAN §9: SSO waits for its trigger)

# ── Deploy notifications ─────────────────────────────────────────────────────
#
# The deploy event has ONE source: ArgoCD. It posts to the Teams Workflows
# webhook as an Adaptive Card and writes a Grafana annotation, so "what is
# running where" is visible without opening the cluster.
#
# TRIGGERS (global subscriptions below, selected by the labels the AppSet puts
# on every Application):
#   prod  sync Succeeded · sync Failed/Error · health Degraded
#   dev   sync Failed/Error only — a successful dev sync is noise.
#
# The Teams payload is the message envelope Teams Workflows requires:
#   {"type":"message","attachments":[{contentType: adaptive, content: <card>}]}
# A plain {"text": ...} (the retired Office 365 Connector format) is accepted
# with 202 and silently dropped, so it is built explicitly here instead of
# relying on a notifier's idea of a card.
#
# The Grafana annotation is written through the generic webhook service rather
# than the built-in `grafana` service: the built-in one takes its tags from the
# subscription recipient string, which is static per Application, and the
# annotation must carry the deployed version. `version` is the 7-character
# gitops revision of the sync — the one version ArgoCD actually knows (prod
# images are pinned by digest, so no image tag appears in the Application).
#
# US $teams-webhook-url / $grafana-annotations-url / $grafana-annotations-token
# are expanded by the notifications controller from `argocd-notifications-secret`
# (created by ESO from kv-qnsc-platform, platform/argocd/externalsecret.yaml).
# No URL or token is in this file.
notifications:
  enabled: true
  secret:
    create: false          # ESO owns argocd-notifications-secret

  notifiers:
    service.webhook.teams: |
      url: $teams-webhook-url
      headers:
        - name: Content-Type
          value: application/json
    service.webhook.grafana: |
      url: $grafana-annotations-url
      headers:
        - name: Authorization
          value: Bearer $grafana-annotations-token
        - name: Content-Type
          value: application/json

  templates:
    template.qnsc-deploy: |
      webhook:
        teams:
          method: POST
          body: |
            {{- $op := .app.status.operationState | default dict -}}
            {{- $sync := .app.status.sync | default dict -}}
            {{- $health := .app.status.health | default dict -}}
            {{- $labels := .app.metadata.labels | default dict -}}
            {{- $product := index $labels "qnsc.vn/product" | default "" -}}
            {{- $env := index $labels "qnsc.vn/env" | default "" -}}
            {{- $phase := index $op "phase" | default "Unknown" -}}
            {{- $status := index $health "status" | default "Unknown" -}}
            {{- $revision := index $sync "revision" | default "" -}}
            {{- $color := "Good" -}}
            {{- if or (eq $phase "Error") (eq $phase "Failed") (eq $status "Degraded") -}}
            {{- $color = "Attention" -}}
            {{- end -}}
            {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": null,
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "size": "Medium",
                        "weight": "Bolder",
                        "wrap": true,
                        "color": "{{ $color }}",
                        "text": "Deploy {{ $product }} {{ $env }}: {{ $phase }}"
                      },
                      {
                        "type": "FactSet",
                        "facts": [
                          { "title": "Application", "value": {{ .app.metadata.name | toJson }} },
                          { "title": "Sync", "value": {{ $phase | toJson }} },
                          { "title": "Health", "value": {{ $status | toJson }} },
                          { "title": "Revision", "value": {{ $revision | toJson }} }
                        ]
                      },
                      {
                        "type": "TextBlock",
                        "wrap": true,
                        "isSubtle": true,
                        "text": {{ index $op "message" | default "" | toJson }}
                      }
                    ]
                  }
                }
              ]
            }
        grafana:
          method: POST
          body: |
            {{- $op := .app.status.operationState | default dict -}}
            {{- $sync := .app.status.sync | default dict -}}
            {{- $health := .app.status.health | default dict -}}
            {{- $labels := .app.metadata.labels | default dict -}}
            {{- $product := index $labels "qnsc.vn/product" | default "" -}}
            {{- $env := index $labels "qnsc.vn/env" | default "" -}}
            {{- $phase := index $op "phase" | default "Unknown" -}}
            {{- $status := index $health "status" | default "Unknown" -}}
            {{- $revision := index $sync "revision" | default "" -}}
            {{- $version := $revision | trunc 7 | default "unknown" -}}
            {
              "text": {{ printf "deploy %s %s: %s (health %s, revision %s)" $product $env $phase $status $revision | toJson }},
              "tags": ["deploy", {{ $product | toJson }}, {{ $env | toJson }}, {{ printf "version=%s" $version | toJson }}]
            }

  triggers:
    trigger.on-qnsc-deploy-succeeded: |
      - description: Sync succeeded
        oncePer: app.status.sync.revision
        send: [qnsc-deploy]
        when: app.status.operationState.phase in ['Succeeded']
    trigger.on-qnsc-deploy-failed: |
      - description: Sync failed or errored
        send: [qnsc-deploy]
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-qnsc-deploy-degraded: |
      - description: Application health is Degraded
        send: [qnsc-deploy]
        when: app.status.health.status == 'Degraded'

  subscriptions:
    - recipients: [webhook:teams, webhook:grafana]
      triggers: [on-qnsc-deploy-succeeded, on-qnsc-deploy-failed, on-qnsc-deploy-degraded]
      selector: qnsc.vn/env=prod
    - recipients: [webhook:teams, webhook:grafana]
      triggers: [on-qnsc-deploy-failed]
      selector: qnsc.vn/env=dev

