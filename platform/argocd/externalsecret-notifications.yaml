# Deploy-notification credentials: the Teams Workflows webhook and the Grafana
# annotations API. Values live in kv-qnsc-platform; this only names them, so
# rotating a URL or token never touches Git.
#
# Its own file (and its own ExternalSecret) so a missing vendor item cannot
# affect argocd-admin: ESO marks only THIS object NotReady, and the admin secret
# keeps syncing from externalsecret.yaml.
#
# The notifications controller expands `$teams-webhook-url` and the two Grafana
# keys from this Secret (platform/argocd/values.yaml `notifiers`). Creation is
# left to ESO: the Helm chart is told NOT to create the Secret
# (`notifications.secret.create: false`), so there is exactly one owner.
#
# UNTIL THE OWNER CREATES THE THREE KV ITEMS: ArgoCD's built-in health check for
# external-secrets.io/ExternalSecret reports a non-Ready object as Degraded
# (`SecretSyncedError`), so the platform-secrets Application shows Degraded and
# root's wave ordering waits there (root waits for each wave's Applications to
# be Healthy). Nothing crashes: the API/worker/platform workloads in earlier
# waves keep running, the notifications controller starts and logs that the
# secret keys are missing, and no Teams/Grafana message is sent. Creating the
# items and letting ESO refresh (or `kubectl annotate externalsecret
# argocd-notifications force-sync=$(date +%s) --overwrite`) clears it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: teams-webhook-url
      remoteRef:
        key: platform-argocd-teams-webhook
    # FULL annotations endpoint, e.g. https://<stack>.grafana.net/api/annotations.
    - secretKey: grafana-annotations-url
      remoteRef:
        key: platform-argocd-grafana-url
    - secretKey: grafana-annotations-token
      remoteRef:
        key: platform-argocd-grafana-token
