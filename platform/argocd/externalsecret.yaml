# ArgoCD local admin password (ONPREM-PLAN §9: no SSO yet).
#
# Merges `admin.password` (a bcrypt hash) into the argocd-secret that the Helm
# chart creates. `Merge` touches only the keys named here, so ArgoCD's own keys
# (server.secretkey, ...) and the chart's are left alone; `Retain` keeps the
# Secret if this object is ever deleted. It is applied AFTER `helm install argocd`
# (the target must exist) and retries until it does.
#
# admin.passwordMtime is deliberately NOT set: an ExternalSecret template would
# re-stamp it on every refresh and invalidate every session each hour. ArgoCD
# treats an absent mtime as "unknown".
#
# SOURCE: `platform-argocd-admin-bcrypt` in kv-qnsc-platform, the bcrypt HASH
# only. The plaintext password lives in kv-qnsc-admin, which no ESO store reads
# (ONPREM-PLAN §7.1: "nobody automated"), so the hash is what crosses into the
# platform vault. The argocd namespace is labelled qnsc.vn/env=platform, which
# is what admits it to the kv-qnsc-platform store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: admin.password
      remoteRef:
        key: platform-argocd-admin-bcrypt
---
# Deploy-notification credentials: the Teams Workflows webhook and the Grafana
# annotations API. Values live in kv-qnsc-platform; this only names them, so
# rotating a URL or token never touches Git.
#
# The notifications controller expands `$teams-webhook-url` and the two Grafana
# keys from this Secret (platform/argocd/values.yaml `notifiers`). Creation is
# left to ESO: the Helm chart is told NOT to create the Secret
# (`notifications.secret.create: false`), so there is exactly one owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { name: kv-qnsc-platform, kind: ClusterSecretStore }
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: teams-webhook-url
      remoteRef:
        key: platform-argocd-teams-webhook
    - secretKey: grafana-annotations-url
      remoteRef:
        key: platform-argocd-grafana-url
    - secretKey: grafana-annotations-token
      remoteRef:
        key: platform-argocd-grafana-token
