# ── ArgoCD ECR credential refresher — §5b, §11c ──────────────────────────────
#
# WHAT THIS CLOSES. appsets/products.yaml pulls the product chart as an OCI
# artefact from 608983206583.dkr.ecr.ap-southeast-1.amazonaws.com (chart
# charts/qnsc-service). argocd/values.yaml configures Entra SSO and RBAC and
# NOTHING for repository authentication, so ArgoCD has no credential for that
# registry and every Application's source silently fails to resolve.
#
# ── THE 12-HOUR TRAP, WRITTEN DOWN WHERE IT WILL BE FOUND ────────────────────
# ECR authorization tokens EXPIRE AFTER 12 HOURS. A static repository Secret with
# a token pasted in works until lunchtime and then STOPS — and the failure is the
# quiet kind: ArgoCD keeps the last successfully-resolved manifests and reports the
# app as Synced/Healthy while it silently stops seeing new chart versions. It
# presents as a STALE APP (a release that "didn't take"), NOT as an auth error in
# any dashboard. Someone chases a broken pipeline for an afternoon before finding
# the expired token. That is the specific failure this CronJob prevents.
#
# ── MECHANISM CHOICE, AND WHY ─────────────────────────────────────────────────
# ArgoCD has NO native mechanism to stay authenticated to ECR: upstream issue
# argoproj/argo-cd#8097 ("Helm OCI Registry with refresh token") is still open, and
# the pinned chart is argo-cd 8.5.0 / ArgoCD 3.x (versions.yaml) — the feature does
# not exist in it, so this is not a case of using a built-in. The established
# pattern is a scheduled job that mints a fresh ECR token and writes it into the
# repository Secret. Chosen:
#
#   CronJob in the argocd namespace, IRSA, `aws ecr get-login-password`, patch the
#   repository Secret every 6 HOURS.
#
# 6h, not 11h59m: the token lives 12h, so a 6h cadence means a single failed run
# (a Spot reclaim mid-job, a transient STS blip) still leaves 6h of validity before
# the next attempt — the schedule never rides the edge of expiry. §9's alerting is
# not wired to this job, so "one miss is survivable" is a design property, not a
# hope.
#
# The alternative — a third-party controller (argocd-ecr-updater, the ecr-secret
# operator) — is one more component whose API pins a version (§2b lists the three
# the estate already carries and treats a fourth as a cost). A 30-line CronJob that
# shells `aws` and `kubectl patch` pins nothing and is auditable at a glance.
#
# ── INFRA ACTION REQUIRED — IRSA ROLE THIS CANNOT CREATE ─────────────────────
# The ServiceAccount below is annotated with an IRSA role that does NOT yet exist.
# ArgoCD runs only in prod, so it follows the §7c `qnsc-ENV-<component>` convention
# with ENV pinned to prod (the same shape eso/values.yaml `qnsc-ENV-external-secrets`
# and keda/values.yaml `qnsc-ENV-keda` use):
#
#   ROLE NAME:  qnsc-prod-argocd-ecr
#   TRUST:      web-identity on the PROD cluster OIDC provider, scoped to
#               system:serviceaccount:argocd:argocd-ecr-refresher
#   PERMISSIONS:
#     - ecr:GetAuthorizationToken        on "*"  (this action is account-level;
#                                         ECR does not scope it to a repository)
#     - ecr:GetDownloadUrlForLayer,
#       ecr:BatchGetImage,
#       ecr:BatchCheckLayerAvailability  on
#       arn:aws:ecr:ap-southeast-1:608983206583:repository/charts/qnsc-service
#       (read on the chart repository — the token must be able to PULL, not just
#        authenticate). The chart repository itself is being added by another
#        worker in infra/live/bootstrap; this role's read grant depends on it.
#
#   It is created by infra/live/cluster-prod (like qnsc-prod-external-secrets and
#   qnsc-prod-keda) — a cluster-scoped platform identity that outlives a deploy
#   (§7). A separate role from qnsc-prod-argocd itself: that role's job is
#   cluster-admin on both clusters, and mixing registry-pull permissions into the
#   principal that can do anything in either cluster widens its blast radius for no
#   reason.
---
# The Secret ArgoCD reads as an OCI Helm repository credential. The CronJob PATCHES
# `.stringData.password` on every run; everything else is static. Seeded empty so
# the object exists before the first refresh (ArgoCD tolerates a repo it cannot yet
# authenticate to — it starts working the moment the first CronJob run lands).
#
# `type: helm` + `enableOCI: "true"` is what makes ArgoCD treat repoURL
# 608983206583.dkr.ecr.ap-southeast-1.amazonaws.com as an OCI Helm registry — which
# is exactly the repoURL appsets/products.yaml declares.
apiVersion: v1
kind: Secret
metadata:
  name: ecr-chart-registry
  namespace: argocd
  labels:
    # This label is what makes ArgoCD load the Secret as a repository credential.
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  name: qnsc-charts-ecr
  type: helm
  url: 608983206583.dkr.ecr.ap-southeast-1.amazonaws.com
  enableOCI: "true"
  # ECR's authorization user is always the literal `AWS`; the password is the
  # 12-hour token the CronJob rewrites below.
  username: AWS
  password: "seed-token-replaced-by-cronjob-within-6h"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-ecr-refresher
  namespace: argocd
  annotations:
    # See the INFRA ACTION block at the top — this role does not exist yet.
    eks.amazonaws.com/role-arn: arn:aws:iam::608983206583:role/qnsc-prod-argocd-ecr
---
# Least privilege: the job's ONLY in-cluster power is to patch the ONE repository
# Secret it maintains. Not `secrets *` — a component that mints tokens should not
# be able to read every other secret in the argocd namespace (the OIDC client
# secret lives here). `resourceNames` pins it to exactly `ecr-chart-registry`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-ecr-refresher
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-chart-registry"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-ecr-refresher
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-ecr-refresher
subjects:
  - kind: ServiceAccount
    name: argocd-ecr-refresher
    namespace: argocd
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: argocd-ecr-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-ecr-refresher
spec:
  # Every 6 hours — comfortably shorter than the 12-hour token life (see the
  # MECHANISM block). UTC, like every schedule in this estate.
  schedule: "0 */6 * * *"
  # A missed run (node draining at the top of the hour) should run late, not be
  # skipped — being 10 minutes late is fine; skipping is how the token lapses.
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry, then wait for the next 6h slot — there is still ~6h of token
      # validity left, so a failed run is not urgent.
      backoffLimit: 1
      # Reap the Job after an hour so history does not accumulate.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: argocd-ecr-refresher
        spec:
          serviceAccountName: argocd-ecr-refresher
          restartPolicy: Never
          # PSS `restricted` (the argocd namespace enforces it). Pod-level context
          # satisfies the profile; the container context repeats what restricted
          # additionally requires.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          # §2 — only `kubernetes.io/arch` and `karpenter.sh/capacity-type` are
          # node-pool properties; any other nodeSelector key stays Pending forever
          # (the schedulable conformance contract fails on it). This matches
          # argocd/values.yaml's own `global.nodeSelector` — a short-lived batch
          # job belongs on Spot like the rest of the platform. No arch pin: the
          # aws-cli image below is multi-arch, so either pool arch schedules it.
          nodeSelector:
            karpenter.sh/capacity-type: spot
          containers:
            - name: refresh
              # The official multi-arch AWS CLI image. It is Amazon Linux based and
              # ships `aws` AND `curl` — so this job needs NO second tool and NO
              # inline binary download at runtime (fetching kubectl over the network
              # into a read-only-root pod is a supply-chain surface and a failure
              # mode for a job whose whole purpose is reliability). The patch is a
              # direct call to the in-cluster API server with the pod's own
              # ServiceAccount token, which the Role above scopes to this one Secret.
              # Explicit tag, not :latest — admission (policy/admission.yaml) forbids
              # :latest; pin to a digest in versions.yaml before first install.
              image: public.ecr.aws/aws-cli/aws-cli:2.17.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  # 1. mint a fresh 12h ECR token (IRSA role qnsc-prod-argocd-ecr).
                  TOKEN="$(aws ecr get-login-password --region "$AWS_REGION")"
                  # 2. PATCH only .stringData.password of the repository Secret via
                  #    the in-cluster API. stringData means the API server re-encodes
                  #    it; ArgoCD picks up the change on its next repo access, no
                  #    restart needed. --fail turns any non-2xx into a job failure so
                  #    a silent auth/RBAC problem surfaces instead of the token
                  #    quietly never updating (the exact silent-staleness this whole
                  #    file exists to prevent).
                  curl --fail --silent --show-error \
                    --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat "$SA/token")" \
                    -H "Content-Type: application/merge-patch+json" \
                    -X PATCH \
                    --data "{\"stringData\":{\"password\":\"${TOKEN}\"}}" \
                    "https://kubernetes.default.svc/api/v1/namespaces/argocd/secrets/ecr-chart-registry" \
                    >/dev/null
                  echo "ecr-chart-registry password refreshed at $(date -u +%FT%TZ)"
              env:
                - name: AWS_REGION
                  value: ap-southeast-1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              # §15d / policy: memory limit == request, NO cpu limit (a cpu limit is
              # REJECTED by policy/admission.yaml). Small: this shells two commands.
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits:   { memory: 64Mi }
              volumeMounts:
                # Writable scratch for aws's cache, since the root filesystem is
                # read-only.
                - { name: awscache, mountPath: /home/aws-cli/.aws/cli/cache }
          volumes:
            - { name: awscache, emptyDir: {} }
