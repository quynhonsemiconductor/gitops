# ── Reloader (stakater) — restarts workloads when their Secrets change ──────
#
# helm repo add stakater https://stakater.github.io/stakater-charts
# helm upgrade --install reloader stakater/reloader \
#   -n platform -f reloader/values.yaml \
#   --version <versions.yaml: platform.reloader.version>
#
# WHY IT EXISTS ON-PREM (§6.3, decided 2026-10-21): CNPG reissues the cluster
# CA ~every 83 days — CertificateDuration=90, renewed 7 days before expiry,
# SAME key (cluster_pki.go renewCASecret; defaults in
# internal/configuration/configuration.go:41-45, verified 2026-10-21). Apps
# load DATABASE_SSL_CA once at start (node-postgres ssl.ca, asyncpg
# SSLContext), so a stale in-process CA would fail verify-full ~90 days in,
# quietly. The loop: CNPG renews pg-*-ca -> the ca-sync ExternalSecret (1 h)
# rewrites pg-*-ca-pub -> the product ExternalSecret refreshes
# <product>-db-ca -> Reloader rolls the Deployments the chart annotates with
# `secret.reloader.stakater.com/reload`. This is the one controller added for
# it; the alternative — a longer CA lifetime via the operator's
# CERTIFICATE_DURATION env — trades rotation hygiene for fewer moving parts
# and was rejected.
#
# Image: docker.io/stakater/reloader, pinned BY DIGEST — the digest was
# verified against the Docker Hub registry API, so the repository must stay
# docker.io (the chart default is ghcr.io, which this pin says nothing about).
# Chart 2.2.18 published 2026-09-30, app v1.4.22 built 2026-09-09 (both past
# the 14-day floor); the 3.x line is a beta and is not pinned.
#
# Values keyed EXACTLY as chart 2.2.18 reads them (verified by rendering the
# pulled chart, not from memory): image.* is top-level; the flags live under
# reloader.*, sizing under reloader.deployment.*.
image:
  repository: docker.io/stakater/reloader
  tag: v1.4.22
  digest: sha256:96cc6bad219032f01a795803f23093ee0277b9308999ec4ce25a8382a22910df
  pullPolicy: IfNotPresent

reloader:
  # Secrets only. ConfigMaps change far too often to restart on, and nothing
  # here mounts one as a credential.
  ignoreConfigMaps: true

  # `annotations`, NOT the default: the default strategy patches the pod
  # TEMPLATE (checksum env vars), which fights ArgoCD selfHeal on every
  # rotation — Argo would revert Reloader's edit and Reloader would re-apply
  # it, forever. The annotations strategy marks the PODS, leaving the
  # Argo-managed Deployment spec alone.
  reloadStrategy: annotations

  # Least privilege on the WATCH side: only namespaces that hold tenant
  # workloads. The chart still creates its ClusterRole (the RBAC verb set is
  # fixed), but the informers never look outside these namespaces. The only
  # Secret annotated workloads reference is <product>-db-ca, which lives in
  # the product namespace.
  namespaceSelector: "qnsc.vn/tenant=product"

  watchGlobally: true

  deployment:
    # §5.7 — requests = limits (Guaranteed memory), no CPU limit.
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 64Mi }
    # `platform` enforces PSA restricted; the chart's default
    # containerSecurityContext is {} and the pod would be rejected.
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
