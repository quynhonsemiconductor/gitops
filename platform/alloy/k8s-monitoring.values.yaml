# ── k8s-monitoring — the ONE in-cluster Alloy (ONPREM-PLAN §12, PLT-H2) ─────
#
# Chart: grafana/k8s-monitoring, pinned in versions.yaml. One Alloy DaemonSet
# does three jobs on purpose — OTLP receiver, metrics scraping, pod logs — so
# there is no second collector layer to operate (§12: "k8s-monitoring chart,
# one Alloy (OTLP receiver, metrics, logs), strict metric allowlist").
#
# ── THE CONTRACT THE APPS ALREADY HAVE ─────────────────────────────────────
# rova-dev and opshub-dev export OTLP to
# `http://alloy-receiver.platform.svc:4318` (chart base values set
# OTEL_ENABLED=true and the endpoint). That name is produced here, not by the
# apps: release name `alloy` + `extraService.name: receiver` →
# Service `alloy-receiver` in `platform`, ports 4317/4318 from the
# `otel-receiver` preset. The apps need NO change.
#
# ── CREDENTIALS: NOT IN GIT ────────────────────────────────────────────────
# The Grafana Cloud URLs and tokens come from the `grafana-cloud` Secret
# (ESO ← kv-qnsc-platform/platform-grafana-alloy) through `envFrom`, and every
# destination reads them with a raw Alloy expression (`sys.env(...)`). The
# stack-specific hostnames and numeric user ids stay out of the public repo.
# Keys the Secret must carry (owner fills):
#   GRAFANA_TOKEN          one write-scoped access-policy token
#   GRAFANA_PROM_URL       metrics push
#   GRAFANA_PROM_USER      metrics instance id
#   GRAFANA_LOKI_URL       log push
#   GRAFANA_LOKI_USER      log tenant id
#   GRAFANA_TEMPO_URL      trace push (…/tempo)
#   GRAFANA_TEMPO_USER     trace tenant id
# `GRAFANA_PYROSCOPE_*` are unused here (profiling is not enabled).
#
# ── BUDGET ─────────────────────────────────────────────────────────────────
# Single node, 36 GB. Alloy `medium` (250m / 512Mi, limit 1Gi) + kube-state-
# metrics (~100m/256Mi) + node-exporter (~50m/64Mi) ≈ 300m / 1.1Gi steady —
# the §5.7 line. The Alloy operator adds ~50m/128Mi.
#
# ── CARDINALITY ────────────────────────────────────────────────────────────
# The Adaptive Metrics keep-label rules (infra#213) already aggregate the app
# metrics. Here the COLLECTOR drops the labels that only the OLD semconv
# generation carries (verified on live Mimir 2026-10-25) plus the churn labels
# that made billable series outrun active ones. `instance` is deliberately NOT
# dropped: the node/`up`/CNPG alerts read it. Scrapes stay on the chart's
# strict allowlists (node-exporter and KSM defaults).
---
cluster:
  name: qnsc-onprem

destinations:
  grafana-metrics:
    type: prometheus
    urlFrom: sys.env("GRAFANA_PROM_URL")
    auth:
      type: basic
      usernameFrom: sys.env("GRAFANA_PROM_USER")
      passwordFrom: sys.env("GRAFANA_TOKEN")
    # Old semconv + churn labels. Safe for every current alert: the SLO and
    # node rules read deployment_environment_name/service_namespace/route/
    # method/status_class/le/instance, none of which are listed here.
    metricProcessingRules: |
      write_relabel_config {
        regex  = "http_method|http_status_code|http_flavor|http_scheme|net_host_name|net_host_port|service_version|service_instance_id"
        action = "labeldrop"
      }

      // ── series budget (audit S-H3, 2026-11-04) ────────────────────────────
      // Grafana Cloud Free bills ACTIVE series against 10k (7,958 before these
      // cuts). Drop the families below at the write boundary: none is read by a
      // rule or dashboard in this repo.
      //
      // kube_pod_status_phase is no longer SCRAPED (2026-11-06 observability
      // audit): no rule and no dashboard in infra@main or in this repo reads
      // it, and it was the largest pod family. It is removed from the KSM
      // allowlist below, which is the durable fix — write-side drops would only
      // hide it after it had already been counted.
      // kube_pod_status_ready: keep condition="true" — the two PostgreSQL
      // readiness alerts read it (onprem-workloads.tf). false/unknown are the
      // not-ready samples those rules do not query.
      write_relabel_config {
        source_labels = ["__name__", "condition"]
        regex         = "kube_pod_status_ready;(false|unknown)"
        action        = "drop"
      }
      // kubelet histogram internals (~280 series); no alert or dashboard uses
      // a kubelet_* duration histogram.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "kubelet_(pod_worker|cgroup_manager|pod_start)_duration_seconds(_bucket|_sum|_count)?"
        action        = "drop"
      }
      // Guest CPU accounting (96 series) — unused.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "node_cpu_guest_seconds_total"
        action        = "drop"
      }
      // kubelet internals beyond the three duration histograms above (~196
      // series: pleg relist histograms, runtime operations, volume_manager).
      // The only kubelet family any rule reads is kubelet_volume_stats_*
      // (volume free-space alerts), which this regex deliberately does not match.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "kubelet_(pleg_.*|runtime_operations.*|volume_manager_.*)"
        action        = "drop"
      }
      // The kubelet's own client/storage families do NOT carry the kubelet_
      // prefix, so the rule above never matched them (2026-11-06 observability
      // audit: 36 + 33 series live). No rule or dashboard reads either.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "storage_operation_duration_seconds(_bucket|_sum|_count)?|rest_client_requests_total"
        action        = "drop"
      }
      // node-exporter per-device filesystems on pseudo mounts. Every
      // filesystem rule in infra/live/observability-alerting filters
      // fstype!~"squashfs|devtmpfs|nsfs|tmpfs|overlay", so these series are
      // stored only to be excluded at query time. ramfs is NOT in that
      // exclusion list, so it is not dropped here: a full ramfs mount still
      // has to reach the memory/filesystem rules.
      write_relabel_config {
        source_labels = ["__name__", "fstype"]
        regex         = "node_filesystem_.*;(tmpfs|overlay|squashfs|devtmpfs|nsfs)"
        action        = "drop"
      }
      // node-exporter network counters on virtual interfaces: veth/cni/
      // flannel/cali/bridge/loopback. Rules read up{job="node"} and host
      // memory/filesystem, never node_network_*; keep the physical NICs so a
      // bandwidth panel still has something to draw.
      write_relabel_config {
        source_labels = ["__name__", "device"]
        regex         = "node_network_.*;(veth.*|cni.*|flannel.*|cali.*|tunl.*|br-.*|docker.*|virbr.*|dummy.*|lo)"
        action        = "drop"
      }
      // cAdvisor filesystem read/write counters (4 families x ~78): no rule or
      // dashboard in this repo reads them. container_fs_usage_bytes, which a
      // disk-pressure panel would use, is untouched.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "container_fs_(reads|writes)(_bytes)?_total"
        action        = "drop"
      }
      // cAdvisor per-container memory duplicates: cache/swap only. usage_bytes
      // and rss stay because the stock Kubernetes dashboards Grafana hosts
      // (not in git, so not reviewable here) are built on them;
      // container_memory_working_set_bytes stays as the rightsizing evidence
      // in gitops/values/*/prod.yaml resource comments.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "container_memory_(cache|swap)"
        action        = "drop"
      }
      // cAdvisor network: keep the byte counters only. The six packet/error
      // families have no consumer and carry one series per pod interface:
      // receive|transmit x packets, packets_dropped, errors.
      write_relabel_config {
        source_labels = ["__name__"]
        regex         = "container_network_(receive|transmit)_(packets(_dropped)?|errors)_total"
        action        = "drop"
      }

  grafana-logs:
    type: loki
    urlFrom: sys.env("GRAFANA_LOKI_URL")
    auth:
      type: basic
      usernameFrom: sys.env("GRAFANA_LOKI_USER")
      passwordFrom: sys.env("GRAFANA_TOKEN")

  grafana-traces:
    type: otlp
    # Grafana Cloud Tempo takes OTLP over gRPC on :443; its "/tempo" URL is the
    # query path and answers OTLP/HTTP pushes with 404. The secret holds the URL
    # exactly as Grafana shows it, so the endpoint is derived here.
    protocol: grpc
    urlFrom: string.trim_suffix(sys.env("GRAFANA_TEMPO_URL"), "/tempo") + ":443"
    metrics:
      enabled: false
    logs:
      enabled: false
    traces:
      enabled: true
    auth:
      type: basic
      usernameFrom: sys.env("GRAFANA_TEMPO_USER")
      passwordFrom: sys.env("GRAFANA_TOKEN")

# The three flavours of telemetry the node produces, from three upstream
# exports the chart deploys. No eBPF, no profiling (not needed at this scale).
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true

clusterMetrics:
  enabled: true
  collector: alloy
  # kube-state-metrics: ONLY what the alert rules and the fast-track checks read
  # (infra live/observability-alerting) plus restart/phase for triage. The chart
  # default list (~100 families: replicasets, nodes, HPAs, PVC labels, resource
  # requests...) was most of the series count. Add a name here when a rule or
  # dashboard needs it.
  kube-state-metrics:
    metricsTuning:
      useDefaultAllowList: false
      # kube_pod_info and kube_pod_status_phase were dropped 2026-11-06
      # (observability audit): no rule or dashboard in infra@main or here reads
      # either, and together they were the two largest pod families. The
      # dashboard the audit proposes uses phase only for triage, not queries.
      includeMetrics:
        - kube_pod_status_ready
        - kube_pod_container_status_waiting_reason
        - kube_pod_container_status_restarts_total
        - kube_pod_container_status_last_terminated_reason
        - kube_job_failed
        - kube_job_status_failed
        - kube_job_owner               # failed-Job alert: latest Job per CronJob (infra#278)
        - kube_job_status_start_time   # ordering for "latest Job"
        - kube_cronjob_status_last_successful_time
        - kube_cronjob_status_last_schedule_time
        - kube_cronjob_spec_suspend
        - kube_deployment_spec_replicas
        - kube_deployment_status_replicas_available
        - kube_statefulset_replicas
        - kube_statefulset_status_replicas_ready
        - kube_node_status_condition
        - kube_persistentvolumeclaim_status_phase

hostMetrics:
  enabled: true
  collector: alloy
  linuxHosts:
    enabled: true
    # KEEP `job="node"`: the on-prem node-down and filesystem rules in infra's
    # observability-alerting query `up{job="node"}` and were verified against
    # the old agent's label. Renaming it here would silently disarm them.
    jobLabel: node

podLogsViaLoki:
  enabled: true
  collector: alloy
  # Exact names (not regexes) so pod discovery can use its efficient path.
  # Prod namespaces carry secrets only in secret values, not in log lines;
  # they are included because an incident on prod is exactly when logs matter.
  namespaces:
    - rova-prod
    - rova-dev
    - opshub-prod
    - opshub-dev
    - kb-prod          # MISSING until 2026-11-06: kb prod logs never reached Loki, so the
                       # security-control-failed-open rule was blind for kb (observability audit)
    - kb-dev
    - coder            # lands with gitops#376 (Coder control plane)
    - vlsi-ws          # lands with gitops#377/#378 (workspace pods)
    - ai
    - platform
    - argocd
    - data-prod
    - data-dev
  # No label-selector narrowing: the estate's pods have no common label.

# Node journal: ONLY kernel AppArmor denials (incident 2026-11-03: a DENIED
# profile went unseen). Two filters keep the volume near zero: the source keeps
# only kernel/audit-transport entries (no unit logs), and the process stage
# drops every line that is not `apparmor="DENIED"`. The infra alert
# `k3s-apparmor-denied` (observability-alerting) reads
# {job="integrations/kubernetes/journal"}. Widen deliberately, not by default.
nodeLogs:
  enabled: true
  collector: alloy
  journal:
    maxAge: "1h"
  extraDiscoveryRules: |
    rule {
      source_labels = ["__journal__transport"]
      regex         = "kernel|audit"
      action        = "keep"
    }
  extraLogProcessingStages: |
    stage.match {
      selector            = "{job=\"integrations/kubernetes/journal\"} !~ \"apparmor=\\\"DENIED\\\"\""
      action              = "drop"
      drop_counter_reason = "not_apparmor_denied"
    }

# ── env label on the app metrics ───────────────────────────────────────────
# WHY: an OTel SDK resource attribute does NOT become a Prometheus label — the
# collector sends only `job`/`instance`, and the rest of the resource (including
# deployment.environment.name and k8s.namespace.name) reaches Mimir only on the
# `target_info` series. So every app series (http_*, mcp_*, db_*, …) carried NO
# environment, and any dev-vs-prod panel or alert had to join target_info on
# `instance` — fragile, and silent if `instance` is ever aggregated away.
#
# WHAT: datapoint attributes copied from the resource attribute the apps ALREADY
# set (products set DEPLOYMENT_ENV=dev|prod, which the observability package
# publishes as `deployment.environment.name`). The Prometheus exporter renders
# them as the labels `deployment_environment_name="dev"|"prod"` (the label every
# dashboard, SLO and alert rule queries) and `env` (kept because the MCP
# dashboard groups on it and no Adaptive Metrics rule covers `mcp_*`, so nothing
# strips it). No app change, no new resource attribute.
#
# WHY BOTH, and not just `env`: `env` ALONE CANNOT SURVIVE FOR THE FAMILIES
# ADAPTIVE METRICS COVERS. The `http_server_`/`http_client_`/`db_client_*` rules
# (infra live/adaptive-metrics) keep ONLY `job, service_namespace, service_name,
# deployment_environment_name, method, status_class, route, le` — a label not in
# that list, such as `env`, is aggregated away. So with `env` only, dev and prod
# (which share `job="<product>/<service>"` and `service_name`) collapsed into ONE
# aggregated series with no environment on it at all, and any per-env query
# (`deployment_environment_name="prod"`) returned nothing. Emitting the
# AM-spelled label fixes the split without touching the rules; emitting `env`
# too costs ZERO extra series, because both labels carry the same two values
# from the same namespace.
#
# WHY A custom PROCESSOR, not destination-level
# `openTelemetryConversion.resourceToTelemetryConversion`: that switch promotes
# EVERY resource attribute (k8s.pod.uid, process.pid, host.name, …) to labels —
# churn/cardinality the Adaptive Metrics rules do not cover for every family.
# This copies exactly two, derived from one attribute. Scope: the OTLP metrics
# pipeline only; scraped Prometheus metrics (KSM, node-exporter, …) are untouched.
#
# CAVEAT: the chart still labels `dataProcessors` experimental. If a chart bump
# removes it, the fallback is the destination-level conversion above with a
# matching Adaptive Metrics rule; check both labels are present after any bump.
dataProcessors:
  env-label:
    type: custom
    metrics:
      otlp:
        enabled: true
        # The chart forwards the feature's OTLP metrics into this component.
        input: otelcol.processor.transform.env_label.input
        # The output sink name is chart-generated: <proc>_out_metrics_otlp,
        # where <proc> is this key with dashes as underscores.
        config: |
          otelcol.processor.transform "env_label" {
            error_mode = "ignore"

            metric_statements {
              context = "datapoint"
              statements = [
                "set(attributes[\"deployment_environment_name\"], resource.attributes[\"deployment.environment.name\"]) where resource.attributes[\"deployment.environment.name\"] != nil",
                "set(attributes[\"env\"], resource.attributes[\"deployment.environment.name\"]) where resource.attributes[\"deployment.environment.name\"] != nil",
              ]
            }

            output {
              metrics = [otelcol.processor.batch.env_label_out_metrics_otlp.input]
            }
          }
    # The feature validates its chain for EVERY (type, ecosystem) it can emit,
    # so a metrics-only processor fails the chart's validation outright. Traces
    # really do flow through here (the traces destination is OTLP); logs do not
    # today (Loki destination, different ecosystem), but the tuple must still be
    # declared and its config kept valid for the day an OTLP logs destination
    # is added. Both carry the SAME resource attribute onto the resource, which
    # is what Tempo shows — not a metric label, so no series cost.
    logs:
      otlp:
        enabled: true
        input: otelcol.processor.transform.env_label_logs.input
        config: |
          otelcol.processor.transform "env_label_logs" {
            error_mode = "ignore"

            log_statements {
              context = "resource"
              statements = [
                "set(attributes[\"env\"], attributes[\"deployment.environment.name\"]) where attributes[\"deployment.environment.name\"] != nil",
              ]
            }

            output {
              logs = [otelcol.processor.batch.env_label_out_logs_otlp.input]
            }
          }
    traces:
      otlp:
        enabled: true
        input: otelcol.processor.transform.env_label_traces.input
        config: |
          otelcol.processor.transform "env_label_traces" {
            error_mode = "ignore"

            trace_statements {
              context = "resource"
              statements = [
                "set(attributes[\"env\"], attributes[\"deployment.environment.name\"]) where attributes[\"deployment.environment.name\"] != nil",
              ]
            }

            output {
              traces = [otelcol.processor.batch.env_label_out_traces_otlp.input]
            }
          }

applicationObservability:
  enabled: true
  collector: alloy
  # Run the OTLP metrics through the env-label processor above before the
  # destination (the chain is resolved per (type, ecosystem), so logs and
  # traces are unaffected).
  dataProcessors:
    - env-label
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
  # The OTLP METRICS pipeline is already wired by the chart: the feature sends
  # OTLP metrics to the `grafana-metrics` destination (rendered config:
  # `metrics_destinations = [otelcol.exporter.prometheus.grafana_metrics.input]`),
  # so nothing has to be enabled for the Proxmox host's pushes to reach Grafana Cloud.
  # This is an ALLOWLIST, not a prefix filter. PVE's plugin exports the raw
  # `pvestatd` status hashes, so the Proxmox host alone produced 843
  # `proxmox_*` series — most of them `proxmox_vm_blockstat_*` (~50 per virtual
  # disk: efidisk0/ide2/pflash0/scsi0/scsi1 on each VM), plus node `blockstat`
  # variants and odd `*_percent_total` duplicates — against a 10k free-tier
  # budget already at 59%. Keep only the families an alert or a dashboard
  # needs, and drop every other metric arriving stamped `service.name=proxmox-ve`.
  # (The `alloy-otlp-host` door below is unauthenticated, so the allowlist is
  # also what bounds what an accepted connection can add. Filter processor:
  # matching telemetry is DROPPED.)
  #
  # The names below are the OTLP metric names — what this filter sees. The
  # shipped plugin SUFFIXES the name of every series it classifies as a counter
  # (`PVE::Status::OpenTelemetry::_classify_metric_type`; the name is built as
  # `${metric_prefix}_${key}${suffix}`), so e.g. the OTLP name is
  # `proxmox_vm_netin_total`, not `proxmox_vm_netin`; the Prometheus exporter
  # then renders it `proxmox_vm_netin_bytes_total` in Grafana (unit + `_total`).
  # Gauges keep the bare name (`proxmox_vm_uptime` -> `..._uptime_seconds`).
  # Families from pve-manager `PVE::Status::OpenTelemetry` +
  # `PVE::Service::pvestatd`:
  #   node    uptime; cpustat.{cpu, iowait_total, avg1};
  #           memory.{memtotal,memused,memavailable,arcsize};
  #           nics.* -> network.{receive,transmit}_total — one series per
  #           interface the host reports (physical NICs, the bridge, loopback
  #           and one tap per VM), not only physical NICs
  #   storage PVE::Storage::storage_info {total,used,avail,active} per store
  #   VM      qemu/lxc status {uptime,cpu,mem,maxmem, netin_total, netout_total,
  #           diskread_total, diskwrite_total, pressurecpusome, pressureiosome}
  # App metrics carry other `service.name`s and are untouched.
  metrics:
    filters:
      metric:
        - 'resource.attributes["service.name"] == "proxmox-ve" and not IsMatch(name, "^(proxmox_node_uptime|proxmox_node_cpustat_(cpu|iowait_total|avg1)|proxmox_node_memory_(memtotal|memused|memavailable|arcsize)|proxmox_node_network_(receive|transmit)_total|proxmox_storage_(total|used|avail|active)|proxmox_vm_(uptime|cpu|mem|maxmem|(netin|netout|diskread|diskwrite)_total|pressurecpusome|pressureiosome))$")'

# CNPG's operator creates PodMonitors when its own `monitoring.podMonitorEnabled`
# is on (flipped in the same PR, platform/cnpg/operator.yaml). ServiceMonitors
# for ArgoCD and a PodMonitor for the Valkey exporters live in monitors.yaml.
prometheusOperatorObjects:
  enabled: true
  collector: alloy

# Annotation autodiscovery honours `k8s.grafana.com/*` annotations only (the
# chart default), so it is NOT what scrapes ESO or ArgoCD — see extraConfig.
annotationAutodiscovery:
  enabled: true
  collector: alloy

# ── OBI phase 1: eBPF RED metrics for what we cannot instrument ─────────────
# OpenTelemetry eBPF Instrumentation via Grafana Beyla (chart feature
# `autoInstrumentation`, the OBI distribution), decision: product-docs
# platform/observability ADR "Instrumentation standard". Phase 1 = RED metrics
# ONLY, for three third-party workloads that have no SDK: TEI (ai), clamd and
# cloudflared (platform). Our own apps keep the OTel SDK; the discovery below
# names its targets explicitly, so a new namespace is never instrumented by
# accident.
#
# WHERE IT RUNS: the dedicated namespace `obi` (platform/namespaces/obi.yaml),
# the only namespace labelled PSA `privileged` for this; the chart installs
# into the release namespace by default, hence `namespaceOverride`. Because the
# chart's own Alloy scrape only looks in the Alloy namespace (`own_namespace`),
# the series are scraped by the `beyla` block in extraConfig below, with the
# series budget enforced THERE. The feature's own scrape therefore finds no pod
# and forwards nothing.
#
# SECURITY (the chart's `privileged: false` mode is NOT usable: it hardcodes
# SYS_ADMIN, and NET_ADMIN with context propagation). The chart value named
# `privileged: true` only means "use my `securityContext` verbatim"; the
# securityContext below is NOT a privileged container: capabilities are
# dropped to ALL and exactly these are added: BPF, PERFMON, NET_RAW,
# SYS_PTRACE, DAC_READ_SEARCH, CHECKPOINT_RESTORE. No SYS_ADMIN, no
# NET_ADMIN, no hostNetwork (context propagation is off), hostPID is on (the
# `application` preset sets it; Beyla must see host processes), and
# /sys/kernel/tracing is mounted read-only. Verified with `helm template`
# (rendered/ is not generated for this chart; the review is the values diff).
#
# SERIES BUDGET (Grafana Cloud Free: 10k active series): features limited to
# `application` + `application_service_graph` (no network, no span metrics, no
# host/process metrics), `url_path` is never an attribute (route only), and the
# allowlist in extraConfig keeps only duration histograms and service-graph
# totals. Alert at 70% of 10k: infra live/observability-alerting.
autoInstrumentation:
  enabled: true
  collector: alloy
  beyla:
    preset: application
    # RED metrics only: no traces into the OTLP receiver.
    deliverTracesToApplicationObservability: false
    namespaceOverride: obi
    privileged: true            # chart flag: use the securityContext below as is (see the header)
    contextPropagation:
      enabled: false            # would add NET_ADMIN + hostNetwork
    image:
      tag: "3.32.0"
      digest: sha256:3ff0f7cf2bbf77db7c1c380f7d5cd018bacce7a40c2a4a596b8ce176af84adeb   # docker.io/grafana/beyla:3.32.0, verified 2026-11-02
    k8sCache:
      replicas: 1
      image:
        tag: "3.32.0"
        digest: sha256:9e9aa16f462e0dddadb37aec541ff8976e666fa408efad81b88a804e672c86a8   # docker.io/grafana/beyla-k8s-cache:3.32.0, verified 2026-11-02
    securityContext:
      privileged: false          # the chart's default securityContext carries `privileged: true`; it MERGES, so say no here
      runAsUser: 0
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: [BPF, PERFMON, NET_RAW, SYS_PTRACE, DAC_READ_SEARCH, CHECKPOINT_RESTORE]
      # containerd's default AppArmor profile denies ptrace(read) on processes outside the container, which Beyla
      # needs to inspect the workloads it instruments (~70 `apparmor="DENIED" operation="ptrace" comm="beyla"` per node,
      # 2026-11-03). Unconfined for this one container only; the capability set above stays the boundary, and the obi
      # namespace is the only PSA-privileged one.
      appArmorProfile:
        type: Unconfined
    volumes:
      - name: tracefs
        hostPath:
          path: /sys/kernel/tracing
    volumeMounts:
      - name: tracefs
        mountPath: /sys/kernel/tracing
        readOnly: true
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    config:
      data:
        discovery:
          # ONLY these workloads. The explicit excludes below are belt and braces
          # for the day someone widens the list.
          instrument:
            - k8s_namespace: ai
              k8s_deployment_name: "tei-*"
            - k8s_namespace: platform
              k8s_deployment_name: clamd
            - k8s_namespace: platform
              k8s_deployment_name: cloudflared
          exclude_instrument:
            - exe_path: "{*alloy*,*otelcol*,*beyla*}"
            - k8s_namespace: "{rova-*,opshub-*,kb-*,data-*,argocd,kube-system,monitoring}"
          # Anything that already speaks OTel is skipped, including its span metrics.
          exclude_otel_instrumented_services: true
          exclude_otel_instrumented_services_span_metrics: true
        routes:
          unmatched: wildcard   # no raw paths as route values
        prometheus_export:
          features:
            - application
            - application_service_graph
        attributes:
          select:
            "http_*":
              include: ["*"]
              exclude: ["url_path", "client_address"]
            "rpc_*":
              include: ["*"]
              exclude: ["url_path", "client_address"]

collectors:
  alloy:
    presets:
      - daemonset
      # Annotation autodiscovery and Prometheus-Operator objects both require
      # Alloy clustering: with one node it is a one-member cluster, and it is
      # what makes scrape ownership well-defined if a second node ever joins.
      - clustered
      - otel-receiver
      - filesystem-log-reader
      - medium
    # The collector is a DaemonSet: it must tolerate every taint, including the
    # AI node's pool taint, or logs/metrics from half the estate vanish.
    controller:
      tolerations:
        - operator: Exists
    alloy:
      # Digest pin (Docker Hub, verified 2026-11-01). The chart/operator would
      # otherwise pick its own tag; a digest makes the collector binary that
      # parses every pipeline in this file an explicit, reviewable choice.
      image:
        tag: v1.21.3
        digest: sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
      envFrom:
        - secretRef:
            name: grafana-cloud
      # The `filesystem-log-reader` preset also mounts /var/lib/docker; the
      # cluster runs containerd, so the only path this needs is /var/log/pods.
      mounts:
        dockercontainers: false
    extraConfig: |
      // Valkey exporters — one sidecar per instance, in the data namespaces.
      // Pod role: the exporter port is not on any Service, so endpoints
      // discovery would never see it.
      discovery.kubernetes "valkey_pods" {
        role = "pod"
        namespaces {
          names = ["data-dev", "data-prod"]
        }
      }

      discovery.relabel "valkey_pods" {
        targets = discovery.kubernetes.valkey_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9121"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/redis_exporter"
        }
      }

      prometheus.scrape "valkey" {
        targets         = discovery.relabel.valkey_pods.output
        forward_to      = [prometheus.relabel.valkey.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      prometheus.relabel "valkey" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "redis_up|redis_uptime_in_seconds|redis_connected_clients|redis_blocked_clients|redis_memory_used_bytes|redis_memory_max_bytes|redis_evicted_keys_total|redis_keyspace_hits_total|redis_keyspace_misses_total|redis_commands_processed_total|up|scrape_samples_scraped"
          action        = "keep"
        }
      }

      // cert-manager controller (9402, port name `http-metrics`). The chart's
      // integration feature would do this too; the pod discovery here keeps
      // every out-of-band scrape in ONE block and one allowlist style.
      discovery.kubernetes "certmanager_pods" {
        role = "pod"
        namespaces {
          names = ["cert-manager"]
        }
      }

      discovery.relabel "certmanager_pods" {
        targets = discovery.kubernetes.certmanager_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "http-metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/cert-manager"
        }
      }

      prometheus.scrape "certmanager" {
        targets         = discovery.relabel.certmanager_pods.output
        forward_to      = [prometheus.relabel.certmanager.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      prometheus.relabel "certmanager" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "certmanager_.*|up|scrape_samples_scraped"
          action        = "keep"
        }
      }

      // cloudflared (the tunnel connector) on its metrics port 2000. It has no
      // Service and no scrape annotation; the deployment only exposes the
      // container port. `cloudflared_tunnel_ha_connections` is the tunnel-down
      // signal in infra's alerting rules.
      discovery.kubernetes "cloudflared_pods" {
        role = "pod"
        namespaces {
          names = ["platform"]
        }
      }

      discovery.relabel "cloudflared_pods" {
        targets = discovery.kubernetes.cloudflared_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "cloudflared"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "2000"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          target_label = "job"
          replacement  = "cloudflared"
        }
      }

      prometheus.scrape "cloudflared" {
        targets         = discovery.relabel.cloudflared_pods.output
        forward_to      = [prometheus.relabel.cloudflared.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      prometheus.relabel "cloudflared" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        // The tunnel-down rule reads cloudflared_tunnel_ha_connections only
        // (infra onprem-signals.tf). The rest of the exporter is request
        // latency histograms and rpc counters — ~136 series with no consumer.
        rule {
          source_labels = ["__name__"]
          regex         = "cloudflared_tunnel_ha_connections|up|scrape_samples_scraped"
          action        = "keep"
        }
      }

      // ArgoCD application-controller (pod port 8082, `metrics`). Pod discovery
      // by label, not the metrics Service: it works whether or not the chart's
      // Service exists, and `argocd_app_info` (the only series the rules read)
      // is emitted by the controller alone. honor_labels keeps the app's own
      // `name`/`namespace` labels, which the Degraded rule groups by.
      discovery.kubernetes "argocd_controller_pods" {
        role = "pod"
        namespaces {
          names = ["argocd"]
        }
      }

      discovery.relabel "argocd_controller_pods" {
        targets = discovery.kubernetes.argocd_controller_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "argocd-application-controller"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "8082"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          target_label = "job"
          replacement  = "argocd-application-controller"
        }
      }

      prometheus.scrape "argocd_controller" {
        targets         = discovery.relabel.argocd_controller_pods.output
        forward_to      = [prometheus.relabel.argocd_controller.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
        honor_labels    = true
      }

      prometheus.relabel "argocd_controller" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "argocd_app_info|up|scrape_samples_scraped"
          action        = "keep"
        }
      }

      // CNPG instance exporter (pod port 9187, `metrics`) for EVERY cluster in
      // the data namespaces: selected by the operator's own `cnpg.io/podRole=
      // instance` label, so pg-dev, pg-rova and any later cluster are picked up
      // with no list to maintain. (The operator's `podMonitorEnabled` covers the
      // OPERATOR pod only, never the instances, which is why these were absent.)
      // `cnpg_cluster` is the label the replication-lag alert summary prints.
      discovery.kubernetes "cnpg_pods" {
        role = "pod"
        namespaces {
          names = ["data-dev", "data-prod"]
        }
      }

      discovery.relabel "cnpg_pods" {
        targets = discovery.kubernetes.cnpg_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_podRole"]
          regex         = "instance"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9187"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
          target_label  = "cnpg_cluster"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/cnpg"
        }
      }

      prometheus.scrape "cnpg" {
        targets         = discovery.relabel.cnpg_pods.output
        forward_to      = [prometheus.relabel.cnpg.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      prometheus.relabel "cnpg" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          // cnpg_pg_database_size_bytes feeds the per-database 15 GiB warning in
          // infra observability-alerting (onprem-data-p0.tf): one series per
          // cluster+datname, so growth is visible before the filesystem floor.
          regex         = "cnpg_pg_stat_archiver_failed_count|cnpg_pg_replication_lag|cnpg_collector_up|(cnpg_collector|barman_cloud_cloudnative_pg_io)_(last_available_backup_timestamp|last_failed_backup_timestamp|first_recoverability_point)|cnpg_backends_total|cnpg_pg_database_size_bytes|cnpg_pg_settings_setting|up|scrape_samples_scraped"
          action        = "keep"
        }
        // Connection-slot alert (infra observability-alerting): backends over
        // max_connections. pg_settings exports one series per setting; keep
        // only max_connections (RE2 has no negative lookahead, so mark the
        // keeper in a temp label, drop the rest, then drop the temp label).
        rule {
          source_labels = ["__name__", "name"]
          regex         = "cnpg_pg_settings_setting;max_connections"
          target_label  = "__tmp_keep"
          replacement   = "1"
        }
        rule {
          source_labels = ["__name__", "__tmp_keep"]
          regex         = "cnpg_pg_settings_setting;"
          action        = "drop"
        }
        rule {
          regex  = "__tmp_keep"
          action = "labeldrop"
        }
      }

      // External Secrets controller (pod port 8080, `metrics`). The chart's
      // annotation autodiscovery reads `k8s.grafana.com/*` annotations, not the
      // `prometheus.io/*` ones ESO carries, so it never scraped this pod.
      // honor_labels keeps the ExternalSecret's own `name`/`namespace` labels,
      // which the sync-failure rule groups by.
      discovery.kubernetes "eso_pods" {
        role = "pod"
        namespaces {
          names = ["external-secrets"]
        }
      }

      discovery.relabel "eso_pods" {
        targets = discovery.kubernetes.eso_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "external-secrets"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "8080"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/external-secrets"
        }
      }

      prometheus.scrape "eso" {
        targets         = discovery.relabel.eso_pods.output
        forward_to      = [prometheus.relabel.eso.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
        honor_labels    = true
      }

      prometheus.relabel "eso" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        // Only the failing condition is read: the sync-failure rule
        // (infra onprem-signals.tf) queries
        // externalsecret_status_condition{condition="Ready",status="False"}.
        // Every ExternalSecret also exports status="True", and one healthy
        // series per secret is pure cardinality.
        rule {
          source_labels = ["__name__", "condition", "status"]
          regex         = "(externalsecret_status_condition;Ready;False|up;;|scrape_samples_scraped;;)"
          action        = "keep"
        }
      }

      // NVIDIA DCGM exporter on the GPU node (platform/ai/dcgm-exporter.yaml,
      // deployed by platform-ai). Five fields on ONE physical GPU: utilisation,
      // memory utilisation, framebuffer used, temperature, XID errors — plus
      // `up`/`scrape_samples_scraped`, so this whole job is 7 series. The
      // allowlist repeats the ConfigMap's collector list on purpose: a widened
      // custom CSV must be widened here too, or the budget silently breaks.
      discovery.kubernetes "dcgm_pods" {
        role = "pod"
        namespaces {
          names = ["ai"]
        }
      }

      discovery.relabel "dcgm_pods" {
        targets = discovery.kubernetes.dcgm_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "dcgm-exporter"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9400"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/dcgm-exporter"
        }
      }

      prometheus.scrape "dcgm" {
        targets         = discovery.relabel.dcgm_pods.output
        forward_to      = [prometheus.relabel.dcgm.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      prometheus.relabel "dcgm" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "DCGM_FI_DEV_(GPU_UTIL|MEM_COPY_UTIL|FB_USED|GPU_TEMP|XID_ERRORS)|up|scrape_samples_scraped"
          action        = "keep"
        }
      }

      // Beyla (OBI phase 1) in the dedicated `obi` namespace. The chart feature scrapes
      // only its own namespace, so this block does it, with the series budget: duration
      // histograms (server, client, rpc, db) and the service-graph totals, nothing else.
      discovery.kubernetes "obi_pods" {
        role = "pod"
        namespaces {
          names = ["obi"]
        }
      }

      discovery.relabel "obi_pods" {
        targets = discovery.kubernetes.obi_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "beyla"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_number"]
          regex         = "9090"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_container_port_number"]
          separator     = ":"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "instance"
        }
        rule {
          target_label = "job"
          replacement  = "integrations/beyla"
        }
      }

      prometheus.scrape "obi" {
        targets         = discovery.relabel.obi_pods.output
        forward_to      = [prometheus.relabel.obi.receiver]
        scrape_interval = "60s"
        scrape_timeout  = "10s"
        honor_labels    = true
      }

      prometheus.relabel "obi" {
        forward_to = [prometheus.remote_write.grafana_metrics.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "(http_server_request_duration_seconds|http_client_request_duration_seconds|rpc_server_duration_seconds|rpc_client_duration_seconds|db_client_operation_duration_seconds)_(bucket|sum|count)|traces_service_graph_request_(total|failed_total)|up|scrape_samples_scraped"
          action        = "keep"
        }
        // The Adaptive Metrics rules (infra live/adaptive-metrics) aggregate every `http_server_*` /
        // `http_client_*` series down to the labels job, service_*, deployment_environment_name,
        // method, status_class, route and le. Beyla names the same dimensions http_request_method,
        // http_response_status_code and http_route, which AM would DROP, leaving RED metrics with no
        // error rate. Rename them to the app convention BEFORE they reach Mimir.
        rule {
          source_labels = ["http_request_method"]
          target_label  = "method"
        }
        rule {
          source_labels = ["http_response_status_code"]
          regex         = "([1-5])[0-9][0-9]"
          replacement   = "${1}xx"
          target_label  = "status_class"
        }
        rule {
          source_labels = ["http_route"]
          target_label  = "route"
        }
        rule {
          regex  = "http_request_method|http_response_status_code|http_route"
          action = "labeldrop"
        }
        // Belt and braces: the path is never a label (Beyla is told not to emit it too).
        rule {
          regex  = "url_path|url_full|client_address"
          action = "labeldrop"
        }
      }

    extraService:
      enabled: true
      name: receiver

# ── Proxmox host → alloy: the host-OTLP door (PVE 9 OpenTelemetry) ──────────
# The Proxmox host pushes host/VM/storage gauges itself (Datacenter > Metric
# Server, type OpenTelemetry, OTLP/HTTP JSON, no auth, path `/v1/metrics`).
# It is not a cluster node, so it cannot use `alloy-receiver.platform.svc`;
# it needs a port on a k3s node. This is a NodePort on the SAME receiver port
# (4318), not a second receiver: the chart's OTLP receiver already forwards
# metrics, and the filter above bounds what the door may add. OTLP/HTTP only;
# gRPC 4317 stays in-cluster (the PVE plugin never uses it).
#
# Rendered through the chart's `extraObjects` rather than a plain file next to
# this one: `apps/platform-observability.yaml` has ONE Helm source and no git
# directory source, so a loose manifest here would never be deployed, and
# adding a second source to that Application would put CRD-adjacent plumbing
# in two owners' hands for two objects.
extraObjects:
  # The host-facing Service. Selector is the chart's own (same as the rendered
  # `alloy-receiver` Service): `app.kubernetes.io/name=alloy` +
  # `app.kubernetes.io/instance=alloy`.
  - apiVersion: v1
    kind: Service
    metadata:
      name: alloy-otlp-host
      namespace: platform
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: alloy
        app.kubernetes.io/component: networking
    spec:
      type: NodePort
      # Cluster, not Local. The DaemonSet does run on every node (it tolerates
      # every taint above), so Local's precondition holds — but Local's only
      # benefit is that the client IP survives, and nothing here reads it: no
      # auth, no IP allowlist, the guard is the name filter above. Cluster also
      # survives the entry node's Alloy pod rescheduling, which Local would
      # turn into a dead 30418 on that node.
      externalTrafficPolicy: Cluster
      selector:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: alloy
      ports:
        - name: otlp-http
          protocol: TCP
          port: 4318
          targetPort: 4318
          nodePort: 30418

  # `platform-admit` (platform/networkpolicy/platform.yaml) default-denies
  # ingress into EVERY `platform` pod and admits only pod sources (its own
  # namespace and product namespaces), so the host's NodePort traffic would be
  # dropped at the pod even though kube-proxy delivered it. NetworkPolicies are
  # additive: this one allows 4318 (the same port the products already may use
  # in-cluster) to the Alloy pods. The source list is RFC1918 ranges and is
  # DEFENSE IN DEPTH, not an allowlist of the Proxmox host:
  # externalTrafficPolicy Cluster SNATs the client to a node address, so the
  # pod sees a node IP, and no on-prem address or VLAN subnet is written here
  # (those are Tier 1). The real boundary is the server VLAN plus the PVE-name
  # filter above (a later upstream firewall rule is the owner's). The port
  # carries no authentication (PVE's plugin has none), so the filter is what
  # bounds what an accepted connection can add.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: alloy-otlp-host
      namespace: platform
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          app.kubernetes.io/instance: alloy
      policyTypes: [Ingress]
      ingress:
        - from:
            - ipBlock:
                cidr: 10.0.0.0/8
            - ipBlock:
                cidr: 172.16.0.0/12
            - ipBlock:
                cidr: 192.168.0.0/16
          ports:
            - protocol: TCP
              port: 4318

# The operator is chart-managed (CRDs + one Deployment). It is the cost of
# chart 4.x; the alternative (chart 3.x's five fixed collectors) was worse.
alloy-operator:
  deploy: true
