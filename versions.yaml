# ⚠ ALL FOUR PLATFORM CHART PINS WERE NON-EXISTENT until 2026-09-21.
#
# They were written 2026-09-15 and this file's own README said "verify each one
# before the first install — they were written 2026-09-15 and releases move".
# Nobody had, and the first real install failed with:
#
#   Error: chart "external-secrets" matching 0.20.0 not found in
#   external-secrets index. no chart version found for external-secrets-0.20.0
#
# The drift was not a patch or two:
#
#   external-secrets  0.20.0 -> 2.11.0   TWO major versions (0.x -> 1.x -> 2.x)
#   keda              2.18.0 -> 2.20.2
#   argo-cd           8.5.0  -> 10.9.2   two majors
#   alloy             1.6.0  -> 1.12.1
#
# ESO AND KEDA ARE VERIFIED AGAINST THE NEW CHARTS, not merely bumped: the values
# files render, and — which matters more, because Helm silently IGNORES unknown
# value keys — the IRSA annotations still land on `external-secrets` and
# `keda-operator`, and ESO still renders its 25 CRDs. A bump that rendered while
# quietly dropping the annotation would have produced an operator that runs and
# never syncs a secret.
#
# ⚠ argo-cd AND alloy ARE NOT YET VERIFIED. They are corrected here to versions
# that exist, but nothing has rendered their values against them and argo-cd
# crosses two majors. Do that before installing either — the same check as above:
# render, then confirm the values you care about actually appear in the output.
# Platform component versions — the single place they are pinned.
#
# §2b: "Before each upgrade, check API compatibility for the three things that pin
# Kubernetes versions: ArgoCD, Alloy, External Secrets Operator." That check is one
# diff against this file, and the quarterly upgrade is one PR.
#
# ⚠ VERIFY EVERY LINE BEFORE THE FIRST INSTALL. These were written 2026-09-15 from
# what was current then; releases move. `helm search repo <chart> --versions` and the
# EKS "supported versions" page are the authoritative answers, not this file.
#
# Rules
#   - exact versions, never ranges. §11c's argument for pinning the chart applies
#     to everything the chart depends on
#   - bump one component per PR, with the upstream changelog linked
#   - dev first, soak, then prod (§2b)

kubernetes:
  # Target the newest version EKS supports at install time, then hold N or N-1 and
  # never reach N-3 (§2b). `trafficDistribution: PreferClose` (§9j) needs 1.31+;
  # it is GA from 1.33, which is the floor this chart declares.
  eks: "1.33"

platform:
  # ── The three that pin the Kubernetes version (§2b) ──────────────────────────
  argo-cd:
    chart: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.9.2"          # ArgoCD 3.x
  alloy:
    chart: alloy
    repo: https://grafana.github.io/helm-charts
    version: "1.12.1"
  external-secrets:
    chart: external-secrets
    repo: https://charts.external-secrets.io
    version: "2.11.0"

  # ── Everything else ──────────────────────────────────────────────────────────
  keda:
    chart: keda
    repo: https://kedacore.github.io/charts
    version: "2.20.2"
  gateway-api:
    # CRDs, applied directly — not a chart. Standard channel.
    version: "v1.6.2"
  envoy-gateway:
    chart: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: "1.9.0"
  policy-controller:
    # Sigstore — image signature verification only. Everything else is
    # ValidatingAdmissionPolicy, which is in-tree and pins nothing (§10).
    chart: policy-controller
    repo: https://sigstore.github.io/helm-charts
    version: "0.10.8"

images:
  cloudflared: "2026.9.1"
  clamav: "1.5"               # amd64 only — the estate's one exception (§4c)
  # ⚠ THE IMAGE THIS POINTED AT NO LONGER EXISTS, AND NOR DOES ITS REGISTRY ENTRY.
  #
  #   bitnami/pgbouncer        repository exists, 20M pulls, ZERO TAGS
  #   bitnami/pgbouncer:1.24.1 NOT FOUND
  #   bitnamilegacy/pgbouncer:1.24.1  exists, last pushed 2025-07-03
  #
  # Bitnami moved its older public images to `bitnamilegacy/` and emptied the main
  # namespace. So every product with `pooling: pgbouncer` — rova, opshub and
  # qnsc-kb, i.e. all of them — would have hit ImagePullBackOff on first deploy,
  # and PgBouncer is in the data path, so nothing would serve.
  #
  # NOT FIXED BY A TAG CHANGE, which is why this is a comment and not a version.
  # The chart's template is written against Bitnami's PGBOUNCER_* env-var
  # interface, and the two live alternatives do not share it:
  #
  #   pgbouncer/pgbouncer   the OFFICIAL upstream image, pushed 2026-09-20,
  #                         tags 1.25.2-20260920 / 1.25.1 / 1.25. Configured by
  #                         pgbouncer.ini, so it needs a ConfigMap and a rewrite
  #                         of templates/pgbouncer.yaml
  #   edoburu/pgbouncer     third-party but maintained, v1.25.2-p0 (2026-06-10),
  #                         env-var driven (DB_HOST, POOL_MODE, MAX_CLIENT_CONN,
  #                         AUTH_TYPE) — the same SHAPE as today, different names
  #
  # `bitnami/pgbouncer:latest` is not an option even as a stopgap: the estate's own
  # `qnsc-image-tags` admission policy denies `:latest`, and correctly.
  #
  # AND THERE IS A DEEPER QUESTION TO SETTLE FIRST. §8 says Postgres uses RDS IAM
  # authentication, where "no password exists" — but an IAM token expires every 15
  # minutes, and PgBouncer needs a credential to open its own server-side pool. The
  # current template does `envFrom` the app secret, which implies a STATIC password.
  # Those two designs are not compatible, and choosing an image before resolving it
  # would be choosing the wrong thing carefully. See §5d and §8.
  pgbouncer: "UNRESOLVED — see the note above. Was bitnami/pgbouncer:1.24.1, which no longer exists."

# ── Toolchain, for CI and for humans ─────────────────────────────────────────
tools:
  # 4.3.0, not 3.18. gitops/.github/workflows/chart-ci.yaml pins 4.3.0, and the
  # committed golden render in rendered/ is byte-dependent on it — 4.1.3 places
  # blank lines differently, so a local render with the wrong major reports the
  # golden output as stale when it is not.
  helm: "4.3.0"
  kubeconform: "0.7.0"
  helm-unittest: "0.8.2"
  # RECORDS REALITY, not an aspiration. This said 1.10 and every workflow in the
  # estate pins 1.9.1 — infra, rova, opshub, qnsc-kb-backend, iac-lint's default and
  # infra-template/.opentofu-version. A version file that disagrees with CI is worse
  # than one that is behind: it is what made `prevent_destroy = var.x` look available
  # when 1.9.1 rejects it, and cost a reverted change (task 0.3).
  #
  # Upgrading to 1.10+ is a real option with a specific prize — the variable form of
  # prevent_destroy becomes legal — but it changes the binary that applies production
  # and belongs in its own change, not in a version bump.
  opentofu: "1.9.1"
