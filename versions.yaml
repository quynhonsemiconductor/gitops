# ⚠ ALL FOUR PLATFORM CHART PINS WERE NON-EXISTENT until 2026-09-21.
#
# They were written 2026-09-15 and this file's own README said "verify each one
# before the first install — they were written 2026-09-15 and releases move".
# Nobody had, and the first real install failed with:
#
#   Error: chart "external-secrets" matching 0.20.0 not found in
#   external-secrets index. no chart version found for external-secrets-0.20.0
#
# The drift was not a patch or two:
#
#   external-secrets  0.20.0 -> 2.11.0   TWO major versions (0.x -> 1.x -> 2.x)
#   argo-cd           8.5.0  -> 10.9.2   two majors
#   alloy             1.6.0  -> 1.12.1
#
# ESO WAS VERIFIED AGAINST THE NEW CHART, not merely bumped: the values
# files render, and — which matters more, because Helm silently IGNORES unknown
# value keys — the IRSA annotation still lands on `external-secrets`, and ESO still
# renders its 25 CRDs. (KEDA was in this table until 2026-10-13 and is gone.) A bump that rendered while
# quietly dropping the annotation would have produced an operator that runs and
# never syncs a secret.
#
# ⚠ argo-cd AND alloy ARE NOT YET VERIFIED. They are corrected here to versions
# that exist, but nothing has rendered their values against them and argo-cd
# crosses two majors. Do that before installing either — the same check as above:
# render, then confirm the values you care about actually appear in the output.
# Platform component versions — the single place they are pinned.
#
# §2b: "Before each upgrade, check API compatibility for the three things that pin
# Kubernetes versions: ArgoCD, Alloy, External Secrets Operator." That check is one
# diff against this file, and the quarterly upgrade is one PR.
#
# ⚠ VERIFY EVERY LINE BEFORE THE FIRST INSTALL. These were written 2026-09-15 from
# what was current then; releases move. `helm search repo <chart> --versions` and the
# EKS "supported versions" page are the authoritative answers, not this file.
#
# Rules
#   - exact versions, never ranges. §11c's argument for pinning the chart applies
#     to everything the chart depends on
#   - bump one component per PR, with the upstream changelog linked
#   - dev first, soak, then prod (§2b)

kubernetes:
  # The floor the chart declares (`kubeVersion`): `trafficDistribution: PreferClose`
  # (§9j) needs 1.31+ and is GA from 1.33. The k3s version to run is chosen and pinned
  # here in the on-prem adaptation (EKS, which this key used to name, is gone).
  minimum: "1.33"

platform:
  # ── The three that pin the Kubernetes version (§2b) ──────────────────────────
  argo-cd:
    chart: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.9.2"          # ArgoCD 3.x
  alloy:
    chart: alloy
    repo: https://grafana.github.io/helm-charts
    version: "1.12.1"
  external-secrets:
    chart: external-secrets
    repo: https://charts.external-secrets.io
    version: "2.11.0"

  # ── The on-prem day-1 operators (ONPREM-PLAN §11.4) ─────────────────────────
  # Every line below was verified against the upstream chart index on
  # 2026-10-20 (cloudnative-pg.github.io/charts, charts.jetstack.io,
  # charts.external-secrets.io, the Docker Hub and GitHub Packages registry
  # APIs). Renovate keeps them current; majors are reviewed monthly (§16.2).
  cert-manager:
    chart: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.21.2"         # 1.21 line; 1.19 out of support
  cloudnative-pg:
    chart: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: "0.29.1"          # operator 1.30.1 (in-tree barman removed 1.31 -> plugin)
  plugin-barman-cloud:
    chart: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: "0.8.1"           # plugin v0.15.1; requires cert-manager (its mTLS)
  prometheus-operator-crds:
    chart: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: "32.0.2"          # CRDs only (apps/platform-prometheus-crds.yaml); goes when k8s-monitoring lands
  postgresql:
    # ImageCatalog pin (§6.3) — `standard` = the flavour carrying pgvector
    # (pg-dev's `kb` database needs it). Digest verified 2026-10-20 against
    # the GitHub Packages API; Renovate's regex manager keeps it current.
    image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
  valkey:
    # §6.4 — 8.1.x by digest; NEVER 8.2 (ElastiCache 8.2 = OSS 8.1 + search).
    # Digest verified 2026-10-20 against the Docker Hub registry API.
    image: valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
  redis-exporter:
    # §12 — the valkey metrics sidecar (9121). v1.94.0 released 2026-10-15,
    # under the 14-day floor — this is v1.93.0 (2026-10-01), verified against
    # the Docker Hub registry API 2026-10-21. Renovate bumps when it ages in.
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820

  # ── Everything else ──────────────────────────────────────────────────────────
  # REMOVED 2026-10-20 with platform/gateway (ONPREM-PLAN §13): gateway-api CRDs
  # and envoy-gateway — no Gateway on-prem, ingress is a Tunnel rule in
  # infra/live/onprem; both return only via §9's Envoy-Gateway trigger.
  # policy-controller (Sigstore/Cosign) is §9-postponed, not needed day 1.

images:
  # §11.4 — monthly release, pinned by digest (amd64 index on Docker Hub).
  # 2026.10.2 verified 2026-10-20: docker.io/cloudflare/cloudflared tag digest
  cloudflared: "2026.10.2@sha256:0e56c13c7058fcef9c4f0e7d83372f82330548dbf8f8b366f3d8b506526d93b2"
  clamav: "1.5"               # amd64 only — the estate's one exception (§4c)

  # §9.1 — text-embeddings-inference. The `120-` line is the CUDA 12.9 /
  # Blackwell sm_120 build (RTX 5060 Ti), marked EXPERIMENTAL upstream; the
  # plain tag is the CPU line used by the phase-A fallback. Both index digests
  # verified anonymously on GHCR 2026-10-31 (tags 120-1.9.4 and 1.9.4).
  tei-gpu: "ghcr.io/huggingface/text-embeddings-inference:120-1.9.4@sha256:bd8e5b1954146f7fe8590b64b959bc194433c6c38c036592a84d736841ca9400"
  tei-cpu: "ghcr.io/huggingface/text-embeddings-inference:1.9.4@sha256:02864b69c15e4f247b8306b0be8801d6800fed97702185fb19d98170e956fab1"

# Model pins for the AI services (§9.1). Model identity is part of the data:
# changing a line here changes the vector space and is a planned migration.
models:
  embedding:
    id: intfloat/multilingual-e5-large-instruct
    revision: "274baa43b0e13e37fafa6428dbc7938e62e5c439"
    dimension: 1024
    dtype: float32
    pooling: mean
  reranker:
    id: BAAI/bge-reranker-v2-m3
    revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
    dtype: float32

# ── Toolchain, for CI and for humans ─────────────────────────────────────────
tools:
  # 4.3.0, not 3.18. gitops/.github/workflows/chart-ci.yaml pins 4.3.0, and the
  # committed golden render in rendered/ is byte-dependent on it — 4.1.3 places
  # blank lines differently, so a local render with the wrong major reports the
  # golden output as stale when it is not.
  helm: "4.3.0"
  kubeconform: "0.7.0"
  helm-unittest: "0.8.2"
  # RECORDS REALITY, not an aspiration. This said 1.10 and every workflow in the
  # estate pins 1.9.1 — infra, rova, opshub, qnsc-kb-backend, iac-lint's default and
  # infra-template/.opentofu-version. A version file that disagrees with CI is worse
  # than one that is behind: it is what made `prevent_destroy = var.x` look available
  # when 1.9.1 rejects it, and cost a reverted change (task 0.3).
  #
  # Upgrading to 1.10+ is a real option with a specific prize — the variable form of
  # prevent_destroy becomes legal — but it changes the binary that applies production
  # and belongs in its own change, not in a version bump.
  opentofu: "1.9.1"
