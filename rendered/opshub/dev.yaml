# Source: qnsc-service/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opshub-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: opshub
    kind: SecretStore
  target:
    name: opshub-app
  dataFrom:
    - find:
        path: qnsc/dev/opshub/app/
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: ".*/([^/]+)$"
            target: "$1"
        - transform:
            template: '{{ .value | upper | replace "-" "_" }}'

