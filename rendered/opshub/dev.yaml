    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: dev
    qnsc.vn/tenant: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: opshub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: opshub
        app.kubernetes.io/part-of: opshub
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: opshub
        qnsc.vn/env: dev
        qnsc.vn/tenant: product
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/quynhonsemiconductor/opshub-api:sha-0000000
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 768Mi
          livenessProbe:
            httpGet: { path: /livez, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /v1/readyz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy-receiver.platform.svc:4318
            - name: OTEL_SERVICE_NAME
              value: opshub-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=opshub,deployment.environment=dev,service.version=sha-0000000
            - name: DATABASE_HOST
              value: pg-dev-rw.data-dev.svc
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "opshub"
            - name: DATABASE_USER
              value: "opshub_app"
            - name: DATABASE_SSL_CA
              value: "/etc/qnsc/db-ca/ca.crt"
            - name: DATABASE_AUTH
              value: "password"
            - name: NODE_ENV
              value: production
            - name: DEPLOYMENT_ENV
              value: dev
            - name: VALKEY_URL
              value: redis://valkey-dev.data-dev.svc:6379/2
            - name: OTEL_ENABLED
              value: "true"
            - name: ENTRA_TENANT_ID
              value: dc0f2078-ac28-4ff2-b21a-d4b28df32361
            - name: ENTRA_CLIENT_ID
              value: 5a83d82b-34ed-4701-b426-635fd303d875
            - name: EMAIL_PROVIDER
              value: graph
            - name: MAIL_GRAPH_SENDER
              value: noreply-opshub-dev@qnsc.vn
            - name: REDIS_KEY_PREFIX
              value: 'opshub:'
            - name: S3_FILES_BUCKET
              value: opshub-dev-attachments
            - name: STORAGE_ENDPOINT
              value: https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com
            - name: STORAGE_FORCE_PATH_STYLE
              value: "true"
            - name: PORT
              value: "3000"
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
            - name: DATABASE_POOL_MAX
              value: "10"
            - name: APP_URL
              value: https://opshub-dev.qnsc.vn
            - name: CORS_ORIGINS
              value: https://opshub-dev.qnsc.vn
          envFrom:
            - secretRef:
                name: opshub-app
            - secretRef:
                name: opshub-api-bundle
            - secretRef:
                name: opshub-db-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/qnsc/db-ca/ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-ca
          secret:
            secretName: opshub-db-ca
            items: [{ key: ca.crt, path: ca.crt }]

