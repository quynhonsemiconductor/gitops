# Source: qnsc-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: opshub
    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: dev
    qnsc.vn/tenant: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: opshub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: opshub
        app.kubernetes.io/part-of: opshub
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: opshub
        qnsc.vn/env: dev
        qnsc.vn/tenant: product
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/quynhonsemiconductor/opshub-api:sha-0000000
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet: { path: /livez, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /v1/readyz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy-receiver.platform.svc:4318
            - name: OTEL_SERVICE_NAME
              value: opshub-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=opshub,deployment.environment=dev,service.version=sha-0000000
          envFrom:
            - secretRef:
                name: opshub-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

