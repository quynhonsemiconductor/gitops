apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: opshub
    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  # Direct read, like deployment.yaml:27 — NOT `| default 1`, which turns an
  # explicit replicas: 0 (kube-downscaler, or a deliberately parked env) back
  # into 1 because Sprig's default treats 0 as empty. web.replicas defaults to
  # 1 in values.yaml, so an omitted key still renders 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: opshub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: opshub
        app.kubernetes.io/part-of: opshub
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: opshub
        qnsc.vn/env: prod
        qnsc.vn/tenant: product
      annotations:
        checksum/config: a7eeb1f5c73bda4fbe5faf62cf6e4910f660f99968e3807ca49ac23f2a538df0
    spec:
      # A static file server never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/quynhonsemiconductor/opshub-web@sha256:414f7b78249fc6bbaabe9780faec379b892766fc6f98b09747b007500dd0165b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: web-config
              mountPath: /srv/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: web-config
          configMap:
            name: opshub-web-config
            items: [{ key: config.json, path: config.json }]

