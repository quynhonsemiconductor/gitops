# Source: qnsc-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: opshub
    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: opshub
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
          # Only the tunnel connector, not every pod in `platform` (ArgoCD,
          # operators, Alloy, ...). Both selectors in ONE `from` entry AND
          # them; two entries would admit every pod in the namespace. Alloy
          # does not scrape the product API (no metrics annotations; the
          # k8s-monitoring values scrape KSM/node only), so no Alloy entry.
          podSelector:
            matchLabels: { app.kubernetes.io/name: cloudflared }
      ports:
        - { protocol: TCP, port: 3000 }
    - from:
        - podSelector: {}          # same namespace, service to service
      ports:
        - { protocol: TCP, port: 3000 }

