# Source: qnsc-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: opshub
    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: opshub
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
          # Only the tunnel connector, not every pod in `platform` (ArgoCD,
          # operators, ...). Both selectors are in ONE `from` entry, which
          # ANDs them; two entries would admit every pod in the namespace.
          podSelector:
            matchLabels: { app.kubernetes.io/name: cloudflared }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }

