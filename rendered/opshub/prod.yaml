# Source: qnsc-service/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-platform
spec:
  # The optional SPA (`web`) is a static file server: DNS is all it needs. Every
  # egress allow below is scoped to the product's other workloads (api, worker,
  # migrator, and any future Job/CronJob), so the web pod cannot reach `platform`,
  # the internet or the data namespace if it is compromised.
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: NotIn, values: [web] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }

