# Source: qnsc-service/templates/slo.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-slo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: opshub
    app.kubernetes.io/part-of: opshub
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: opshub
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  groups:
    - name: opshub-api.slo
      rules:
        - record: slo:request_error_rate:ratio_rate5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[5m]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate30m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[30m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[30m]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate1h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[1h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[1h]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate2h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[2h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[2h]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate6h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[6h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[6h]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate1d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[1d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[1d]))
          labels:
            service: opshub-api
        - record: slo:request_error_rate:ratio_rate3d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api",http_response_status_code=~"5.."}[3d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="opshub-api"}[3d]))
          labels:
            service: opshub-api

    - name: opshub-api.burnrate
      rules:
        - alert: opshub-apiErrorBudgetBurnFast
          expr: |
            slo:request_error_rate:ratio_rate1h{service="opshub-api"} > (14.4 * 0)
            and
            slo:request_error_rate:ratio_rate5m{service="opshub-api"} > (14.4 * 0)
          for: 2m
          labels:
            severity: P2
            product: opshub
            env: prod
          annotations:
            summary: "opshub-api is burning its error budget 14x — 99% target"
            runbook: "https://github.com/quynhonsemiconductor/gitops/blob/main/runbooks/api.md"

        - alert: opshub-apiErrorBudgetBurnSlow
          expr: |
            slo:request_error_rate:ratio_rate6h{service="opshub-api"} > (6 * 0)
            and
            slo:request_error_rate:ratio_rate30m{service="opshub-api"} > (6 * 0)
          for: 15m
          labels:
            severity: P2
            product: opshub
            env: prod
          annotations:
            summary: "opshub-api is burning its error budget 6x over 6h"
        - alert: opshub-apiNoTelemetry
          expr: absent_over_time(http_server_request_duration_seconds_count{service_name="opshub-api"}[10m])
          for: 10m
          labels:
            severity: P2
            product: opshub
            env: prod
          annotations:
            summary: "opshub-api has reported no metrics for 10 minutes"
