spec:
  # Direct read, like deployment.yaml:27 — NOT `| default 1`, which turns an
  # explicit replicas: 0 (kube-downscaler, or a deliberately parked env) back
  # into 1 because Sprig's default treats 0 as empty. web.replicas defaults to
  # 1 in values.yaml, so an omitted key still renders 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: kb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: kb
        app.kubernetes.io/part-of: kb
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: kb
        qnsc.vn/env: prod
        qnsc.vn/tenant: product
      annotations:
        checksum/config: 276e397971bf93b042046c5a1eb7c64d552411a55722d3f9583fab97707b7d11
    spec:
      # A static file server never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/quynhonsemiconductor/kb-web@sha256:15f430a7514da2e1552e210913d4eccf043390b64bf7e61a8bc11a3914d3232c
