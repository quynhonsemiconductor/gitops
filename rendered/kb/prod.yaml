apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: kb
    app.kubernetes.io/part-of: kb
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: kb
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  scaleTargetRef:
    name: api
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      authenticationRef:
        name: keda-grafana
      metadata:
        serverAddress: https://prometheus-prod-ap-southeast-0.grafana.net/api/prom
