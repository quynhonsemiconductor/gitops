# Source: qnsc-service/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: kb
    app.kubernetes.io/part-of: kb
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: kb
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: kb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: kb
        app.kubernetes.io/part-of: kb
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: kb
        qnsc.vn/env: prod
        qnsc.vn/tenant: product
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: kb
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 608983206583.dkr.ecr.ap-southeast-1.amazonaws.com/kb-api:sha-0000000
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 1
              memory: 6Gi
            limits:
              memory: 6Gi
          livenessProbe:
            httpGet: { path: /livez, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /livez, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy-gateway.platform.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: kb-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=kb,deployment.environment=prod,service.version=sha-0000000
            - name: DATABASE_HOST
              value: pgbouncer
            - name: DATABASE_PORT
              value: "6432"
            - name: MALWARE_SCANNER_HOST
              value: 127.0.0.1
            - name: MALWARE_SCANNER_PORT
              value: "3310"
          envFrom:
            - secretRef:
                name: kb-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: clamav
          image: clamav/clamav:1.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3310
              name: clamd
          resources:
            requests:
              cpu: 256m
              memory: 2Gi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command:
              - clamdcheck.sh
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
              - clamdcheck.sh
            failureThreshold: 3
            periodSeconds: 60
            timeoutSeconds: 10
          volumeMounts:
            - name: clamav-tmp
              mountPath: /tmp
            - mountPath: /var/lib/clamav
              name: clamav-db
      volumes:
        - name: tmp
          emptyDir: {}
        - name: clamav-tmp
          emptyDir: {}
        - emptyDir: {}
          name: clamav-db

