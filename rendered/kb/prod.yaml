apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-slo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: kb
    app.kubernetes.io/part-of: kb
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: kb
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  groups:
    - name: kb-api.slo
      rules:
        - record: slo:request_error_rate:ratio_rate5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[5m]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate30m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[30m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[30m]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate1h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[1h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[1h]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate2h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[2h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[2h]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate6h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[6h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[6h]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate1d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[1d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[1d]))
          labels:
            service: kb-api
        - record: slo:request_error_rate:ratio_rate3d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api",http_response_status_code=~"5.."}[3d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="kb-api"}[3d]))
          labels:
            service: kb-api

    - name: kb-api.burnrate
      rules:
        - alert: kb-apiErrorBudgetBurnFast
          expr: |
            slo:request_error_rate:ratio_rate1h{service="kb-api"} > (14.4 * 0.01)
            and
            slo:request_error_rate:ratio_rate5m{service="kb-api"} > (14.4 * 0.01)
          for: 2m
          labels:
            severity: P2
            product: kb
            env: prod
          annotations:
            summary: "kb-api is burning its error budget 14x — 99% target"
            runbook: "https://github.com/quynhonsemiconductor/gitops/blob/main/runbooks/api.md"

        - alert: kb-apiErrorBudgetBurnSlow
          expr: |
            slo:request_error_rate:ratio_rate6h{service="kb-api"} > (6 * 0.01)
            and
            slo:request_error_rate:ratio_rate30m{service="kb-api"} > (6 * 0.01)
          for: 15m
          labels:
            severity: P2
            product: kb
            env: prod
          annotations:
            summary: "kb-api is burning its error budget 6x over 6h"
        - alert: kb-apiNoTelemetry
          expr: absent_over_time(http_server_request_duration_seconds_count{service_name="kb-api"}[10m])
          for: 10m
          labels:
            severity: P2
            product: kb
            env: prod
          annotations:
            summary: "kb-api has reported no metrics for 10 minutes"
