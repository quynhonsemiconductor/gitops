# Source: qnsc-service/templates/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kb-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kb
    kind: SecretStore
  target:
    name: kb-app
  dataFrom:
    - find:
        path: qnsc/dev/kb/app/
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: ".*/([^/]+)$"
            target: "$1"
        - transform:
            template: '{{ .value | upper | replace "-" "_" }}'

