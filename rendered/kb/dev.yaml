apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: kb
    app.kubernetes.io/part-of: kb
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: kb
    qnsc.vn/env: dev
    qnsc.vn/tenant: product
spec:
  # Direct read, like deployment.yaml:27 — NOT `| default 1`, which turns an
  # explicit replicas: 0 (kube-downscaler, or a deliberately parked env) back
  # into 1 because Sprig's default treats 0 as empty. web.replicas defaults to
  # 1 in values.yaml, so an omitted key still renders 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: kb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: kb
        app.kubernetes.io/part-of: kb
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: kb
        qnsc.vn/env: dev
        qnsc.vn/tenant: product
      annotations:
        checksum/config: 4a93b5909a9de6b630ca40ebe61245fbc9a50e2a61380e1938ea13ab2c0aa307
    spec:
      # A static file server never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/quynhonsemiconductor/kb-web@sha256:2f1a03b845098c0b61ec965c4bc72bfc6f3d0f24cd9457cd274fc4c240f7e7ba
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEB_API_UPSTREAM
              value: "http://api:8000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
