# Source: qnsc-service/templates/slo.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-slo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: rova
    app.kubernetes.io/part-of: rova
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: rova
    qnsc.vn/env: dev
    qnsc.vn/tenant: product
spec:
  groups:
    - name: rova-api.slo
      rules:
        - record: slo:request_error_rate:ratio_rate5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[5m]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate30m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[30m]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[30m]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate1h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[1h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[1h]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate2h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[2h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[2h]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate6h
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[6h]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[6h]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate1d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[1d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[1d]))
          labels:
            service: rova-api
        - record: slo:request_error_rate:ratio_rate3d
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api",http_response_status_code=~"5.."}[3d]))
            /
            sum(rate(http_server_request_duration_seconds_count{service_name="rova-api"}[3d]))
          labels:
            service: rova-api

    - name: rova-api.burnrate
      rules:
        - alert: rova-apiErrorBudgetBurnFast
          expr: |
            slo:request_error_rate:ratio_rate1h{service="rova-api"} > (14.4 * 0)
            and
            slo:request_error_rate:ratio_rate5m{service="rova-api"} > (14.4 * 0)
          for: 2m
          labels:
            severity: P1
            product: rova
            env: dev
          annotations:
            summary: "rova-api is burning its error budget 14x — 99.5% target"
            runbook: "https://github.com/quynhonsemiconductor/gitops/blob/main/runbooks/api.md"

        - alert: rova-apiErrorBudgetBurnSlow
          expr: |
            slo:request_error_rate:ratio_rate6h{service="rova-api"} > (6 * 0)
            and
            slo:request_error_rate:ratio_rate30m{service="rova-api"} > (6 * 0)
          for: 15m
          labels:
            severity: P2
            product: rova
            env: dev
          annotations:
            summary: "rova-api is burning its error budget 6x over 6h"
        - alert: rova-apiNoTelemetry
          expr: absent_over_time(http_server_request_duration_seconds_count{service_name="rova-api"}[10m])
          for: 10m
          labels:
            severity: P2
            product: rova
            env: dev
          annotations:
            summary: "rova-api has reported no metrics for 10 minutes"
