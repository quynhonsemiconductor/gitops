apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: rova
    app.kubernetes.io/part-of: rova
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: rova
    qnsc.vn/env: dev
    qnsc.vn/tenant: product
spec:
  # Direct read, like deployment.yaml:27 — NOT `| default 1`, which turns an
  # explicit replicas: 0 (kube-downscaler, or a deliberately parked env) back
  # into 1 because Sprig's default treats 0 as empty. web.replicas defaults to
  # 1 in values.yaml, so an omitted key still renders 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: rova
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: rova
        app.kubernetes.io/part-of: rova
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: rova
        qnsc.vn/env: dev
        qnsc.vn/tenant: product
      annotations:
        checksum/config: ed8be5e86e20ad427011ec9aa0af359747b783cc393c34607e40239f80eaa865
    spec:
      # A static file server never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/quynhonsemiconductor/rova-web@sha256:f235e79e6e2ee8ffeeddc278ab6c2c5129bfe2e6bef929776c2dc044d77d5312
