apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: rova
    app.kubernetes.io/part-of: rova
    app.kubernetes.io/managed-by: Helm
    qnsc.vn/product: rova
    qnsc.vn/env: prod
    qnsc.vn/tenant: product
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: rova
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: rova
        app.kubernetes.io/part-of: rova
        app.kubernetes.io/managed-by: Helm
        qnsc.vn/product: rova
        qnsc.vn/env: prod
        qnsc.vn/tenant: product
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: arm64
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/instance: rova
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 608983206583.dkr.ecr.ap-southeast-1.amazonaws.com/rova-api:sha-0000000
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet: { path: /livez, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /v1/readyz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy-gateway.platform.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: rova-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=rova,deployment.environment=prod,service.version=sha-0000000
            - name: DATABASE_AUTH
              value: "iam"
          envFrom:
            - secretRef:
                name: rova-app
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

