name: chart

# §11c — the chart is a dependency shared by every service in the estate, so a bad
# version of it reaches all of them at once. §11 promotes IMAGE tags through a
# reviewable diff; this is the equivalent gate for the artefact with more reach.
#
# Three checks, in increasing order of what they catch:
#   helm lint       the values files satisfy the PINNED chart's values.schema.json
#   helm unittest   the platform invariants still hold
#   golden render   THE CONTROL — the exact manifest diff for every Application,
#                   rendered with the chart version each row pins (not HEAD)
#   HEAD preview    the chart at HEAD rendered against every row's values, in a
#                   throwaway directory (NOT committed), so a chart PR is tested
#                   before any Application pins it

# The `chart` job is a REQUIRED status check. A path filter on the trigger means it never
# reports on a PR that touches none of those paths, and the PR is blocked forever. So the
# workflow runs on every PR; `changes` decides whether the heavy `checks` job is needed;
# the final `chart` job ALWAYS reports (success when the checks passed or were not needed).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HELM_VERSION: "4.3.0"
  KUBECONFORM_VERSION: "0.7.0"
  # The Kubernetes version manifests are validated against. Bump it in
  # versions.yaml first — §2b keeps component versions in one place.
  KUBE_VERSION: "1.33.0"
  # The CRD schema catalogue, PINNED to a commit instead of `main`. On 2026-10-08 the catalogue replaced
  # external-secrets.io/secretstore_v1.json (#988) with a file kubeconform cannot load ("could not find schema for
  # SecretStore"), which turned this job red on main's own render and on every PR from then on. This is the last commit before that
  # change. Bump it deliberately, running kubeconform locally first.
  CRD_CATALOG_SHA: "f3e4382095909ac60000da025f323ba44d4c738a"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
               | grep -Eq '^(charts|values|rendered|platform|apps|appsets|scripts)/|^\.github/workflows/chart-ci\.yaml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing here pushes a git ref — the chart is published to ECR as an
        # OCI artefact, and the tag bump happens in `ci`'s bump-gitops-tag with
        # its own token. A persisted credential would have nothing to do.
        with: { persist-credentials: false }

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      # ── lint, per Application, against its PINNED chart ──────────────────────
      # A bare `helm lint` FAILS by design: this chart is not renderable without a
      # product, because values.schema.json requires product, env and services and
      # the chart carries no empty placeholders for them.
      #
      # The chart linted is the one the Application pins, not HEAD — that is what
      # caught the `web` values block when rova-dev was still pinned to 0.15.1.
      # A schema check against HEAD says nothing about the chart ArgoCD pulls.
      - name: helm lint (pinned charts)
        run: |
          set -euo pipefail
          fail=0
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # Capture FIRST: `done < <(render.sh --rows)` would hide a parser
          # failure — the loop would lint nothing and the step would pass.
          rows=$(./scripts/render.sh --rows)
          if [ -z "$rows" ]; then
            echo "::error::appsets/products.yaml has no enabled chart row"
            exit 1
          fi
          while read -r product env version; do
            echo "::group::lint ${product}/${env} (chart ${version})"
            # THE SAME THREE FILES render.sh passes, in the same order. Linting a
            # different value set from the one that renders is how this check
            # failed on every run since the repository was created: without
            # tags.<env>.yaml there is no image tag, and job.yaml derives the
            # Job's NAME from it (a Job's pod template is immutable, so the name
            # must change per revision). No tag, no valid name, ERROR at
            # job.yaml:12.
            chartdir="$tmp/$version/qnsc-service"
            if [ ! -d "$chartdir" ]; then
              mkdir -p "$tmp/$version"
              helm pull "oci://ghcr.io/quynhonsemiconductor/charts/qnsc-service" \
                --version "$version" --untar --untardir "$tmp/$version"
            fi
            helm lint "$chartdir" \
              -f "values/${product}/base.yaml" \
              -f "values/${product}/${env}.yaml" \
              -f "values/${product}/tags.${env}.yaml" || fail=1
            echo "::endgroup::"
          done <<< "$rows"
          exit $fail

      # The gate's own negative test: a values key the PINNED chart's schema does
      # not know must abort the render with helm's schema error. This is the
      # #163/#174 incident reduced to one file — the check is only real if a bad
      # values file fails it.
      - name: schema gate rejects an unknown values key
        env:
          NEGATIVE_CHART_VERSION: "0.15.1"   # before `web` existed; keeps testing the gate after the rows move on
        run: |
          if helm template mutation \
               "oci://ghcr.io/quynhonsemiconductor/charts/qnsc-service" \
               --version "$NEGATIVE_CHART_VERSION" \
               -f values/rova/base.yaml \
               -f values/rova/dev.yaml \
               -f values/rova/tags.dev.yaml \
               -f scripts/fixtures/web-not-allowed.yaml > /tmp/mutation.out 2>&1; then
            echo "::error::the pinned chart accepted an unknown 'web' key — the schema gate is not working"
            exit 1
          fi
          if ! grep -q "additional properties 'web' not allowed" /tmp/mutation.out; then
            echo "::error::render failed, but not for the schema reason this test asserts"
            sed -n '1,20p' /tmp/mutation.out
            exit 1
          fi
          echo "schema gate ok: $(grep -o "additional properties 'web' not allowed" /tmp/mutation.out | head -1)"

      - name: helm unittest
        run: helm unittest charts/qnsc-service

      # ── kubeconform ──────────────────────────────────────────────────────────
      # Validates the rendered output against real Kubernetes schemas, including
      # the CRDs the platform depends on — Gateway API, External Secrets and
      # Prometheus Operator. Without the CRD catalogue those resources are skipped
      # silently, which is worse than not running it.
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tar.gz -C /tmp && sudo mv /tmp/kubeconform /usr/local/bin/

      - name: kubeconform
        run: |
          ./scripts/render.sh
          kubeconform \
            -kubernetes-version "${KUBE_VERSION}" \
            -strict \
            -summary \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            rendered/

      # The PINNED render above can never show a chart change: rows point at
      # published versions. This preview renders the chart at HEAD with every
      # row's values, into a directory that is never committed, so a chart PR is
      # validated before any Application pins it.
      - name: chart at HEAD renders for every Application (preview, not committed)
        run: |
          ./scripts/render.sh --head /tmp/rendered-head
          kubeconform \
            -kubernetes-version "${KUBE_VERSION}" \
            -strict \
            -summary \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            /tmp/rendered-head/

      # ── cross-repository contracts ───────────────────────────────────────────
      # NOT a local script. Every contract that crosses a repository boundary is
      # checked by ONE tool in `ci`, on the principle that repo-local tooling
      # stays local and cross-repo contracts live where every repo can reach
      # them. It replaced two ad-hoc scripts that were growing separately in
      # gitops/scripts and infra/scripts.
      #
      # continue-on-error until `infra` is checked out beside this one — it
      # reports unmigrated products rather than failing on them.
      - name: platform conformance
        continue-on-error: true
        run: |
          pip install --quiet pyyaml
          if [ -d ../infra ]; then
            ../ci/scripts/platform_conformance.py --root .. ||
              echo "::warning::a cross-repository contract is broken"
          else
            echo "::notice::infra not checked out — conformance skipped"
          fi

      # A prod row must not be enabled while a values file holds a `<..._PROD_...>` placeholder.
      - name: no prod placeholders behind an enabled row
        run: ./scripts/check-prod-placeholders.sh

      # ── the golden render ────────────────────────────────────────────────────
      # Unit tests on a chart serving fifteen services are necessary and not
      # sufficient. The failure to catch is "this change silently removes the
      # PodDisruptionBudget from every size-M service", which passes every unit
      # test ever written. The committed render makes it a line in a diff.
      - name: golden render is current
        run: |
          set -euo pipefail
          ./scripts/render.sh
          # `git diff` alone MISSES an untracked render: a new Application's file
          # would be written and the gate would pass. Status covers both
          # modifications and untracked files.
          changed=$(git status --porcelain --untracked-files=all rendered/)
          if [ -n "$changed" ]; then
            echo "::error::rendered/ is stale. Run ./scripts/render.sh and commit the result."
            echo "The diff below is what this change does to production."
            echo "$changed"
            git diff rendered/
            exit 1
          fi

  # The required check. Always runs; fails if `checks` failed or was cancelled, passes
  # when it succeeded or was legitimately skipped (no relevant files).
  chart:
    needs: [changes, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "changes=$CHANGES checks=$CHECKS"
          [ "$CHANGES" = "success" ] && { [ "$CHECKS" = "success" ] || [ "$CHECKS" = "skipped" ]; }
