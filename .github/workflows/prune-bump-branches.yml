# =============================================================================
# Delete a bump branch once its pull request is merged.
#
# `ci/actions/bump-gitops-tag` pushes one `bump/<product>-dev-sha-<sha>` branch per
# product commit and never deletes it; the first PR merge leaves it behind for
# good. By 2026-11-04 there were dozens, which is what made the ref list
# unreadable. Keeping the ref list to branches with a live PR also removes one
# unknown from the intermittent `remote: fatal error in commit_refs` push
# rejections seen from rova and qnsc-kb-frontend on 2026-11-04.
#
# The branch is only ever a transport: the merge is what matters, and the App
# token that opens it expires with the run. Delete on `closed` and only when the
# PR actually merged — an abandoned PR keeps its branch for inspection.
# =============================================================================
name: prune bump branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'bump/')
    steps:
      - name: Delete the merged bump branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # A merged PR is not proof the ref is free: another OPEN pull request may
          # still name it as head or base (a stacked promotion PR is based on the
          # bump branch, and a re-run can open a second PR from the same ref). The
          # merged event alone would then delete a branch something still needs;
          # skip and let that PR's own merge do it.
          open_refs=$(gh pr list --repo "$REPO" --state open --limit 200 \
                        --json headRefName,baseRefName --jq '.[] | .headRefName, .baseRefName')
          if printf '%s\n' "$open_refs" | grep -qxF "$REF"; then
            echo "::notice::$REF is still named by an open pull request; not deleting it."
            exit 0
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$REF"
          echo "deleted $REF"
