# =============================================================================
# Leak guard — deterministic check that internal names stay out of this public
# repository: qnsc.vn hostnames and mail, GUIDs, private addresses, and (fed in
# at RUNTIME from org variables, never written here) the org's Entra tenant GUID
# and AWS account number. Patterns and exemptions live in ci's
# actions/leak-guard; this repository's intentional public names are allowlisted
# in .github/leak-guard-allowlist.txt.
# =============================================================================
name: Leak guard

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter — see tf-modules' ci.yml for the stacked-PR incident
    # a base-branch filter caused.

concurrency:
  group: leak-guard-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  leak-guard:
    name: Leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tree is scanned at HEAD only (gitleaks owns history). The runtime
      # identifiers disarm if their org variable is unset — the summary names
      # which patterns ran.
      - uses: quynhonsemiconductor/ci/actions/leak-guard@ae52bdb8f3a5eecfc8d5f2665053ac872d4cb6f0 # v1.26.0
        with:
          entra-tenant-id: ${{ vars.ENTRA_TENANT_ID }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
