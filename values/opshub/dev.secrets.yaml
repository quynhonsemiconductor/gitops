# Every Key Vault secret opshub-dev reads (vault kv-qnsc-dev), machine-readable for the
# provisioning script. NOT a values file: nothing renders it. Names and rules only.
# Source of truth for the classes: opshub libs/platform/src/config/env.schema.ts (cited per entry).
#
# class: generated        -> the script creates it from the rule below
#        third-party      -> issued by a vendor; the owner supplies it through stdin
#        owner-provided   -> a value only the owner knows
#        generated-cert   -> key + certificate created for the Entra service app
# kv value shape: always a plain string (no JSON), except graph-cert (one combined PEM).
vault: kv-qnsc-dev
secrets:
  - name: opshub-dev-redis-url
    env: VALKEY_URL
    class: generated
    chart: secrets.env (api + worker)
    format: "redis://opshub:<hex 48>@valkey-dev.data-dev.svc:6379/2"
    template: "redis://opshub:{pw}@valkey-dev.data-dev.svc:6379/2"
    rule: "Valkey URL of the shared dev Valkey, database 2. The password is openssl rand -hex 24 substituted for {pw}; the valkey ACL file and the exporter password are DERIVED from this value by the ExternalSecret in platform/valkey/ (a rotation needs a restart of that Valkey)."
  - name: opshub-dev-cookie-secret
    env: COOKIE_SECRET
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. Schema: string min 32 (env.schema.ts:74). Own value: not the CSRF or Better Auth secret. Rotating signs out every cookie."
  - name: opshub-dev-csrf-secret
    env: CSRF_SECRET
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. Schema: string min 32 (:83). HMAC key binding a CSRF token to its session; distinct from COOKIE_SECRET."
  - name: opshub-dev-better-auth-secret
    env: BETTER_AUTH_SECRET
    class: generated
    chart: secrets.envApiOnly (api only)
    format: base64, 64 chars
    rule: "openssl rand -base64 48 (strip the newline). Schema: string min 32 (:443). The worker REFUSES to start with it set (:554 forbidden)."
  - name: opshub-dev-entra-client-secret
    env: ENTRA_CLIENT_SECRET
    class: third-party
    chart: secrets.envApiOnly (api only)
    format: opaque string from Entra (client secret VALUE, not its id)
    rule: "Client secret of the sign-in app 'OpsHub Dev' (client id is in values/opshub/dev.yaml). Optional in the schema, required for sign-in. Lifetime <= 6 months (ONPREM-PLAN 7.5). API only (:455)."
  - name: opshub-dev-storage-access-key-id
    env: STORAGE_ACCESS_KEY_ID
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 access key id (32 hex chars)
    rule: "R2 API token scoped to opshub-develop-attachments, object read+write (:107)."
  - name: opshub-dev-storage-secret-access-key
    env: STORAGE_SECRET_ACCESS_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 secret access key (64 hex chars)
    rule: "Secret half of the same R2 token (:108). Create the pair together; rotate both."
  - name: opshub-dev-db-app
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.db (api)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. Also the CNPG managed role opshub_app password (platform/cnpg/pg-dev.yaml)."
  - name: opshub-dev-db-worker
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbWorker (worker only)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role opshub_worker."
  - name: opshub-dev-db-migrator
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbMigrator (migrator Job only)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role opshub_migrator; owns the opshub database."
  - name: opshub-dev-graph-cert
    env: "(file) AZURE_CLIENT_CERTIFICATE_PATH"
    class: generated-cert
    chart: secrets.workerOnly.graphCert (worker only, mounted as cert.pem)
    format: one combined PEM, private key (PKCS#8) then certificate
    rule: "Certificate credential of the 'OpsHub Dev Service' Entra app (client id MAIL/GRAPH 328bac47-...); already in kv-qnsc-dev from the AWS-exit copy-out. Created in Key Vault, never in a file on disk."

# Deliberately NOT mapped:
#   - PLATFORM_ADMIN_EMAILS: opshub has no admin roster (rova-only).
#   - EDGE_CLIENT_IP_SECRET: the same-origin tunnel route retires the Pages Function
#     that signed the client IP (env.schema.ts:404 explains the requirement).
#   - IDENTITY_TEST_LOGIN: CI-only.
not_mapped:
  - { env: EDGE_CLIENT_IP_SECRET, why: "optional (:396-405); no Pages Function in front of the API on-prem (same-origin Tunnel route)" }
  - { env: GITHUB_WEBHOOK_SECRET, class: generated, why: "optional; the webhook answers 503 until set" }
