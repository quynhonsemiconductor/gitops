# Like-for-like with qnsc-kb-backend/infra/live/develop/main.tf:
# api 2048/8192, worker 4096/8192, both on Spot.
env: dev
size: s
data:
  postgres: { mode: shared }        # dev is shared with no exceptions (§5)
services:
  api:
    capacity: spot                  # dev has no revenue to protect
    resources: { cpu: 2, memory: 8Gi }
  worker:
    resources: { cpu: 4, memory: 8Gi }
