# Every Key Vault secret kb-prod reads (vault kv-qnsc-prod), machine-readable for the
# provisioning script. NOT a values file: nothing renders it. Names and rules only.
# OWNER creates these later (`platform/bootstrap/secrets.sh --product kb --env prod
# --vault-app kv-qnsc-prod --skip-site`); a move PR that enables the kb prod row while any
# is absent fails the whole ExternalSecret.
#
# Source of truth for the env names: qnsc-kb-backend src/core/config.py (line cited per entry).
#
# class: generated        -> the script creates it from the rule below
#        third-party      -> issued by a vendor; the owner supplies it through stdin
#        generated-cert   -> key + certificate created for the Entra service app (identity lane)
# kv value shape: always a plain string, except graph-cert (one combined PEM).
vault: kv-qnsc-prod
secrets:
  - name: kb-prod-secret-key
    env: SECRET_KEY
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. config.py:68: JWT signing key; validate_production refuses the default and anything under 32 chars (:1020)."
  - name: kb-prod-data-encryption-key
    env: DATA_ENCRYPTION_KEY
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. config.py:71: encrypts connector tokens and the workspace LLM key at rest; MUST differ from SECRET_KEY, min 32 chars (:1026). Rotating it needs PREVIOUS_DATA_ENCRYPTION_KEYS (not mapped)."
  - name: kb-prod-gemini-api-key
    env: GEMINI_API_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: opaque string from Google AI Studio
    rule: "config.py:145. Owner supplies it. PROD key gets its OWN spend limit (separation plan option A), never the dev key."
  - name: kb-prod-r2-access-key-id
    env: R2_ACCESS_KEY_ID
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 access key id (32 hex chars)
    rule: "R2 API token scoped to bucket qnsc-kb-prod-sources, object read+write (config.py:784)."
  - name: kb-prod-r2-secret-access-key
    env: R2_SECRET_ACCESS_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 secret access key (64 hex chars)
    rule: "Secret half of the same R2 token (config.py:785). Create the pair together; rotate both."
  - name: kb-prod-microsoft-client-secret
    env: MICROSOFT_CLIENT_SECRET
    class: third-party
    chart: secrets.env (api + worker)
    format: opaque string from Entra (client secret VALUE, not its id)
    rule: "Client secret of the 'KB Prod' sign-in + connector app created by infra#342 (client id in values/kb/prod.yaml). Lifetime <= 6 months. config.py:626."
  - name: kb-prod-db-app
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.db (api + worker)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. Also the CNPG managed role kb_app (platform/data/kb-prod/pg-kb.yaml); its DML grants come from the kb migration qnsc-kb-backend#364."
  - name: kb-prod-db-migrator
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbMigrator (migrator Job only) + the pg-kb ExternalSecret and the nightly dump
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role kb_migrator; owns the kb database and every table Alembic creates (no CREATEROLE)."
  - name: kb-prod-db-readonly
    env: "(none: the pg-kb dump only)"
    class: generated
    chart: "(not a chart value) the pg-kb-kb-readonly ExternalSecret in data-prod, read only by the pg-kb-dump CronJob"
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role kb_readonly: member of pg_read_all_data, BYPASSRLS (kb tables use RLS, gitops#305). The nightly pg_dump connects as it, never as the migrator owner."
  - name: kb-prod-redis-url
    env: REDIS_URL
    class: generated
    chart: secrets.env (api + worker)
    format: "redis://kb:<hex 48>@valkey-kb-prod.data-prod.svc:6379/1"
    template: "redis://kb:{pw}@valkey-kb-prod.data-prod.svc:6379/1"
    rule: "Built by the script from the template (hex password). The valkey-kb-prod ACL file and exporter password are DERIVED from this one value by the ExternalSecret in platform/data/kb-prod/valkey-kb.yaml; rotating it needs a restart of valkey-kb-prod. Index 1 is dev parity."
  - name: kb-prod-graph-cert
    env: "(file) AZURE_CLIENT_CERTIFICATE_PATH"
    class: generated-cert
    chart: secrets.workerOnly.graphCert (worker only, mounted as cert.pem)
    format: one combined PEM, private key then certificate
    rule: "Certificate credential of the 'KB Prod Service' Entra app (client id = MAIL_GRAPH_CLIENT_ID, infra#342); created in Key Vault, never in a file on disk."

# Optional variables deliberately NOT mapped (an ExternalSecret whose Key Vault secret is missing
# fails entirely, so each is added with the feature that needs it):
not_mapped:
  - { env: PREVIOUS_DATA_ENCRYPTION_KEYS, why: "only during a DATA_ENCRYPTION_KEY rotation (config.py:72)" }
  - { env: GOOGLE_CLIENT_SECRET, class: third-party, why: "optional Google connector (config.py:737)" }
  - { env: BOOTSTRAP_ADMIN_PASSWORD, why: "BOOTSTRAP_ADMIN_ENABLED=false in values; first admin is by the owner's sign-in" }
  # PLATFORM_ADMIN_EMAILS is rova-only (no roster in kb).
