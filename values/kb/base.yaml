# qnsc-kb
#
# ── LIKE-FOR-LIKE. This file mirrors qnsc-kb-backend/infra/live/prod/main.tf as
#    it runs today: same CPU, same memory, same architecture, same shape.
#
# Nothing here is optimised, deliberately. If qnsc-kb behaves differently after
# the move, the platform is the only thing that changed — which is the entire
# point of a migration step. Optimising at the same time means a regression could
# be either, and this is the product that is half of both environments.
#
# The optimisations were designed, costed and deferred — and the FIRST one is now
# DONE as part of the on-prem move (CUTOVER-2026-11 C2): clamav is split into the
# `platform` namespace (clamd.platform.svc), so the sidecars, their emptyDir
# volumes and the 2 GB per replica are gone from this file. Still deferred:
#   §4c   split the e5 model into an embedding service — makes scaling kb cheap
#   §15d  right-size from measured p50 rather than allocated ceilings

product: kb
size: m

services:
  api:
    kind: http
    expose: public
    port: 8000
    # "The api stays OFF Spot even after go-live: a Spot interruption is a dropped
    #  request and a broken response mid-answer." — infra/live/prod/main.tf
    image: { repo: ghcr.io/quynhonsemiconductor/kb-api }
    # 1 / 6Gi as allocated on ECS. WITHOUT the clamd sidecar the 6 Gi is now
    # loose — the ONNX session is ~1.5 GB resident — but like-for-like sizing is
    # a dev.yaml change measured on the new host, not a guess made during the move.
    resources: { cpu: 1, memory: 6Gi }
    # The ONNX session takes tens of seconds to load. Without a startupProbe the
    # liveness probe kills the pod mid-load, forever (§9j).
    startupPath: /livez
    # THE APP SERVES `/health/ready`, NOT `/readyz`. `src/api/main.py:793` mounts
    # the readiness handler there — it checks Postgres and Redis — and the chart's
    # default `/readyz` 404s, so the pod would never become Ready, the Service
    # would have no endpoints, and the tunnel would serve nothing.
    #
    # Found 2026-09-19 in the pre-apply audit; all three products had a version of
    # this, each with different paths. The ECS path never surfaced it because the
    # Dockerfile HEALTHCHECK already points at /health/live (Dockerfile:290).
    #
    # Liveness is not set here and cannot be: the chart hardcodes `/livez` (§9j)
    # and admission.yaml denies anything else — so the APP gained a `/livez` route
    # instead, which is also what makes `startupPath: /livez` above resolve.
    readinessPath: /health/ready
    replicas: 1   # fixed. It was a KEDA range 1..6; KEDA was dropped 2026-10-13 and the floor is kept
    slo:
      availability: 99.0
      latency: { p99: 2s }     # RAG answers are not 500 ms operations
    # MALWARE_SCANNER_HOST moves to dev.yaml — on-prem it is the platform
    # service (clamd.platform.svc), not a loopback sidecar.
  worker:
    kind: worker
    expose: none
    # "The worker takes Spot deliberately — Celery redelivers an interrupted task,
    #  so an interruption costs time rather than work." — same file.
    image: { repo: ghcr.io/quynhonsemiconductor/kb-worker }
    # 2048 / 6144 as allocated on ECS: the same model, plus beat, plus
    # PaddleOCR per scanned file. (clamav used to be a 1024 slice of this; the
    # sidecar is gone on-prem — dev.yaml carries the new sizing.)
    resources: { cpu: 2, memory: 6Gi }
    # NO `startupPath`, and this used to say `/livez`. It rendered a startupProbe
    # with an httpGet against port 8080 on a container that serves no HTTP at all —
    # `kind: worker` is `service: none`, and this worker is a Celery consumer.
    # Removed 2026-09-20 with the chart fix that gates probes on `$caps.service`;
    # a value that renders nothing is worse than no value, because it reads as
    # protection that is not there.
    #
    # The ONNX load it was meant to cover is unaffected: with no liveness probe,
    # nothing kills a worker that takes tens of seconds to load a model. What is
    # lost is rollout gating — the pod reports Ready before it is consuming — which
    # for a Celery queue is a delay, not a loss. See the comment in the chart's
    # deployment.yaml.
    # ── NOT SCALED, and this is a correctness constraint rather than a choice ──
    # Celery beat still rides inside this container:
    #   "max_count stays 1 while Celery beat rides in this task — two replicas
    #    would double every scheduled job. Splitting beat into its own service is
    #    the prerequisite for scaling the worker horizontally."
    # So the worker stays at one replica, exactly as today. When beat is split out
    # it becomes its own service with `singleton: true`, and only then does
    # a higher `replicas` belongs here.
    replicas: 1

  migrator:
    kind: job
    expose: none
    image: { repo: ghcr.io/quynhonsemiconductor/kb-migrator }
    resources: { cpu: 500m, memory: 1Gi }

data:
  # §5 — dedicated in PROD despite being size M: pgvector, a ~16 GiB working set,
  # and a workload shape unlike anything else in the estate. Dev is shared.
  postgres:
    mode: dedicated
    pooling: none
    extensions: [vector, pgcrypto]
