# Every Key Vault secret kb-dev reads (vault kv-qnsc-dev), machine-readable for the provisioning
# script. NOT a values file: nothing renders it. Names and rules only.
# Source of truth for the env names: qnsc-kb-backend src/core/config.py (line cited per entry).
#
# class: generated        -> platform/bootstrap/secrets.sh creates it from the rule below
#        third-party      -> issued by a vendor; the owner supplies it through the script's hidden prompt
#        generated-cert   -> key + certificate created for the Entra service app (identity lane)
# kv value shape: always a plain string, except graph-cert (one combined PEM).
vault: kv-qnsc-dev
secrets:
  - name: kb-dev-secret-key
    env: SECRET_KEY
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. config.py:68: JWT signing key; validate_production refuses the default and anything under 32 chars (:1020)."
  - name: kb-dev-data-encryption-key
    env: DATA_ENCRYPTION_KEY
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. config.py:71: encrypts connector tokens and the workspace LLM key at rest; MUST differ from SECRET_KEY, min 32 chars (:1026). Rotating it needs PREVIOUS_DATA_ENCRYPTION_KEYS (not mapped)."
  - name: kb-dev-gemini-api-key
    env: GEMINI_API_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: opaque string from Google AI Studio
    rule: "config.py:145. Owner supplies it."
  - name: kb-dev-r2-access-key-id
    env: R2_ACCESS_KEY_ID
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 access key id (32 hex chars)
    rule: "R2 API token scoped to bucket kb-dev-sources, object read+write (config.py:784)."
  - name: kb-dev-r2-secret-access-key
    env: R2_SECRET_ACCESS_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 secret access key (64 hex chars)
    rule: "Secret half of the same R2 token (config.py:785). Create the pair together."
  - name: kb-dev-microsoft-client-secret
    env: MICROSOFT_CLIENT_SECRET
    class: third-party
    chart: secrets.env (api + worker)
    format: opaque string from Entra (client secret VALUE, not its id)
    rule: "Client secret of the 'KB Dev' sign-in + connector app (client id is in values/kb/dev.yaml). Lifetime <= 6 months. config.py:626."
  - name: kb-dev-db-app
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.db (api + worker)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. Also the CNPG managed role kb_app password (platform/cnpg/pg-dev.yaml)."
  - name: kb-dev-db-migrator
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbMigrator (migrator Job only)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role kb_migrator (database owner)."
  - name: kb-dev-graph-cert
    env: "(file) AZURE_CLIENT_CERTIFICATE_PATH"
    class: generated-cert
    chart: secrets.workerOnly.graphCert (worker only, mounted as cert.pem)
    format: one combined PEM, private key then certificate
    rule: "Certificate credential of the 'KB Dev Service' Entra app (client id MAIL_GRAPH_CLIENT_ID); created in Key Vault, never in a file on disk."

# Optional variables deliberately NOT mapped (an ExternalSecret whose Key Vault secret is missing
# fails entirely, so each is added with the feature that needs it):
not_mapped:
  - { env: PREVIOUS_DATA_ENCRYPTION_KEYS, why: "only during a DATA_ENCRYPTION_KEY rotation (config.py:72)" }
  - { env: GOOGLE_CLIENT_SECRET, class: third-party, why: "optional Google connector (config.py:737)" }
  - { env: BOOTSTRAP_ADMIN_PASSWORD, why: "BOOTSTRAP_ADMIN_ENABLED=false in values; first admin is by the owner's sign-in" }
