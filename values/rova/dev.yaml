# §5b — dev turns things OFF. The chart has no dev/prod branch of its own; ArgoCD
# merges base.yaml with this file before Helm sees anything.
env: dev
size: s                      # 1 replica, no PDB, no topology spread
services:
  api:
    capacity: spot           # dev has no revenue to protect
    resources: { cpu: 100m, memory: 512Mi }
    scaling: null            # autoscaling OFF in dev — fixed 1 replica
  worker:
    resources: { cpu: 100m, memory: 256Mi }
    scaling: null
