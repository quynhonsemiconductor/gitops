# §5b — dev turns things OFF. The chart has no dev/prod branch of its own; ArgoCD
# merges base.yaml with this file before Helm sees anything.
#
# ── ON-PREM DEV (CUTOVER-2026-11 C3, the rova dev move) ──────────────────────
# This file carries the whole on-prem delta: CNPG (pg-dev), the shared dev
# Valkey, the same-origin host, the renamed R2 buckets, and the non-secret env
# the ECS task definition used to own (rova infra/modules/stack/main.tf,
# develop — transcribed, not invented). The SECRET half arrives
# one Key Vault secret per value (secrets.env below, kv-qnsc-dev §7.1): cookie/csrf
# and identity secrets, entra-client-secret, the R2 credentials — and the Graph certificate,
# which is NOT env at all: it is the worker-only mounted file wired at the
# bottom of this file.
env: dev
size: s                      # 1 replica, no PDB, no topology spread

# ── ONE `services:` KEY, AND THAT IS NOT A STYLE POINT ───────────────────────
# This file briefly had three. YAML keeps only the LAST mapping for a duplicate key,
# so the earlier blocks — resources — vanish silently. Nothing
# warns: helm renders, lint passes, and the workload quietly runs on-demand with the
# chart's default resources. Everything for a service belongs in this one block.

# §5.6/§6.2 — the chart's per-namespace default-deny set is OFF on-prem; the one
# NetworkPolicy that matters (data-prod admits only rova-prod, restore-test,
# cnpg-system and platform on metrics ports) lives in gitops/platform.
networkPolicy:
  enabled: false

data:
  postgres:
    # §6.3 — pg-dev in data-dev: one cluster for all three dev products.
    # TLS verify-full: the server CA arrives as the rova-db-ca Secret (via the
    # cnpg-ca-dev store), the chart mounts it and exports DATABASE_SSL_CA; the
    # app connects to pg-dev-rw.data-dev.svc — a SAN on CNPG's server cert.
    # The EKS-era values pointed at the RDS endpoint with `auth: iam`; on-prem
    # the credential is a CNPG managed-role password (secrets.db / dbWorker / dbMigrator).
    mode: cnpg
    cluster: pg-dev
    namespace: data-dev
    auth: password
    pooling: none      # inherited intent from base; the on-prem decision too (§6.3)
    name: rova
    user: rova_app     # §6.3 — CNPG managed role <product>_app
    workerUser: rova_worker   # worker logs in as its own role (password: secrets.dbWorker)
    # migratorUser needs NO override: chart 0.12.1 defaults the migrator role to
    # <product>_migrator (rova_migrator), exactly §6.3's pairing.
    caFile: /etc/qnsc/db-ca/ca.crt

services:
  # §5.7 dev sizing: api 100m / 768 Mi, worker 50m / 480 Mi, heap flags at the
  # prod values (512 / 256) for parity.
  api:
    resources: { cpu: 100m, memory: 768Mi }
    env:
      - { name: PORT, value: "3000" }
      - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
      # pg-dev runs max_connections=100 shared across all dev products; 10 per
      # service leaves headroom for kb's pool, the migrators and managed roles.
      - { name: DATABASE_POOL_MAX, value: "10" }

  worker:
    resources: { cpu: 50m, memory: 480Mi }
    env:
      - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
      - { name: DATABASE_POOL_MAX, value: "10" }

# ── Product-wide, because api AND worker share one env validator ─────────────
# Entra is the case that forced this shape: supplying the tenant/client id to the
# api alone left the worker crash-looping on ENTRA_TENANT_ID. Non-secret values
# only — anything a leak would enable lives in Key Vault (secrets.env).
defaults:
  env:
    - { name: NODE_ENV, value: "production" }
    - { name: DEPLOYMENT_ENV, value: "dev" }
    # §6.4 — the shared dev cache. rova keeps database index 0 and no explicit
    # /0 suffix (the schema default appends nothing; parity with the ECS env).
    # Plain redis:// — the on-prem Valkey has no TLS, unlike rediss:// ElastiCache.
    - { name: REDIS_URL, value: "redis://valkey-dev.data-dev.svc:6379" }
    - { name: OTEL_ENABLED, value: "true" }
    # §8.2 — SAME-ORIGIN: one hostname per app. The SPA (Workers static assets)
    # and this API share rova-dev.qnsc.vn; the Tunnel routes /api/auth/*, /v1/*
    # and /readyz straight to the api Service. The EKS-era
    # rova-api-eks-dev.qnsc.vn parallel-name override and the
    # ENTRA_REDIRECT_URI value are GONE: identity v8 derives the redirect from
    # APP_BASE_URL (the v7 BFF value only existed for rollback), and the
    # *-api-* / *-eks-* DNS records are retired at the cutover (§8.2).
    - { name: APP_BASE_URL, value: "https://rova-dev.qnsc.vn" }
    - { name: CORS_ORIGINS, value: "https://rova-dev.qnsc.vn" }
    # Entra — public identifiers (§7.2), unchanged from the EKS-era file: ONE
    # tenant and ONE dev sign-in app for both estates.
    - { name: ENTRA_TENANT_ID, value: "dc0f2078-ac28-4ff2-b21a-d4b28df32361" }
    - { name: ENTRA_CLIENT_ID, value: "45fabceb-e51c-446b-894e-af4c4b7f30f8" }
    # B2B guest provisioning stays on in dev; JIT sign-up stays off.
    - { name: ENTRA_GUEST_INVITE_ENABLED, value: "true" }
    - { name: SSO_JIT_ENABLED, value: "false" }
    - { name: INTERNAL_EMAIL_DOMAINS, value: "qnsc.vn" }
    # §7.3 — Graph mail: the dev mailbox and the "Rova Dev Service" app. The
    # certificate is the worker-only FILE below, never an env var. MAIL_FROM_EMAIL
    # keeps the ECS value (module default noreply@qnsc.vn).
    - { name: EMAIL_PROVIDER, value: "graph" }
    - { name: MAIL_FROM_EMAIL, value: "noreply@qnsc.vn" }
    - { name: MAIL_GRAPH_SENDER, value: "noreply-rova-dev@qnsc.vn" }
    - { name: MAIL_GRAPH_CLIENT_ID, value: "ba917ac2-3580-43ef-a8c1-c8cb6288651a" }
    # §6.5 — the renamed dev buckets (rova-develop-* → rova-dev-*; created and
    # seeded in the same cutover apply, old bucket read-only for two weeks). R2
    # credentials are NOT here — they are secrets.env (rova-dev-storage-*).
    - { name: S3_ATTACHMENTS_BUCKET, value: "rova-dev-attachments" }
    - { name: S3_PUBLIC_ASSETS_BUCKET, value: "rova-dev-public-assets" }
    - { name: STORAGE_ENDPOINT, value: "https://69e52835cf2d08edde5b6ebd741d30fa.r2.cloudflarestorage.com" }
    - { name: STORAGE_FORCE_PATH_STYLE, value: "true" }
    # The public-assets custom domain moves to the new bucket in the same
    # live/edge apply (§6.5); it is a CDN base URL, not a credential.
    - { name: CDN_PUBLIC_ASSETS_BASE_URL, value: "https://rova-assets-dev.qnsc.vn" }

# ── ON-PREM SECRET SHAPE (chart 0.14.0, ONPREM-PLAN §5.6) ────────────────────
# Setting clusterSecretStore selects the on-prem shape (no per-namespace AWS
# SecretStore). ONE Key Vault secret PER VALUE, listed with its class and
# generation rule in values/rova/dev.secrets.yaml:
#   rova-env      <- secrets.env        every service (shared signing + third-party secrets)
#   rova-env-api  <- secrets.envApiOnly api only (BETTER_AUTH_SECRET: the worker never signs anyone in)
#   rova-db-app / rova-db-worker / rova-migrator <- the DB role passwords (not duplicated here)
# plus the CA hop (<product>-db-ca, cnpg-ca-dev). The deprecated JSON secrets.bundle
# (rova-dev-app) is gone. Non-secret config stays in defaults.env above.
secrets:
  clusterSecretStore: kv-qnsc-dev
  env:
    # api AND worker validate the same schema; these three are required in it
    # (rova libs/platform/src/config/env.schema.ts:106, :110, :324).
    COOKIE_SECRET: rova-dev-cookie-secret
    CSRF_SECRET: rova-dev-csrf-secret
    ENTRA_CLIENT_SECRET: rova-dev-entra-client-secret
    # R2 S3 credentials (env.schema.ts:208-209);
    # STORAGE_PUBLIC_* stay unset: the public bucket reuses this credential.
    STORAGE_ACCESS_KEY_ID: rova-dev-storage-access-key-id
    STORAGE_SECRET_ACCESS_KEY: rova-dev-storage-secret-access-key
  envApiOnly:
    BETTER_AUTH_SECRET: rova-dev-better-auth-secret   # env.schema.ts:92-95 "API ONLY"
    # Required at API boot when NODE_ENV=production (rova apps/api/src/bootstrap/platform-admin-emails.ts:11-17).
    # A staff email roster: kept in Key Vault, not here (public-repo identifier policy). API only.
    PLATFORM_ADMIN_EMAILS: rova-dev-platform-admin-emails
  db: rova-dev-db-app
  dbMigrator: rova-dev-db-migrator
  dbWorker: rova-dev-db-worker
  # §7.1/§7.3 — the Service app certificate (one combined PEM), mounted as a
  # FILE into the worker only, read through AZURE_CLIENT_CERTIFICATE_PATH (it
  # also carries the guest-invite User.Invite.All credential — same app).
  workerOnly:
    graphCert: rova-dev-graph-cert
    path: /etc/qnsc/graph/cert.pem
