# §5b — dev turns things OFF. The chart has no dev/prod branch of its own; ArgoCD
# merges base.yaml with this file before Helm sees anything.
env: dev
size: s                      # 1 replica, no PDB, no topology spread
services:
  api:
    capacity: spot           # dev has no revenue to protect
    resources: { cpu: 100m, memory: 512Mi }
    scaling: null            # autoscaling OFF in dev — fixed 1 replica
  worker:
    resources: { cpu: 100m, memory: 256Mi }
    scaling: null

# The data tier's endpoint. An endpoint is NOT a credential, which is the whole
# reason `auth: iam` needs no secret: there is nothing here worth protecting, and
# the token that is worth protecting never exists at rest.
# Source: `tofu output -raw postgres_endpoint` in infra/live/data-dev.
data:
  postgres:
    host: qnsc-shared-dev.cdu0osqeojxv.ap-southeast-1.rds.amazonaws.com

# ── A PARALLEL HOSTNAME FOR THE DURATION OF THE MIGRATION ────────────────────
#
# The canonical API hostname is `rova-api-dev.qnsc.vn`, and it is POINTED AT THE ECS
# TUNNEL right now, serving the dev environment people are using. Claiming it here
# would cut dev over silently, as a side effect of a deploy, with no rehearsal — the
# opposite of the parallel-estate strategy this whole migration is built on.
#
# So the new estate proves itself on its own name. Cutover is then one DNS record
# repointed at the new tunnel, reversible by repointing it back, and DELETING THESE
# THREE LINES — after which the helper's default (`rova-api-dev.qnsc.vn`) applies.
services:
  api:
    host: rova-api-eks-dev.qnsc.vn

