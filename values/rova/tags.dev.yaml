# Image tags. CI rewrites these on every build; `sha-0000000` was the placeholder
# and it is not a valid tag — the format is `sha-<FULL 40-character sha>`, which is
# what the registry holds (GHCR from Stage 0 — H-D22). CI writes `tag: sha-<12>`; from Stage 0.2 it writes `digest: sha256:<64>` and the chart pins that. A short sha pulls nothing and the pods sit in
# ImagePullBackOff.
# This one is the merge commit of rova#639, so the image contains BOTH the IAM database
# auth and the migrator's own IAM path — without the second, the migrator Job fails on
# a DATABASE_PASSWORD an rds_iam role does not have.
#
# NOTE THE LENGTH: the Kubernetes pipeline tags `sha-<12>` while the ECS pipeline tags
# `sha-<40>`. Same commit, two different tags, in the same repositories.
# GENERATED — DO NOT EDIT BY HAND.
#
# CI writes this file on every deploy, and it is separate from dev.yaml for one
# reason: `yq -i` REWRITES a whole file, and these values files carry reasoning
# transcribed from the live OpenTofu — why qnsc-kb's api stays off Spot, why
# clamav needs 2 GB, why the worker is pinned at one replica. A tag bump must not
# be able to reflow or drop any of it.
#
# So the machine owns this file and humans own the others. It also makes a
# promotion pull request a three-line diff instead of a diff against a file full
# of prose (§11).
services:
  api:
    image:
      tag: sha-e293d3bd43b2
      digest: sha256:38ecc4cd4daf0534da15f2236ba576c8bcb3ec9aeb09c210dd5c49d4eee2234d
  migrator:
    image:
      tag: sha-e293d3bd43b2
      digest: sha256:58b0dcab056e948b9dbcbfd47bf46577f19d6ee05e1f438f75c02f99e8fa3d74
  worker:
    image:
      tag: sha-e293d3bd43b2
      digest: sha256:323cec11780d13b9cb44322ad792aa76b54df62e1491649148b63cb73806865f
