# Every Key Vault secret rova-prod reads (vault kv-qnsc-prod), machine-readable for the
# provisioning script. NOT a values file: nothing renders it. Names and rules only.
# Source of truth for the classes: rova libs/platform/src/config/env.schema.ts (cited per entry).
#
# class: generated        -> the script creates it from the rule below
#        third-party      -> issued by a vendor; the owner supplies it through stdin
#        owner-provided   -> a value only the owner knows (not generated, not vendor-issued)
#        generated-cert   -> key + certificate created for the Entra service app
# kv value shape: always a plain string (no JSON), except graph-cert (one combined PEM).
vault: kv-qnsc-prod
secrets:
  - name: rova-prod-cookie-secret
    env: COOKIE_SECRET
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. Schema: string min 32 chars (env.schema.ts:106). Own value: not the CSRF or Better Auth secret. Rotating signs out every cookie."
  - name: rova-prod-csrf-secret
    env: CSRF_SECRET
    class: generated
    chart: secrets.env (api + worker)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. Schema: string min 32 chars (env.schema.ts:110). HMAC key binding a CSRF token to its session; distinct from COOKIE_SECRET."
  - name: rova-prod-better-auth-secret
    env: BETTER_AUTH_SECRET
    class: generated
    chart: secrets.envApiOnly (api only)
    format: base64, 64 chars
    rule: "openssl rand -base64 48 (strip the newline). Schema: string min 32 chars (env.schema.ts:95). Signs identity cookies and encrypts what it stores; API only (env.schema.ts:92). Rotating signs everyone out."
  - name: rova-prod-platform-admin-emails
    env: PLATFORM_ADMIN_EMAILS
    class: owner-provided
    chart: secrets.envApiOnly (api only)
    format: comma-separated emails
    rule: "Supplied by the owner (not generated). Required at API boot when NODE_ENV=production (rova apps/api/src/bootstrap/platform-admin-emails.ts:11-17). Kept in Key Vault, not in values: identifier policy, public repo (staff email roster)."
  - name: rova-prod-entra-client-secret
    env: ENTRA_CLIENT_SECRET
    class: third-party
    chart: secrets.env (api + worker)
    format: opaque string from Entra (client secret VALUE, not its id)
    rule: "Client secret of the sign-in app 'Rova Prod' (client id: values/rova/prod.yaml, a placeholder until the owner supplies it). Delegated sign-in only. Lifetime <= 6 months (ONPREM-PLAN 7.5). Schema: min 1 (env.schema.ts:324)."
  - name: rova-prod-storage-access-key-id
    env: STORAGE_ACCESS_KEY_ID
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 access key id (32 hex chars)
    rule: "R2 API token scoped to rova-prod-attachments and rova-prod-public-assets, object read+write (env.schema.ts:208). The public bucket reuses it (STORAGE_PUBLIC_* unset)."
  - name: rova-prod-storage-secret-access-key
    env: STORAGE_SECRET_ACCESS_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: Cloudflare R2 S3 secret access key (64 hex chars)
    rule: "Secret half of the same R2 token (env.schema.ts:209). Create the pair together; rotate both."
  - name: rova-prod-db-app
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.db (api; worker too unless dbWorker)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. Also the CNPG managed role rova_app password (platform/cnpg/pg-rova.yaml)."
  - name: rova-prod-db-worker
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbWorker (worker only)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role rova_worker."
  - name: rova-prod-db-migrator
    env: DATABASE_PASSWORD
    class: generated
    chart: secrets.dbMigrator (migrator Job only)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role rova_migrator (database owner)."
  - name: rova-prod-github-app-private-key
    env: GITHUB_APP_PRIVATE_KEY
    class: third-party
    chart: secrets.env (api + worker)
    format: multi-line PEM (PKCS#1 "RSA PRIVATE KEY" as GitHub issues it, or PKCS#8); newlines kept
    rule: "The GitHub App's private key, carried over from AWS (it cannot be reissued without a new key in the App settings). secrets.sh reads it from a FILE path, validates it with openssl and stores it through stdin; it never prints it. Pairs with GITHUB_APP_ID in values/rova/prod.yaml."
  - name: rova-prod-redis-url
    env: REDIS_URL
    class: generated
    chart: secrets.env (api + worker)
    format: "redis://rova:<hex 48>@valkey-rova.data-prod.svc:6379"
    rule: "Built by the script: 'redis://rova:' + openssl rand -hex 24 + '@valkey-rova.data-prod.svc:6379'. Schema: URL (env.schema.ts:78). The valkey-rova ACL file and exporter password are DERIVED from this one value by the ExternalSecret valkey-rova-acl (platform/valkey/valkey-rova.yaml); rotating it needs a valkey-rova restart."
  - name: rova-prod-db-readonly
    env: "(none: not read by the app)"
    class: generated
    chart: not mapped; read only by the pg-rova ExternalSecret (platform/cnpg/pg-rova.yaml)
    format: hex, 48 chars
    rule: "openssl rand -hex 24. CNPG managed role rova_readonly (pg_read_all_data), for the owner's ad-hoc queries."
  - name: rova-prod-github-webhook-secret
    env: GITHUB_WEBHOOK_SECRET
    class: generated
    chart: secrets.envApiOnly (api only)
    format: hex, 64 chars
    rule: "openssl rand -hex 32. HMAC for X-Hub-Signature-256 (env.schema.ts:120). The same value goes into the GitHub App / webhook settings (owner). Without it POST /v1/scm/webhook answers 503."
  - name: rova-prod-graph-cert
    env: "(file) AZURE_CLIENT_CERTIFICATE_PATH"
    class: generated-cert
    chart: secrets.workerOnly.graphCert (worker only, mounted as cert.pem)
    format: one combined PEM, private key (PKCS#8) then certificate
    rule: "Certificate credential of the 'Rova Prod Service' Entra app (client id MAIL_GRAPH_CLIENT_ID); public half committed in infra live/identity. Created in Key Vault, never in a file on disk."

# Optional variables deliberately NOT mapped (an ExternalSecret whose Key Vault secret is
# missing fails entirely, so each is added with the feature that needs it):
not_mapped:
  - { env: EDGE_CLIENT_IP_SECRET, why: "optional (env.schema.ts:333); the Pages Function that signed the client IP is retired by the same-origin tunnel route (ONPREM-PLAN 8.2), generated + shared with the edge if it returns" }
  - { env: STORAGE_PUBLIC_ACCESS_KEY_ID, why: "set together with STORAGE_PUBLIC_SECRET_ACCESS_KEY or not at all (:226); unset = reuse the primary credential" }
