# rova — measured from rova/infra/live/prod/main.tf on 2026-09-15.
# Size L means an outage costs revenue, NOT that the product is big: rova is the
# smallest workload in the estate (§5).
product: rova
size: l

# No `web:` block yet: rova pins qnsc-service 0.15.x, whose values schema rejects
# unknown keys (ArgoCD ComparisonError on rova-dev and rova-prod after #163).
# The block comes back in the PR that moves rova to chart >= 0.18.0.

services:
  api:
    kind: http
    expose: public
    port: 3000
    # THE APP SERVES `/v1/readyz`, NOT `/readyz`. `app.setGlobalPrefix('v1')` in
    # apps/api/src/bootstrap/app.bootstrap.ts:120 puts every route behind /v1,
    # the health controller included. The chart's default readinessPath is
    # `/readyz`, which 404s — the pod would never become Ready, the Service would
    # have no endpoints, and the tunnel would serve nothing.
    #
    # Found 2026-09-19 in the pre-apply audit. The ECS path never surfaced it:
    # the ALB target group and the Dockerfile HEALTHCHECK both already point at
    # /v1/healthz (rova/Dockerfile:143). The chart was the only consumer guessing.
    #
    # ⚠ LIVENESS IS STILL BROKEN AND CANNOT BE FIXED HERE. The chart hardcodes
    # liveness to `/livez` — not a per-service value, deliberately (§9j) — and
    # platform/policy/admission.yaml DENIES any other path. rova serves no
    # `/livez` at all, so the api CrashLoopBackOffs until the app exposes one.
    readinessPath: /v1/readyz
    # "The api stays OFF Spot even after go-live: a Spot interruption is a dropped
    # request and a broken response mid-answer." — rova/infra/live/prod/main.tf
    # On Kubernetes a PDB plus drain plus multiple replicas makes a reclaim a
    # rescheduling event, so `mixed` keeps one on-demand replica rather than a
    # whole on-demand pool (§15).
    image: { repo: ghcr.io/quynhonsemiconductor/rova-api }
    resources: { cpu: 250m, memory: 1Gi }
    replicas: 2   # fixed. It was a KEDA range 2..10; KEDA was dropped 2026-10-13 and the floor is kept
    slo:
      availability: 99.5
      latency: { p99: 500ms }

  worker:
    kind: worker
    expose: none
    # "The worker takes Spot deliberately — Celery redelivers an interrupted task,
    # so an interruption costs time rather than work." — same file.
    image: { repo: ghcr.io/quynhonsemiconductor/rova-worker }
    resources: { cpu: 250m, memory: 512Mi }
    replicas: 1   # fixed. It was a KEDA range 1..6; KEDA was dropped 2026-10-13 and the floor is kept
  migrator:
    kind: job
    expose: none
    image: { repo: ghcr.io/quynhonsemiconductor/rova-migrator }
    resources: { cpu: 250m, memory: 512Mi }

data:
  postgres:
    mode: dedicated
    # No pooler (§6.3): the connection goes straight to the CNPG -rw Service. The count of
    # connections is bounded by DATABASE_POOL_MAX per pod and the role's CONNECTION LIMIT.
    pooling: none
    # `password` is the only mode: a CNPG managed-role password synced from Key Vault.
    auth: password
    name: rova
    user: rova
