suite: network policy egress (cluster CIDRs)
# `0.0.0.0/0 except IMDS` matches every pod and Service IP in the cluster, so default-deny
# egress did not stop a product reaching other namespaces. The cluster CIDRs are excluded
# and the product's own data namespace is allowed by name.
templates:
  - templates/networkpolicy.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/dev.yaml
  - ../../../values/rova/tags.dev.yaml
set:
  networkPolicy.enabled: true
  # the chart default; the dev values override it with the RFC1918 ranges too (rova_dev_values_test.yaml)
  networkPolicy.clusterCidrs: [10.42.0.0/16, 10.43.0.0/16]

tests:
  - it: excludes IMDS and the k3s pod and Service CIDRs from the internet egress rule
    documentSelector: { path: metadata.name, value: allow-egress-external }
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock
          value:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32, 10.42.0.0/16, 10.43.0.0/16]

  - it: the excluded CIDRs are configurable
    set:
      networkPolicy.clusterCidrs: [192.168.0.0/16]
    documentSelector: { path: metadata.name, value: allow-egress-external }
    asserts:
      - equal:
          path: spec.egress[0].to[0].ipBlock.except
          value: [169.254.169.254/32, 192.168.0.0/16]

  - it: allows egress to the product's own Postgres and Valkey pods only (cnpg mode)
    documentSelector: { path: metadata.name, value: allow-egress-data }
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [web] }
      - equal:
          path: spec.egress
          value:
            - to:
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: data-dev }
                  podSelector:
                    matchLabels: { cnpg.io/cluster: pg-dev }
              ports:
                - { protocol: TCP, port: 5432 }
            - to:
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: data-dev }
                  podSelector:
                    matchLabels: { app.kubernetes.io/instance: valkey-dev }
              ports:
                - { protocol: TCP, port: 6379 }

  - it: scopes the platform and internet egress allows to non-web workloads
    set:
      web.enabled: true
      web.image:
        repo: ghcr.io/quynhonsemiconductor/rova-web
        tag: sha-7c36d2ef8e8f
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [web] }
        documentSelector: { path: metadata.name, value: allow-egress-platform }
      - equal:
          path: spec.podSelector
          value:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: NotIn, values: [web] }
        documentSelector: { path: metadata.name, value: allow-egress-external }

  - it: renders no data-egress policy outside cnpg mode
    values:
      - ../../../values/rova/base.yaml
      - ../../../values/rova/tags.prod.yaml
    set:
      env: prod
      networkPolicy.enabled: true
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          # default-deny, dns, platform, external, allow-ingress-api: no allow-egress-data outside
          # cnpg mode, and no web policies — rova's base.yaml keeps the SPA off for prod, which
          # still serves it from the Worker.
          count: 5
