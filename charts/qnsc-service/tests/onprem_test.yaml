suite: onprem profile
# The on-prem pieces (ONPREM-PLAN §5.6) are: the networkPolicy gate, the two
# on-prem mounts (CNPG CA, worker-only Graph PEM) on Deployments AND the
# migrator Job — a Job that cannot find the database or verify its TLS fails
# the PreSync hook and stops the sync, which is the one failure that blocks a
# release.
templates:
  - templates/networkpolicy.yaml
  - templates/deployment.yaml
  - templates/job.yaml
  - templates/externalsecret.yaml
  - templates/serviceaccount.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/dev.yaml
  - ../../../values/rova/tags.dev.yaml

tests:
  # ── networkPolicy.enabled ───────────────────────────────────────────────────
  - it: renders the default-deny set by default (EKS behaviour unchanged)
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 5        # default-deny, allow-dns, allow-egress-platform, allow-egress-external, + the dev allow-ingress-api (rova dev exposes the api to the cluster)

  - it: renders NO NetworkPolicy when networkPolicy.enabled is false
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── mode: cnpg on the migrator Job (§6.3) ───────────────────────────────────
  - it: points the migrator at the cluster's -rw Service with the CA mounted
    template: templates/job.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_HOST
            value: pg-rova-rw.data-prod.svc
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_SSL_CA
            value: /etc/qnsc/db-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: db-ca
            mountPath: /etc/qnsc/db-ca/ca.crt
            subPath: ca.crt
            readOnly: true

  # ── mode: cnpg (§6.3) ───────────────────────────────────────────────────────
  - it: points DATABASE_HOST at the cluster's -rw Service and exports DATABASE_SSL_CA
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_HOST
            value: pg-rova-rw.data-prod.svc
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_SSL_CA
            value: /etc/qnsc/db-ca/ca.crt
      - contains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: db-ca
            secret:
              secretName: rova-db-ca
              items:
                - { key: ca.crt, path: ca.crt }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: db-ca
            mountPath: /etc/qnsc/db-ca/ca.crt
            subPath: ca.crt
            readOnly: true

  # ── CA: static, no rotation loop (§6.3, 2026-10-23) ─────────────────────────
  - it: does NOT annotate the Deployment for Reloader (the CA is static now)
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
    asserts:
      - notExists:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]

  - it: renders the product db-ca ExternalSecret from the cnpg-ca store
    # The CA is static; this ExternalSecret mirrors pg-rova-ca-pub (ca.crt
    # only) with a 12 h refresh. Document 3: the AWS-era SecretStore and
    # the two app/migrator ExternalSecrets render before it.
    template: templates/externalsecret.yaml
    documentIndex: 3
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: cnpg-ca-dev   # the suite renders rova DEV
      - equal:
          path: spec.target.name
          value: rova-db-ca
      - equal:
          path: spec.data[0].remoteRef.key
          value: pg-rova-ca-pub
      - equal:
          path: spec.data[0].remoteRef.property
          value: ca.crt

  - it: adds NO db-ca document without a CA file
    # Without caFile the template renders the three AWS-era documents (store,
    # app secret, migrator secret) and nothing else.
    template: templates/externalsecret.yaml
    asserts:
      - hasDocuments:
          count: 3

  # ── secrets.workerOnly (§7.1/§7.3) ──────────────────────────────────────────
  - it: mounts the Graph PEM into the worker and exports the path
    template: templates/deployment.yaml
    documentIndex: 1        # rova's second Deployment is the worker
    set:
      secrets.workerOnly:
        graphCert: rova-dev-graph-cert
        path: /etc/qnsc/graph/cert.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH
            value: /etc/qnsc/graph/cert.pem
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: graph-cert
            mountPath: /etc/qnsc/graph/cert.pem
            subPath: cert.pem
            readOnly: true

  - it: exports NO certificate path on the api
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      secrets.workerOnly:
        graphCert: rova-dev-graph-cert
        path: /etc/qnsc/graph/cert.pem
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH

  - it: renders nothing when secrets.workerOnly.graphCert is unset
    template: templates/deployment.yaml
    documentIndex: 1
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: graph-cert

  # ── PreSync prerequisites of the migrator Job ───────────────────────────────
  - it: only the migrator ServiceAccount is a PreSync hook (wave -1, BeforeHookCreation)
    template: templates/serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: migrator
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation

  - it: the api ServiceAccount is a normal resource (a hook would recreate it and invalidate running pods' tokens)
    template: templates/serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: api
    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]

  - it: the migrator ExternalSecret and its own db-ca copy are PreSync wave -1; shared db-ca and SecretStore are not hooks
    template: templates/externalsecret.yaml
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
        documentSelector:
          path: metadata.name
          value: rova-migrator
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
        documentSelector:
          path: metadata.name
          value: rova-migrator-db-ca
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
        documentSelector:
          path: metadata.name
          value: rova-db-ca
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
        documentSelector:
          path: metadata.name
          value: rova
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
        documentSelector:
          path: metadata.name
          value: rova-app
