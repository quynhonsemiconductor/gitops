suite: onprem profile
# The on-prem pieces (ONPREM-PLAN §5.6) are: the networkPolicy gate, the two
# on-prem mounts (CNPG CA, worker-only Graph PEM) on Deployments AND the
# migrator Job — a Job that cannot find the database or verify its TLS fails
# the PreSync hook and stops the sync, which is the one failure that blocks a
# release.
templates:
  - templates/networkpolicy.yaml
  - templates/deployment.yaml
  - templates/job.yaml
  - templates/externalsecret.yaml
  - templates/serviceaccount.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/dev.yaml
  - ../../../values/rova/tags.dev.yaml
  - fixtures/rova-bundle-shape.yaml

tests:
  # ── networkPolicy.enabled ───────────────────────────────────────────────────
  - it: renders the default-deny set by default (EKS behaviour unchanged)
    # rova's dev values now set networkPolicy.enabled: false (the on-prem
    # decision), so the DEFAULT is asserted explicitly rather than inherited
    # from the fixture.
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 5        # default-deny, allow-dns, allow-egress-platform, allow-egress-external, + the dev allow-ingress-api (rova dev exposes the api to the cluster)

  - it: renders NO NetworkPolicy when networkPolicy.enabled is false
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # ── mode: cnpg on the migrator Job (§6.3) ───────────────────────────────────
  - it: points the migrator at the cluster's -rw Service with the CA mounted
    template: templates/job.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_HOST
            value: pg-rova-rw.data-prod.svc
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_SSL_CA
            value: /etc/qnsc/db-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: db-ca
            mountPath: /etc/qnsc/db-ca/ca.crt
            subPath: ca.crt
            readOnly: true

  # ── mode: cnpg (§6.3) ───────────────────────────────────────────────────────
  - it: points DATABASE_HOST at the cluster's -rw Service and exports DATABASE_SSL_CA
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_HOST
            value: pg-rova-rw.data-prod.svc
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_SSL_CA
            value: /etc/qnsc/db-ca/ca.crt
      - contains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: db-ca
            secret:
              secretName: rova-db-ca
              items:
                - { key: ca.crt, path: ca.crt }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: db-ca
            mountPath: /etc/qnsc/db-ca/ca.crt
            subPath: ca.crt
            readOnly: true

  # ── CA: static, no rotation loop (§6.3, 2026-10-23) ─────────────────────────
  - it: does NOT annotate the Deployment for Reloader (the CA is static now)
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
    asserts:
      - notExists:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]

  # ── secrets.workerOnly (§7.1/§7.3) ──────────────────────────────────────────
  - it: mounts the Graph PEM into the worker and exports the path
    template: templates/deployment.yaml
    documentIndex: 1        # rova's second Deployment is the worker
    set:
      secrets.workerOnly:
        graphCert: rova-dev-graph-cert
        path: /etc/qnsc/graph/cert.pem
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH
            value: /etc/qnsc/graph/cert.pem
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          any: true
          content:
            name: graph-cert
            mountPath: /etc/qnsc/graph/cert.pem
            subPath: cert.pem
            readOnly: true

  - it: exports NO certificate path on the api
    template: templates/deployment.yaml
    documentIndex: 0
    set:
      secrets.workerOnly:
        graphCert: rova-dev-graph-cert
        path: /etc/qnsc/graph/cert.pem
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH

  - it: syncs the Graph cert Secret the worker mounts, from the ClusterSecretStore, as cert.pem
    # PLT-B4: nothing created this Secret, so the worker stayed in ContainerCreating.
    template: templates/externalsecret.yaml
    set:
      data.postgres.caFile: ""
    asserts:
      - equal:
          path: spec.secretStoreRef
          value: { name: kv-qnsc-dev, kind: ClusterSecretStore }
        documentSelector:
          path: metadata.name
          value: rova-dev-graph-cert
      - equal:
          path: spec.target.name
          value: rova-dev-graph-cert
        documentSelector:
          path: metadata.name
          value: rova-dev-graph-cert
      - equal:
          path: spec.data
          value: [{ secretKey: cert.pem, remoteRef: { key: rova-dev-graph-cert } }]
        documentSelector:
          path: metadata.name
          value: rova-dev-graph-cert

  - it: renders no Graph cert ExternalSecret when graphCert is unset
    template: templates/externalsecret.yaml
    set:
      data.postgres.caFile: ""
      secrets.workerOnly.graphCert: ""
    asserts:
      - hasDocuments:
          count: 4        # rova-app, rova-migrator, rova-db-app, rova-db-worker and nothing for the cert

  - it: renders nothing when secrets.workerOnly.graphCert is unset
    # Empty strings, because rova's dev values now wire the on-prem graph
    # certificate — this test wants the "not configured" branch explicitly.
    template: templates/deployment.yaml
    documentIndex: 1
    set:
      secrets.workerOnly.graphCert: ""
      secrets.workerOnly.path: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: AZURE_CLIENT_CERTIFICATE_PATH
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: graph-cert

  # ── PreSync prerequisites of the migrator Job ───────────────────────────────
  - it: only the migrator ServiceAccount is a PreSync hook (wave -1, BeforeHookCreation)
    template: templates/serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: migrator
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation

  - it: the api ServiceAccount is a normal resource (a hook would recreate it and invalidate running pods' tokens)
    template: templates/serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: api
    asserts:
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]

  # ── ExternalSecret shape (ONPREM-PLAN §5.6) ─────────────────────────────────
  - it: on-prem shape reads the ClusterSecretStore with extract, renders no SecretStore
    template: templates/externalsecret.yaml
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      data.postgres.caFile: ""   # the fixture carries the on-prem caFile; this test counts only the bundle ExternalSecrets
    asserts:
      - hasDocuments:
          count: 5          # rova-app + rova-migrator + rova-db-app + rova-db-worker + rova-dev-graph-cert (+ no SecretStore)
      - equal:
          path: spec.secretStoreRef
          value: { name: kv-qnsc-dev, kind: ClusterSecretStore }
        documentSelector:
          path: metadata.name
          value: rova-app
      - equal:
          path: spec.dataFrom
          value: [{ extract: { key: rova-dev-app } }]
        documentSelector:
          path: metadata.name
          value: rova-app
      # PLT-B3: the migrator reads ITS OWN password (db-migrator), never the app role's
      # (db-app). Mutation check: reverting remoteKey to secrets.db fails this and the next.
      - equal:
          path: spec.data
          value: [{ secretKey: DATABASE_PASSWORD, remoteRef: { key: rova-dev-db-migrator } }]
        documentSelector:
          path: metadata.name
          value: rova-migrator
      - equal:
          path: spec.data
          value: [{ secretKey: DATABASE_PASSWORD, remoteRef: { key: rova-dev-db-app } }]
        documentSelector:
          path: metadata.name
          value: rova-db-app
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/hook"]
        documentSelector:
          path: metadata.name
          value: rova-db-app
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PreSync
        documentSelector:
          path: metadata.name
          value: rova-migrator

  - it: derives the migrator DB user from the PRODUCT slug (§6.3), not from the app role's name
    # ONPREM-PLAN §6.3: managed roles are <product>_app and <product>_migrator.
    # The old derivation (<user>_migrator) made user=rova_app produce
    # rova_app_migrator — a role nobody created; same for opshub.
    template: templates/job.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova_app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_USER
            value: rova_migrator

  - it: honours data.postgres.migratorUser when a product's role naming differs
    template: templates/job.yaml
    documentIndex: 0
    set:
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-prod
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova_app
        migratorUser: rova-mig9
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: DATABASE_USER
            value: rova-mig9

  - it: renders a per-service bundle ExternalSecret from the named Key Vault key (on-prem)
    template: templates/externalsecret.yaml
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      secrets.serviceBundles:
        api: rova-dev-api
      data.postgres.caFile: ""   # the fixture carries the on-prem caFile; this test counts only bundle ExternalSecrets
    asserts:
      - equal:
          path: spec.secretStoreRef
          value: { name: kv-qnsc-dev, kind: ClusterSecretStore }
        documentSelector:
          path: metadata.name
          value: rova-api-bundle
      - equal:
          path: spec.dataFrom
          value:
            - extract: { key: rova-dev-api }
        documentSelector:
          path: metadata.name
          value: rova-api-bundle
      # count 4 IS the "no worker bundle, no SecretStore" assertion:
      # helm-unittest fails a documentSelector that matches nothing, so absence
      # of rova-worker-bundle can only be asserted through the count.
      # (rova-app, rova-migrator, rova-db-app, rova-db-worker, rova-dev-graph-cert, rova-api-bundle)
      - hasDocuments:
          count: 6

  - it: attaches the per-service bundle AFTER the shared one on its service only (later envFrom wins)
    template: templates/deployment.yaml
    documentIndex: 0        # the api
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      secrets.serviceBundles:
        api: rova-dev-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: { name: rova-app }
            - secretRef: { name: rova-api-bundle }
            - secretRef: { name: rova-db-app }

  - it: leaves a service with no bundle entry on the shared bundle alone
    template: templates/deployment.yaml
    documentIndex: 1        # the worker
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      secrets.serviceBundles:
        api: rova-dev-api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: { name: rova-app }
            - secretRef: { name: rova-db-worker }

  - it: gives the worker its own DB password and role when the product has a worker role
    template: templates/deployment.yaml
    documentIndex: 1        # the worker
    set:
      secrets.dbWorker: rova-dev-db-worker
      data.postgres.workerUser: rova_worker
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: { name: rova-app }
            - secretRef: { name: rova-db-worker }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: DATABASE_USER, value: rova_worker }

  - it: keeps the api on the app role even when a worker role is set
    template: templates/deployment.yaml
    documentIndex: 0        # the api
    set:
      secrets.dbWorker: rova-dev-db-worker
      data.postgres.workerUser: rova_worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: rova-db-app } }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: DATABASE_USER, value: rova_app }

  - it: renders a db-worker ExternalSecret only when secrets.dbWorker is set
    template: templates/externalsecret.yaml
    set:
      secrets.dbWorker: rova-dev-db-worker
      data.postgres.caFile: ""
    asserts:
      - equal:
          path: spec.data
          value: [{ secretKey: DATABASE_PASSWORD, remoteRef: { key: rova-dev-db-worker } }]
        documentSelector:
          path: metadata.name
          value: rova-db-worker

  - it: gives the migrator Job only the migrator Secret (not the app role's)
    template: templates/job.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: { name: rova-migrator, optional: true }

  - it: on-prem bundle/db overrides are honoured
    template: templates/externalsecret.yaml
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      secrets.bundle: custom-app
      secrets.db: custom-db
      secrets.dbMigrator: custom-mig
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: custom-app
        documentSelector:
          path: metadata.name
          value: rova-app
      - equal:
          path: spec.data[0].remoteRef.key
          value: custom-db
        documentSelector:
          path: metadata.name
          value: rova-db-app
      - equal:
          path: spec.data[0].remoteRef.key
          value: custom-mig
        documentSelector:
          path: metadata.name
          value: rova-migrator

  - it: on-prem CA copies read ca.crt of <cluster>-ca-pub from cnpg-ca-<env>, 12h, db-ca shared one not hooked
    template: templates/externalsecret.yaml
    set:
      secrets.clusterSecretStore: kv-qnsc-dev
      data.postgres:
        mode: cnpg
        cluster: pg-rova
        namespace: data-dev
        auth: password
        pooling: none
        caFile: /etc/qnsc/db-ca/ca.crt
        name: rova
        user: rova
    asserts:
      - equal:
          path: spec.secretStoreRef
          value: { name: cnpg-ca-dev, kind: ClusterSecretStore }
        documentSelector:
          path: metadata.name
          value: rova-migrator-db-ca
      - equal:
          path: spec.data[0].remoteRef
          value: { key: pg-rova-ca-pub, property: ca.crt }
        documentSelector:
          path: metadata.name
          value: rova-db-ca
      - equal:
          path: spec.refreshInterval
          value: 12h
        documentSelector:
          path: metadata.name
          value: rova-migrator-db-ca
