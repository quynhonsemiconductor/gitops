suite: per-value app secrets need the on-prem store
# No dev.yaml in the fixture, so there is no secrets.clusterSecretStore: the AWS shape.
templates:
  - templates/externalsecret.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/tags.dev.yaml

tests:
  - it: fails when secrets.env is used without a ClusterSecretStore
    set:
      env: dev
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
    asserts:
      - failedTemplate:
          errorPattern: "require secrets.clusterSecretStore"
