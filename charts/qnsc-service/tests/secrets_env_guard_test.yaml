suite: secrets need the ClusterSecretStore
# No dev.yaml in the fixture, so there is no secrets.clusterSecretStore. The chart renders no
# SecretStore of its own (the AWS shape is gone), so this must fail, at the schema.
templates:
  - templates/externalsecret.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/tags.dev.yaml

tests:
  - it: fails when secrets.clusterSecretStore is missing
    set:
      env: dev
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
    asserts:
      - failedTemplate:
          errorPattern: "clusterSecretStore"
