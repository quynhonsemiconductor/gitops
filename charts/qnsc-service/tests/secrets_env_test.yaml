suite: per-value app secrets (secrets.env)
# One Key Vault secret per value (chart 0.14.0). The fixture is rova dev, which still sets the
# deprecated secrets.bundle, so every test that uses env clears the bundle first.
templates:
  - templates/externalsecret.yaml
  - templates/deployment.yaml
  - templates/job.yaml
values:
  - ../../../values/rova/base.yaml
  - ../../../values/rova/dev.yaml
  - ../../../values/rova/tags.dev.yaml

tests:
  - it: renders ONE ExternalSecret <product>-env with a data entry per variable, sorted, and no -app bundle
    template: templates/externalsecret.yaml
    set:
      secrets.bundle: ""
      secrets.env:
        ENTRA_CLIENT_SECRET: rova-dev-entra-client-secret
        COOKIE_SECRET: rova-dev-cookie-secret
    asserts:
      - equal:
          path: spec.data
          value:
            - { secretKey: COOKIE_SECRET, remoteRef: { key: rova-dev-cookie-secret } }
            - { secretKey: ENTRA_CLIENT_SECRET, remoteRef: { key: rova-dev-entra-client-secret } }
        documentSelector: { path: metadata.name, value: rova-env }
      - equal:
          path: spec.secretStoreRef
          value: { name: kv-qnsc-dev, kind: ClusterSecretStore }
        documentSelector: { path: metadata.name, value: rova-env }
      - equal:
          path: spec.refreshInterval
          value: 1h
        documentSelector: { path: metadata.name, value: rova-env }
      - notExists:
          path: spec.dataFrom
        documentSelector: { path: metadata.name, value: rova-env }
      # rova-env + rova-migrator + rova-db-app + rova-db-ca + rova-migrator-db-ca + the graph cert:
      # no rova-app and no rova-env-api (envApiOnly unset).
      - hasDocuments:
          count: 6

  - it: renders <product>-env-api only for envApiOnly
    template: templates/externalsecret.yaml
    set:
      secrets.bundle: ""
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
      secrets.envApiOnly: { BETTER_AUTH_SECRET: rova-dev-better-auth-secret }
    asserts:
      - equal:
          path: spec.data
          value: [{ secretKey: BETTER_AUTH_SECRET, remoteRef: { key: rova-dev-better-auth-secret } }]
        documentSelector: { path: metadata.name, value: rova-env-api }

  - it: attaches -env to every service and -env-api to the api only, instead of the bundle
    template: templates/deployment.yaml
    documentIndex: 0        # the api
    set:
      secrets.bundle: ""
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
      secrets.envApiOnly: { BETTER_AUTH_SECRET: rova-dev-better-auth-secret }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value: { secretRef: { name: rova-env } }
      - equal:
          path: spec.template.spec.containers[0].envFrom[1]
          value: { secretRef: { name: rova-env-api } }
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: rova-app } }

  - it: keeps -env-api off the worker
    template: templates/deployment.yaml
    documentIndex: 1        # the worker
    set:
      secrets.bundle: ""
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
      secrets.envApiOnly: { BETTER_AUTH_SECRET: rova-dev-better-auth-secret }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: rova-env } }
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: rova-env-api } }

  - it: gives the migrator Job only its own Secret
    template: templates/job.yaml
    documentIndex: 0
    set:
      secrets.bundle: ""
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value: [{ secretRef: { name: rova-migrator, optional: true } }]

  - it: back-compat — with no secrets.env the deprecated bundle still renders and attaches
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0]
          value: { secretRef: { name: rova-app } }

  - it: fails when secrets.bundle is combined with secrets.env
    template: templates/externalsecret.yaml
    set:
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
    asserts:
      - failedTemplate:
          errorPattern: "secrets.bundle is deprecated and cannot be combined"

  - it: fails when a variable is in both secrets.env and secrets.envApiOnly
    template: templates/externalsecret.yaml
    set:
      secrets.bundle: ""
      secrets.env: { COOKIE_SECRET: rova-dev-cookie-secret }
      secrets.envApiOnly: { COOKIE_SECRET: rova-dev-cookie-secret }
    asserts:
      - failedTemplate:
          errorPattern: "COOKIE_SECRET is set in both"
