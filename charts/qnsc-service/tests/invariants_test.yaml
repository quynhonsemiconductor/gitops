suite: platform invariants
# Each test here guards a decision that was expensive to reach and would be cheap
# to undo by accident. The section reference is the argument; this file is the
# enforcement.
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/pdb.yaml
values:
  - ../../../values/rova/base.yaml
  # The image tag lives in a MACHINE-OWNED file: `yq -i` rewrites whatever it
  # touches, and the values files above carry reasoning transcribed from the live
  # OpenTofu. CI writes only this one.
  - ../../../values/rova/tags.prod.yaml
# base + tags + `env: prod` ONLY: the EKS-era shape these invariants were written for
# (what values/rova/prod.yaml used to contribute was exactly `env: prod`). The real
# on-prem prod values are asserted in rova_prod_values_test.yaml.
set:
  env: prod

tests:
  # ── §15d ────────────────────────────────────────────────────────────────────
  - it: renders NO cpu limit, ever
    # CFS quota throttles on 100 ms bursts rather than averages, so an IO-bound
    # service is throttled at 20% average CPU — and it presents as latency with no
    # OOMKill, no restart and no alarm. Every service in this estate is that shape.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: sets memory limit equal to memory request
    # Memory is not compressible. Bursting above the request only defers an
    # OOMKill to a worse moment and breaks the bin-packing the cost model assumes.
    # Equal values also give Guaranteed QoS, so these pods are evicted last.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi

  # ── §6.3 — CA: static 10-year, NO Reloader annotation (2026-10-23) ──────────
  - it: carries NO Reloader annotation without a CA file
    # The CA never rotates in place (provided-CA mode, plan §5.6), so no
    # controller restarts pods when a Secret changes — Reloader is gone. A
    # future CA swap is a planned maintenance-window change that rolls pods
    # explicitly.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: metadata.annotations

  # The PRESENT case (mode: cnpg + caFile set) is asserted in
  # tests/onprem_test.yaml, which renders the cnpg values this EKS-era suite
  # does not use.

  # ── §9j ─────────────────────────────────────────────────────────────────────
  - it: points liveness at a dependency-free endpoint
    # If liveness checks the database and the database slows down, Kubernetes
    # kills every replica of every service at once, and a slowdown becomes an
    # outage. The chart exposes readinessPath only; liveness is hardcoded.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez

  # ── §10 ─────────────────────────────────────────────────────────────────────
  - it: satisfies Pod Security Standards `restricted`
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  # ── §6.3 — CA: static 10-year, NO Reloader annotation (2026-10-23) ──────────
  - it: carries NO Reloader annotation without a CA file
    # The CA never rotates in place (provided-CA mode, plan §5.6), so no
    # controller restarts pods when a Secret changes — Reloader is gone. A
    # future CA swap is a planned maintenance-window change that rolls pods
    # explicitly.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - isNull:
          path: metadata.annotations

  # The PRESENT case (mode: cnpg + caFile set) is asserted in
  # tests/onprem_test.yaml, which renders the cnpg values this EKS-era suite
  # does not use.

  # ── §9j ─────────────────────────────────────────────────────────────────────
  - it: sets trafficDistribution on every Service
    # Cross-AZ traffic is $0.01/GB each way, grows with the square of service
    # count, and appears on no per-service line item. One field, and it lowers
    # latency too.
    template: templates/service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.trafficDistribution
          value: PreferClose

  # ── §4b Axis 7 (KEDA dropped 2026-10-13) ─────────────────────────────────────
  - it: always renders a fixed replica count
    # There is no autoscaler any more, so nothing else owns the field.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - isNotNull:
          path: spec.replicas

  # ── Found in review, 2026-09-16 ──────────────────────────────────────────────
  - it: attaches the product secret to every application container
    # This was MISSING. api and worker rendered with envFrom absent entirely:
    # PgBouncer got kb-app and the migrator Job got kb-migrator, but the
    # applications themselves got nothing — no DATABASE_URL, no REDIS_URL, no API
    # keys. They would have started and failed on the first line that read one,
    # and the ExternalSecret beside them would have looked perfectly healthy.
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: rova-app
