{{- /* §10 — "Namespaces are not isolation. Without this, seven products in one
       cluster share a fate."

       Default-deny first, then allow explicitly. These policies are namespace-wide
       and render once, not per service — a per-service default-deny would be six
       copies of the same rule with six chances to omit one.

       ONPREM: `networkPolicy.enabled: false` renders none of this. One node means
       the default-deny set buys little and costs an outage class (§5.6); the one
       policy that matters on-prem — `data-prod` admits rova-prod, restore-test,
       cnpg-system and `platform` on the metrics ports only — lives in
       gitops/platform, not here. */}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- /* DNS is exempt from default-deny or nothing resolves, and the failure looks
       like every dependency being down at once. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
{{- /* §4b — the `platform` namespace holds services every product consumes:
       clamd today, an embedding server later. This egress allow is the product
       half of `expose: cluster`. Rendering it from the chart is the point: written
       by hand, seven times, this exception is how default-deny quietly stops
       meaning anything. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-platform
spec:
  # The optional SPA (`web`) is a static file server: DNS is all it needs. Every
  # egress allow below is scoped to the product's other workloads (api, worker,
  # migrator, and any future Job/CronJob), so the web pod cannot reach `platform`,
  # the internet or the data namespace if it is compromised.
  podSelector:
    {{- include "qnsc.nonWebPodSelector" $ | nindent 4 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
---
{{- /* Egress to the internet (Graph, R2, GHCR) is allowed; INGRESS is not, and that is
       where the boundary actually sits (§3: the tunnel means there is no inbound
       surface at all).

       `0.0.0.0/0 except IMDS` ALSO matches every pod and Service address in the
       cluster, so on its own it let a product namespace reach every other namespace
       and default-deny egress stopped nothing. The cluster's pod and Service CIDRs
       (networkPolicy.clusterCidrs, the k3s defaults) are therefore excluded; what a
       product legitimately needs inside the cluster is allowed by name: DNS, the
       platform namespace, and its data namespace (next policy). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external
spec:
  podSelector:
    {{- include "qnsc.nonWebPodSelector" $ | nindent 4 }}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # IMDS — pods never use a node role
              {{- range .Values.networkPolicy.clusterCidrs }}
              - {{ . }}
              {{- end }}
{{- if eq (.Values.data.postgres.mode | default "none") "cnpg" }}
---
{{- /* The CIDR exclusion above also cut the way to the product's own data: Postgres
       (CNPG) and the cache, both in the namespace data.postgres.namespace
       (data-prod / data-dev). Each destination is selected by its OWN pod label
       and port — the CNPG cluster by `cnpg.io/cluster`, the Valkey instance by
       `app.kubernetes.io/instance` (data.cache.instance) — so 5432 opens to the
       product's database and 6379 to its cache, never a port to every pod in the
       namespace. The cache rule is omitted when the product has no cache. */}}
{{- $cacheInstance := "" }}
{{- with .Values.data.cache }}{{ $cacheInstance = .instance | default "" }}{{ end }}
{{- if and (not $cacheInstance) (eq (include "qnsc.redisConfigured" $) "true") }}
{{- fail "a Redis/Valkey URL is configured (REDIS_URL or VALKEY_URL) but data.cache.instance is unset: allow-egress-data would render no 6379 rule and the app could not reach its cache. Set data.cache.instance to the Valkey pod label (valkey-dev, valkey-rova, valkey-opshub, valkey-kb-dev)." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-data
spec:
  podSelector:
    {{- include "qnsc.nonWebPodSelector" $ | nindent 4 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.data.postgres.namespace | quote }} }
          podSelector:
            matchLabels: { cnpg.io/cluster: {{ .Values.data.postgres.cluster | quote }} }
      ports:
        - { protocol: TCP, port: 5432 }
    {{- with .Values.data.cache }}
    {{- with .instance }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Values.data.postgres.namespace | quote }} }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ . | quote }} }
      ports:
        - { protocol: TCP, port: 6379 }
    {{- end }}
    {{- end }}
{{- end }}
{{- range .Values.networkPolicy.egressNamespaces }}
---
{{- /* A product that calls a service in ANOTHER namespace (kb -> tei-e5 in `ai`) names it here.
       The CIDR exclusion above also cuts the way to that namespace's pods, so without an entry the
       call times out. By namespace and port, nothing else; the destination namespace still has to
       admit this one in ITS ingress policy (tei-e5-clients admits kb-dev/kb-prod). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-{{ .namespace }}
spec:
  podSelector:
    {{- include "qnsc.nonWebPodSelector" $ | nindent 4 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .namespace | quote }} }
      ports:
        {{- range .ports }}
        - { protocol: TCP, port: {{ . }} }
        {{- end }}
{{- end }}
{{- /* The optional SPA (`web`, templates/web*.yaml) is not in `services`, so the
       loop below cannot emit its ingress rule. Cloudflared lives in `platform`,
       and with default-deny on in dev an unlisted web pod is unreachable — the
       tunnel would answer 503 with the pod healthy. Same shape as an `expose:
       public` service, plus same-namespace traffic.

       EGRESS for web is `allow-dns` only: the SPA is a static file server and
       makes no server-side calls (the v0.4.x Caddyfile has no reverse_proxy or
       forward_auth; WEB_API_UPSTREAM was removed with chart 0.19.2). */}}
{{- if .Values.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-web
  labels:
    {{- include "qnsc.labels" (list $ "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qnsc.selectorLabels" (list $ "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
          # Only the tunnel connector, not every pod in `platform` (ArgoCD,
          # operators, ...). Both selectors are in ONE `from` entry, which
          # ANDs them; two entries would admit every pod in the namespace.
          podSelector:
            matchLabels: { app.kubernetes.io/name: cloudflared }
      ports:
        - { protocol: TCP, port: {{ .Values.web.port | default 8080 }} }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: {{ .Values.web.port | default 8080 }} }
{{- if .Values.web.apiUpstream }}
{{- /* rova's Caddyfile reverse-proxies /guide-assets/* to the api (the User
       Guide forward_auth gate), so THAT product's web pod needs DNS and the api
       pods on the POD port (a NetworkPolicy is evaluated after DNAT). Opt-in:
       web.apiUpstream false (opshub, kb) means the static server talks to
       nothing, and this policy does not render. */}}
{{- $apiPodPort := include "qnsc.podPort" (list $ "api") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-web
  labels:
    {{- include "qnsc.labels" (list $ "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qnsc.selectorLabels" (list $ "web") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "qnsc.selectorLabels" (list $ "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $apiPodPort }} }
{{- end }}
{{- end }}
{{- range $name, $_ := .Values.services }}
{{- $svc  := include "qnsc.svc"  (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind      | fromYaml }}
{{- if ne $caps.service "none" }}
{{- /* Policy ports are POD ports (after DNAT), never the Service port. */}}
{{- $podPort := include "qnsc.podPort" (list $ $name) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-{{ $name }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qnsc.selectorLabels" (list $ $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if has ($svc.expose | default "none") (list "public" "protected") }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
          # Only the tunnel connector, not every pod in `platform` (ArgoCD,
          # operators, Alloy, ...). Both selectors in ONE `from` entry AND
          # them; two entries would admit every pod in the namespace. Alloy
          # does not scrape the product API (no metrics annotations; the
          # k8s-monitoring values scrape KSM/node only), so no Alloy entry.
          podSelector:
            matchLabels: { app.kubernetes.io/name: cloudflared }
      ports:
        - { protocol: TCP, port: {{ $podPort }} }
    {{- end }}
    {{- if eq ($svc.expose | default "none") "cluster" }}
    {{- /* §4b — reachable from any PRODUCT namespace, never the internet. The
           label is what makes this expressible instead of hand-written. */}}
    - from:
        - namespaceSelector:
            matchLabels: { qnsc.vn/tenant: product }
      ports:
        - { protocol: TCP, port: {{ $podPort }} }
    {{- end }}
    - from:
        - podSelector: {}          # same namespace, service to service
      ports:
        - { protocol: TCP, port: {{ $podPort }} }
    {{- if and $.Values.web.enabled $.Values.web.apiUpstream (eq $name "api") }}
    {{- /* rova's guide-assets reverse proxy calls the api Service from the web
           pod; explicit so the pairing survives any narrowing of the generic
           same-namespace rule. Other products leave web.apiUpstream false. */}}
    - from:
        - podSelector:
            matchLabels:
              {{- include "qnsc.selectorLabels" (list $ "web") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $podPort }} }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
