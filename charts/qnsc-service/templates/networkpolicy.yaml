{{- /* §10 — "Namespaces are not isolation. Without this, seven products in one
       cluster share a fate."

       Default-deny first, then allow explicitly. These policies are namespace-wide
       and render once, not per service — a per-service default-deny would be six
       copies of the same rule with six chances to omit one.

       ONPREM: `networkPolicy.enabled: false` renders none of this. One node means
       the default-deny set buys little and costs an outage class (§5.6); the one
       policy that matters on-prem — `data-prod` admits rova-prod, restore-test,
       cnpg-system and `platform` on the metrics ports only — lives in
       gitops/platform, not here. */}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
{{- /* DNS is exempt from default-deny or nothing resolves, and the failure looks
       like every dependency being down at once. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
{{- /* §4b — the `platform` namespace holds services every product consumes:
       clamd today, an embedding server later. This egress allow is the product
       half of `expose: cluster`. Rendering it from the chart is the point: written
       by hand, seven times, this exception is how default-deny quietly stops
       meaning anything. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
---
{{- /* Egress to the internet (Graph, R2, GHCR) is allowed; INGRESS is not, and that is
       where the boundary actually sits (§3: the tunnel means there is no inbound
       surface at all).

       `0.0.0.0/0 except IMDS` ALSO matches every pod and Service address in the
       cluster, so on its own it let a product namespace reach every other namespace
       and default-deny egress stopped nothing. The cluster's pod and Service CIDRs
       (networkPolicy.clusterCidrs, the k3s defaults) are therefore excluded; what a
       product legitimately needs inside the cluster is allowed by name: DNS, the
       platform namespace, and its data namespace (next policy). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # IMDS — pods use IRSA, never the node role
              {{- range .Values.networkPolicy.clusterCidrs }}
              - {{ . }}
              {{- end }}
{{- if eq (.Values.data.postgres.mode | default "none") "cnpg" }}
---
{{- /* The CIDR exclusion above also cut the way to the product's own data: Postgres
       (CNPG) and the cache, both in the namespace data.postgres.namespace
       (data-prod / data-dev). Allowed by namespace and port, nothing else. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-data
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.data.postgres.namespace | quote }} }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
{{- end }}
{{- range $name, $_ := .Values.services }}
{{- $svc  := include "qnsc.svc"  (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind      | fromYaml }}
{{- if ne $caps.service "none" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-{{ $name }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qnsc.selectorLabels" (list $ $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if has ($svc.expose | default "none") (list "public" "protected") }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: "platform" }
      ports:
        - { protocol: TCP, port: {{ $svc.port }} }
    {{- end }}
    {{- if eq ($svc.expose | default "none") "cluster" }}
    {{- /* §4b — reachable from any PRODUCT namespace, never the internet. The
           label is what makes this expressible instead of hand-written. */}}
    - from:
        - namespaceSelector:
            matchLabels: { qnsc.vn/tenant: product }
      ports:
        - { protocol: TCP, port: {{ $svc.port }} }
    {{- end }}
    - from:
        - podSelector: {}          # same namespace, service to service
      ports:
        - { protocol: TCP, port: {{ $svc.port }} }
{{- end }}
{{- end }}
{{- end }}
