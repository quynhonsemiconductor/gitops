{{/*
REFERENCE IMPLEMENTATION — every other template follows this shape.

  1. loop over .Values.services
  2. resolve the service (preset merged with its own values)
  3. ask the KIND TABLE what it needs — never test the kind directly
  4. render

If you need a `if eq $svc.kind "..."` here, _kinds.tpl is missing a column.
*/}}
{{- range $name, $_ := .Values.services }}
{{- $svc  := include "qnsc.svc"  (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind      | fromYaml }}
{{- /* The pod's port: the Service forwards to it (targetPort) and the kubelet
       probes it. `port` is the Service port and the default. */}}
{{- $podPort := $svc.targetPort | default $svc.port }}
{{- if eq $caps.workload "Deployment" }}
{{- $d := $.Values.defaults }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
spec:
  # Keep three ReplicaSets: a rollback target, one, and headroom for triage.
  # The default (10) is ~7 extra ReplicaSet objects per Deployment for nothing.
  revisionHistoryLimit: 3
  {{- /* A fixed replica count, from the size preset or the service's own `replicas`. There is no autoscaler
         (KEDA was dropped 2026-10-13, decision D2): dev scales to zero by schedule with kube-downscaler,
         and a service that needs more replicas says so in its values. */}}
  replicas: {{ $svc.replicas }}
  {{- /* A RollingUpdate briefly runs the OLD and NEW pod at once, which for a
         singleton scheduler means every job fires twice during every deploy.
         Recreate takes the old one down first — a few seconds of no scheduler,
         which is the correct trade for a thing that must be unique.

         `rollingUpdate: null` is REQUIRED, not cosmetic. The apiserver defaults
         `strategy.rollingUpdate` onto a RollingUpdate object; switching to
         Recreate later fails admission with
         `spec.strategy.rollingUpdate: Forbidden: may not be specified when
         strategy type is 'Recreate'`. Server-side apply only removes fields the
         applier previously set, so merely omitting the key leaves the
         defaulted value in the live object (gitops kb-dev, 2026-11-05). An
         explicit null in the applied configuration tells the API server to drop
         the field, so the whole strategy is owned by this manager from then on. */}}
  {{- if $svc.singleton }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "qnsc.selectorLabels" (list $ $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "qnsc.labels" (list $ $name) | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- /* §10 — Pod Security Standards `restricted` is ENFORCED per namespace.
             Rendered here so no product has to rediscover it from an admission
             rejection. */}}
      securityContext:
        runAsNonRoot: true
        {{- /* ── A NUMERIC UID, WITHOUT WHICH runAsNonRoot REFUSES TO START ────
               `runAsNonRoot: true` alone is not enough when the image's USER is a
               NAME. The kubelet cannot resolve a name to a uid without running the
               image, so it declines rather than assume:

                 Error: container has runAsNonRoot and image has non-numeric user
                 (nestjs), cannot verify user is non-root

               Every pod pulled its image successfully and then never started. The
               message is precise but easy to read as an image problem.

               1001 is what the images actually use — rova's Dockerfile builds every
               stage with `adduser --system --uid 1001`. Declaring it here rather
               than inheriting it makes the chart's guarantee independent of a
               Dockerfile it does not own: if an image ever ships a different user,
               this fails loudly instead of silently running as whoever that is. */}}
        runAsUser: {{ $svc.runAsUser | default $.Values.defaults.runAsUser | default 1001 }}
        runAsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        fsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: {{ $svc.arch | default $d.arch }}
      {{- if $svc.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "qnsc.selectorLabels" (list $ $name) | nindent 14 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $svc.drain.terminationGracePeriodSeconds | default $d.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $name }}
          {{- if $svc.imageFrom }}
          {{- if not (hasKey $.Values.services $svc.imageFrom) }}
          {{- fail (printf "service %q: imageFrom %q is not a service" $name $svc.imageFrom) }}
          {{- end }}
          image: {{ include "qnsc.image" (list $ (index $.Values.services $svc.imageFrom) $name) }}
          {{- else }}
          image: {{ include "qnsc.image" (list $ $svc $name) }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          {{- with $svc.args }}
          args: {{ toJson . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if ne $caps.service "none" }}
          ports:
            - name: {{ if eq $svc.kind "grpc" }}grpc{{ else }}http{{ end }}
              containerPort: {{ required (printf "service %q: `port` is required for kind %s" $name $svc.kind) $podPort }}
          {{- end }}

          {{- /* ── §15d: the requests/limits rule ──────────────────────────────
                 CPU    request only, NEVER a limit. CFS quota throttles on 100 ms
                        bursts rather than averages, so an IO-bound service is
                        throttled at 20% average CPU — and it presents as latency
                        with no OOMKill, no restart and no alarm.
                 memory limit == request. Memory is not compressible; bursting
                        only defers an OOMKill to a worse moment, and it breaks
                        the bin-packing the cost model assumes. Equal values also
                        give Guaranteed QoS, so these are evicted last. */}}
          resources:
            requests:
              cpu: {{ $svc.resources.cpu | default $d.resources.cpu }}
              memory: {{ $svc.resources.memory | default $d.resources.memory }}
            limits:
              memory: {{ $svc.resources.memoryLimit | default ($svc.resources.memory | default $d.resources.memory) }}
              {{- if $svc.resources.gpu }}
              nvidia.com/gpu: {{ $svc.resources.gpu }}
              {{- end }}

          {{- /* ── §9j: probe discipline ───────────────────────────────────────
                 liveness  answers "is the process alive" and checks NOTHING else.
                           A liveness probe that touches the database kills every
                           replica of every service the moment the database slows
                           down, turning a slowdown into an outage.
                 readiness MAY check dependencies.
                 startup   for slow boots — kb loads a ~1.5 GB ONNX session, which
                           needs a startupProbe rather than a generous liveness
                           threshold. */}}
          {{- /* PROBES ARE GATED ON `service`, NOT ONLY ON "not a Job".

                 This condition used to be `ne $caps.workload "Job"`, which gave an
                 httpGet liveness AND readiness probe to `kind: worker` — a kind
                 whose own capability row says `service: none`, because it serves
                 no HTTP at all. With no `port` in its values the probes fell back
                 to `port | default 8080` and asked an unbound port for /livez.

                 That is a CrashLoopBackOff on every worker in the estate, not a
                 warning: liveness fails on connection refused, the kubelet
                 restarts the container, and the Deployment never reports Ready so
                 ArgoCD sits Progressing and then Degraded. rova, opshub and
                 qnsc-kb all declare a worker, and rova's is explicit about why
                 there is nothing to probe — apps/worker/src/main.ts:15,
                 "createApplicationContext: no HTTP driver needed — worker is
                 queue/cron only".

                 Found 2026-09-19 in the pre-apply audit. It would not have
                 appeared until the first sync: the manifests are valid, helm lint
                 and helm unittest pass, and nothing in CI knows which ports a
                 product's image binds.

                 A worker gets NO liveness probe deliberately. The correct
                 liveness signal for a queue consumer is the process exiting,
                 which Kubernetes already restarts; an HTTP probe would only be a
                 second, weaker copy of that. If a worker ever needs a real
                 liveness signal it should expose one and set `port`, at which
                 point this condition picks it up on its own.

                 IT ALSO DROPS A `startupProbe`, and qnsc-kb's worker is the case
                 to understand: it declared `startupPath: /livez` while serving no
                 HTTP, so that probe was as broken as the other two. Losing it
                 costs nothing on the restart side — with no liveness probe,
                 nothing kills a worker that takes ten minutes to load a 1.5 GB
                 ONNX session; it simply takes ten minutes.

                 What it does cost is ROLLOUT GATING: the pod reports Ready as
                 soon as the container starts, so a RollingUpdate can retire the
                 old replica before the new one is actually consuming from the
                 queue. For a queue that is a delay, not a loss — messages wait —
                 which is why this is recorded rather than worked around. A worker
                 that cannot tolerate even that should expose a real readiness
                 endpoint and set `port`. */}}
          {{- if and (ne $caps.workload "Job") (ne $caps.service "none") }}
          livenessProbe:
            {{- if eq $svc.kind "grpc" }}
            grpc: { port: {{ $podPort }} }
            {{- else }}
            httpGet: { path: {{ $d.probes.livenessPath }}, port: {{ $podPort | default 8080 }} }
            {{- end }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            {{- if eq $svc.kind "grpc" }}
            grpc: { port: {{ $podPort }} }
            {{- else }}
            httpGet: { path: {{ $svc.readinessPath | default $d.probes.readinessPath }}, port: {{ $podPort | default 8080 }} }
            {{- end }}
            periodSeconds: 5
            failureThreshold: 3
          {{- if $svc.startupPath }}
          startupProbe:
            httpGet: { path: {{ $svc.startupPath }}, port: {{ $podPort | default 8080 }} }
            periodSeconds: 5
            failureThreshold: 60
          {{- end }}
          {{- end }}

          {{- /* §4e — a realtime pod must stop accepting, tell its clients to
                 reconnect, and only then exit. Without it every deploy, every
                 consolidation and every scale-in is a visible outage to whoever
                 is connected. */}}
          {{- if $svc.drain.preStop }}
          lifecycle:
            preStop:
              exec:
                command: {{ $svc.drain.preStop | toJson }}
          {{- end }}

          {{- /* §9a — resource attributes pinned in one place. Without them seven
                 products name the same concept seven ways and no dashboard,
                 alert or query is portable between them. */}}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $d.otelEndpoint | default $.Values.otel.endpoint }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-%s" (include "qnsc.product" $) $name }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=%s,deployment.environment=%s,service.version=%s"
                        (include "qnsc.product" $) (include "qnsc.env" $) ($svc.image.tag | default "") }}
            {{- /* ── What is actually running (owner request 2026-11-05) ─────────
                   The image tag is already the one fact every promotion diff
                   carries, so it is the version the process reports: no second
                   copy in values for a human to forget. CI writes the tag on
                   every deploy; a release is `vX.Y.Z`, a dev build `sha-<commit>`
                   (tags.<env>.yaml). A digest-only pin names no version and gets
                   neither variable — an absent value is honest, a defaulted one
                   becomes a lie the UI shows to a customer.
                   APP_COMMIT is derived from a sha tag and omitted for a release
                   tag; the API reports it as unknown until one is known. */}}
            {{- with $svc.image.tag }}
            - name: APP_VERSION
              value: {{ . | quote }}
            {{- $commit := include "qnsc.appCommit" . }}
            {{- if $commit }}
            - name: APP_COMMIT
              value: {{ $commit | quote }}
            {{- end }}
            {{- end }}
            {{- /* §5d / §6.3 — HOW THE DATABASE ENDPOINT IS CHOSEN.
                   `mode: cnpg` (on-prem): straight to the CNPG cluster's -rw
                   Service — a SAN on CNPG's server certificate, which is what
                   makes TLS verify-full against the mounted CA work (§6.3). No
                   pooler in front (`pooling: none` is the on-prem decision; the
                   opshub worker needs a session-level LISTEN connection anyway).
                   Otherwise an explicit `host` wins; the old pgbouncer branch is
                   gone — the Bitnami image no longer exists upstream. */}}
            {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.data $.Values.data.postgres }}
            {{- $pg := $.Values.data.postgres }}
            {{- if eq $pg.mode "cnpg" }}
            - name: DATABASE_HOST
              value: {{ required "data.postgres.cluster is required when mode is cnpg" $pg.cluster }}-rw.{{ required "data.postgres.namespace is required when mode is cnpg" $pg.namespace }}.svc
            - name: DATABASE_PORT
              value: "5432"
            {{- else if $pg.host }}
            {{- /* ── WHY THIS BRANCH HAD TO EXIST ────────────────────────────
                   DATABASE_HOST used to be emitted ONLY for pgbouncer, so
                   `pooling: none` rendered an application with no database host
                   at all. The pooler was not optional in practice, it was the
                   only way the connection got configured, and its image no
                   longer exists upstream. Connecting directly is a first-class mode. */}}
            - name: DATABASE_HOST
              value: {{ $pg.host | quote }}
            - name: DATABASE_PORT
              value: "5432"
            {{- end }}
            {{- with $pg.name }}
            - name: DATABASE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- /* A worker with its own DB role (data.postgres.workerUser) logs in as
                   it; everything else as data.postgres.user. ONE DATABASE_USER per
                   container — a per-service env override would duplicate the name
                   and server-side apply rejects duplicates. */}}
            {{- with (ternary ($pg.workerUser | default $pg.user) $pg.user (eq $svc.kind "worker")) }}
            - name: DATABASE_USER
              value: {{ . | quote }}
            {{- end }}
            {{- /* ── TLS VERIFY-FULL (§6.3) ──────────────────────────────────
                   `caFile` points at the CNPG server CA mounted below; the
                   platform-db / node-pg / asyncpg stacks combine it with
                   hostname verification, so a renamed or forged server is
                   refused. The CA reaches the product namespace through ESO
                   (the `cnpg-ca` ClusterSecretStore), which is why it is a
                   mounted file and not a values value. */}}
            {{- with $pg.caFile }}
            - name: DATABASE_SSL_CA
              value: {{ . | quote }}
            {{- end }}
            {{- /* `password` (CNPG managed roles) is the only mode: the credential arrives
                   through the <product>-db-* Secret. */}}
            {{- with $pg.auth }}
            - name: DATABASE_AUTH
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- /* ── §7.1/§7.3 — THE GRAPH CERTIFICATE IS A FILE, WORKER ONLY ──
                   The Service app's certificate credential (one combined PEM)
                   is mounted from the secret named in
                   `secrets.workerOnly.graphCert` at
                   `secrets.workerOnly.path`, and the worker reads it through
                   AZURE_CLIENT_CERTIFICATE_PATH — the @azure/identity standard
                   name. Never an env var: a PEM in the environment leaks into
                   crash dumps, `kubectl describe` of child processes and every
                   accidental log line. The secret is synced by ESO from Key
                   Vault (gitops/platform stores); the chart only mounts what
                   the values name. */}}
            {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.secrets.workerOnly.graphCert }}
            {{- if eq $svc.kind "worker" }}
            - name: AZURE_CLIENT_CERTIFICATE_PATH
              value: {{ required "secrets.workerOnly.path is required when secrets.workerOnly.graphCert is set" $.Values.secrets.workerOnly.path | quote }}
            {{- end }}
            {{- end }}
            {{- /* ── PRODUCT-WIDE env, MERGED BEFORE the per-service block ──────
                   Some configuration belongs to the PRODUCT, not to one service.
                   Entra is the case that forced this: `api` and `worker` share the
                   same env validator, so supplying the tenant/client id to `api`
                   alone left the worker crash-looping on

                     ENTRA_TENANT_ID: expected string, received undefined

                   with the api healthy beside it — which reads like a worker bug
                   rather than a values-file shape. Duplicating the block per service
                   is the obvious fix and the one that drifts: two copies of an
                   identity that must agree.
                   Per-service `env` comes second, so a service can still override. */}}
            {{- with $.Values.defaults.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* ── The product's secrets ────────────────────────────────────
                 THIS WAS MISSING. Before it, `api` and `worker` rendered with no
                 envFrom at all: PgBouncer got kb-app and the migrator Job got
                 kb-migrator, but the applications themselves got nothing — no
                 DATABASE_URL, no REDIS_URL, no API keys. They would have started
                 and failed on the first line that read one.
                 The ExternalSecret that creates this is rendered beside them
                 (§8); attaching it here is what makes it reach a process. */}}
          {{- if or (ne (toString $svc.inheritSecrets) "false") $svc.envFrom }}
          envFrom:
            {{- if ne (toString $svc.inheritSecrets) "false" }}
            {{- if $.Values.data }}
            {{- if include "qnsc.perValueEnv" $ }}
            {{- if $.Values.secrets.env }}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-env
            {{- end }}
            {{- if and $.Values.secrets.envApiOnly (eq $svc.kind "http") }}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-env-api
            {{- end }}
            {{- else }}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-app
            {{- end }}
            {{- $sb := ($.Values.secrets).serviceBundles | default dict }}
            {{- if (index $sb $name) }}
            - secretRef:
                name: {{ printf "%s-%s-bundle" (include "qnsc.product" $) $name }}
            {{- end }}
            {{- end }}
            {{- if and $.Values.data.postgres (ne $.Values.data.postgres.mode "none") }}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-db-{{ if and (eq $svc.kind "worker") ($.Values.secrets).dbWorker }}worker{{ else }}app{{ end }}
            {{- end }}
            {{- end }}
            {{- with $svc.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- /* CNPG server CA — every DB-using service of the product. */}}
            {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.data $.Values.data.postgres.caFile }}
            - name: db-ca
              mountPath: {{ $.Values.data.postgres.caFile }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
            {{- /* The Graph PEM, worker only (see the env block above). */}}
            {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.secrets.workerOnly.graphCert (eq $svc.kind "worker") }}
            - name: graph-cert
              mountPath: {{ $.Values.secrets.workerOnly.path }}
              subPath: cert.pem
              readOnly: true
            {{- end }}
            {{- with $svc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        {{- /* ── Sidecars ─────────────────────────────────────────────────────
               Deliberately plain. §4c argues a large read-only artefact loaded
               per replica — a ClamAV signature database, an ONNX model — belongs
               behind a Service rather than inside every pod. That argument still
               holds, and it is an OPTIMISATION, not a migration step: a sidecar
               works on Kubernetes exactly as it did on ECS, so the move can be
               like-for-like and the memory reclaimed afterwards.

               Migrating and optimising at once means a regression could be either. */}}
        {{- range $sc := $svc.sidecars }}
        - name: {{ $sc.name }}
          image: {{ $sc.image }}
          {{- with $sc.command }}
          command: {{ toJson . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with $sc.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ $sc.resources.cpu }}
              memory: {{ $sc.resources.memory }}
            limits:
              memory: {{ $sc.resources.memoryLimit | default $sc.resources.memory }}
          {{- with $sc.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $sc.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ $sc.name }}-tmp
              mountPath: /tmp
            {{- with $sc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.data $.Values.data.postgres.caFile }}
        - name: db-ca
          secret:
            secretName: {{ include "qnsc.product" $ }}-db-ca
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
        {{- /* Worker-only like the mount below: the api must not even carry the
               volume, or a future api-side code path reads the PEM silently. */}}
        {{- if and (ne (toString $svc.inheritSecrets) "false") $.Values.secrets.workerOnly.graphCert (eq $svc.kind "worker") }}
        - name: graph-cert
          secret:
            secretName: {{ $.Values.secrets.workerOnly.graphCert }}
            items: [{ key: cert.pem, path: cert.pem }]
        {{- end }}
        {{- range $sc := $svc.sidecars }}
        - name: {{ $sc.name }}-tmp
          emptyDir: {}
        {{- end }}
        {{- with $svc.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
