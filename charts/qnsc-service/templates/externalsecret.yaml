{{- if .Values.data }}
---
{{- /* §8 — a SecretStore PER NAMESPACE, each with its own ServiceAccount and IRSA
       role. NEVER a ClusterSecretStore: cluster-wide is less setup and means one
       compromised namespace can read every product's secrets. Per-namespace keeps
       the blast radius equal to the namespace, which is the same principle as the
       NetworkPolicies in §10.

       The IAM policy behind this role is one wildcard — `qnsc/prod/rova/*` —
       which is only possible because §7c made the secret path hierarchical. Flat
       names would mean enumerating every secret in the policy and editing it on
       every addition, which is the chore that gets skipped. */}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "qnsc.product" . }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
      auth:
        jwt:
          serviceAccountRef:
            {{- /* ── THIS NAMED A ServiceAccount THAT DOES NOT EXIST ──────────────
                   It said `external-secrets`, and this chart creates accounts named
                   after SERVICES — api, worker, migrator. Nothing created an
                   `external-secrets` account in a product namespace, so the store
                   reported `InvalidProviderConfig: unable to create client`, every
                   ExternalSecret reported `SecretSyncedError`, and the pods never
                   started because their envFrom Secret was never written. Three
                   symptoms, none of which names a missing ServiceAccount.

                   It resolves to an account that DOES exist and whose IRSA role is
                   already scoped to this product's secret prefix:

                     qnsc-<env>-rova-api  ->  secret:qnsc/<env>/rova/*

                   §8's boundary is the PRODUCT namespace, and that role does not
                   cross it — so using it for the store keeps the blast radius §8
                   asks for. It is a little broad WITHIN the namespace (the api
                   identity fetches the migrator's secret too); the tighter version
                   is a dedicated reader account per namespace, which needs a new
                   role in `product-profile` and is worth doing when that module is
                   next touched rather than as part of a migration. */}}
            name: {{ .Values.secretsReaderServiceAccount | default "api" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "qnsc.product" . }}
    kind: SecretStore
  target:
    name: {{ include "qnsc.product" . }}-app
  dataFrom:
    - find:
        path: {{ include "qnsc.secretPrefix" . }}/app/
        {{- /* ── `path` ALONE IS NOT A QUERY, WHICH IS WHY NOTHING SYNCED ──────
               ESO's AWS provider rejected this with `unexpected find operator`:
               `path` is a FILTER and needs `name` or `tags` alongside it to say
               WHAT to match within that path. Without one, every ExternalSecret
               in every product namespace failed, the envFrom Secret was never
               written, and the pods sat in CreateContainerConfigError. */}}
        name:
          regexp: ".*"
      {{- /* ── AND THE KEYS NEEDED REWRITING TO BE ENV VARS ──────────────────
             §7c stores one secret per key, so a find returns keys that are FULL
             secret names:

               qnsc/dev/rova/app/cookie-secret

             which is not a usable environment variable. These two rules take the
             leaf and upper-snake it, giving COOKIE_SECRET — what the application
             actually reads. Order matters: strip the path first, then case it. */}}
      rewrite:
        - regexp:
            source: ".*/([^/]+)$"
            target: "$1"
        - transform:
            {{- /* BACKTICKS SO HELM PASSES THIS THROUGH. The braces are ESO's to
                   evaluate at sync time, not Helm's at render time; unescaped, Helm
                   tries to run `upper` against its own context and fails with
                   "invalid value; expected string". */}}
            template: '{{ `{{ .value | upper | replace "-" "_" }}` }}'
{{- if .Values.data.postgres }}
{{- if ne .Values.data.postgres.mode "none" }}
---
{{- /* §5d — the MIGRATOR credential is a separate secret because it is a separate
       ROLE. The application role carries statement_timeout = 30s, which would
       kill the 600s migrations §4 sets deliberately; and DDL rights have no
       business on a runtime role. Two secrets so a compromised application cannot
       reshape its own schema. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-migrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "qnsc.product" . }}
    kind: SecretStore
  target:
    name: {{ include "qnsc.product" . }}-migrator
  dataFrom:
    - find:
        path: {{ include "qnsc.secretPrefix" . }}/migrator/
        {{- /* ── `path` ALONE IS NOT A QUERY, WHICH IS WHY NOTHING SYNCED ──────
               ESO's AWS provider rejected this with `unexpected find operator`:
               `path` is a FILTER and needs `name` or `tags` alongside it to say
               WHAT to match within that path. Without one, every ExternalSecret
               in every product namespace failed, the envFrom Secret was never
               written, and the pods sat in CreateContainerConfigError. */}}
        name:
          regexp: ".*"
      {{- /* ── AND THE KEYS NEEDED REWRITING TO BE ENV VARS ──────────────────
             §7c stores one secret per key, so a find returns keys that are FULL
             secret names:

               qnsc/dev/rova/app/cookie-secret

             which is not a usable environment variable. These two rules take the
             leaf and upper-snake it, giving COOKIE_SECRET — what the application
             actually reads. Order matters: strip the path first, then case it. */}}
      rewrite:
        - regexp:
            source: ".*/([^/]+)$"
            target: "$1"
        - transform:
            {{- /* BACKTICKS SO HELM PASSES THIS THROUGH. The braces are ESO's to
                   evaluate at sync time, not Helm's at render time; unescaped, Helm
                   tries to run `upper` against its own context and fails with
                   "invalid value; expected string". */}}
            template: '{{ `{{ .value | upper | replace "-" "_" }}` }}'
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.services }}
{{- $needsPrometheus := false }}
{{- range $name, $_ := .Values.services }}
{{- $svc := include "qnsc.svc" (list $ $name) | fromYaml }}
{{- if and $svc.scaling (eq ($svc.scaling.type | default "") "rps") }}
{{- $needsPrometheus = true }}
{{- end }}
{{- end }}
{{- if $needsPrometheus }}
---
{{- /* KEDA queries Grafana Cloud for the request rate, so it needs the credential
       in THIS namespace — a TriggerAuthentication cannot be referenced across
       namespaces, and a ClusterTriggerAuthentication would put one credential
       within reach of every product (§8). */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keda-grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "qnsc.product" . }}
    kind: SecretStore
  target:
    name: keda-grafana
  dataFrom:
    - find:
        path: {{ include "qnsc.secretPrefix" . }}/keda/
        {{- /* ── `path` ALONE IS NOT A QUERY, WHICH IS WHY NOTHING SYNCED ──────
               ESO's AWS provider rejected this with `unexpected find operator`:
               `path` is a FILTER and needs `name` or `tags` alongside it to say
               WHAT to match within that path. Without one, every ExternalSecret
               in every product namespace failed, the envFrom Secret was never
               written, and the pods sat in CreateContainerConfigError. */}}
        name:
          regexp: ".*"
      {{- /* ── AND THE KEYS NEEDED REWRITING TO BE ENV VARS ──────────────────
             §7c stores one secret per key, so a find returns keys that are FULL
             secret names:

               qnsc/dev/rova/app/cookie-secret

             which is not a usable environment variable. These two rules take the
             leaf and upper-snake it, giving COOKIE_SECRET — what the application
             actually reads. Order matters: strip the path first, then case it. */}}
      rewrite:
        - regexp:
            source: ".*/([^/]+)$"
            target: "$1"
        - transform:
            {{- /* BACKTICKS SO HELM PASSES THIS THROUGH. The braces are ESO's to
                   evaluate at sync time, not Helm's at render time; unescaped, Helm
                   tries to run `upper` against its own context and fails with
                   "invalid value; expected string". */}}
            template: '{{ `{{ .value | upper | replace "-" "_" }}` }}'
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-grafana
spec:
  secretTargetRef:
    - parameter: username
      name: keda-grafana
      key: username
    - parameter: password
      name: keda-grafana
      key: password
{{- end }}
{{- end }}
