{{- if .Values.data }}
{{- /* `secrets.bundle` (deprecated, back-compat): not rendered when the product uses per-value
       secrets (secrets.env / secrets.envApiOnly) — see qnsc.perValueEnv. */}}
{{- if not (include "qnsc.perValueEnv" .) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" . | nindent 4 }}
  target:
    name: {{ include "qnsc.product" . }}-app
  dataFrom:
    {{- /* ONPREM-PLAN §5.6 — one Key Vault secret per (product, env, role) holding a
           JSON object; `extract` turns each JSON key into a Secret key, which IS the
           env var name. No find/rewrite: that machinery is Secrets Manager's
           one-secret-per-key layout. */}}
    - extract:
        key: {{ include "qnsc.remoteKey" (list . "app") }}
{{- end }}
{{- if .Values.data.postgres }}
{{- if ne .Values.data.postgres.mode "none" }}
---
{{- /* §5d — the MIGRATOR credential is a separate secret because it is a separate
       ROLE. The application role carries statement_timeout = 30s, which would
       kill the 600s migrations §4 sets deliberately; and DDL rights have no
       business on a runtime role. Two secrets so a compromised application cannot
       reshape its own schema. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-migrator
  annotations:
    {{- include "qnsc.migratorPrereq" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" . | nindent 4 }}
  target:
    name: {{ include "qnsc.product" . }}-migrator
  {{- /* ONPREM-PLAN §6.3 — the migrator's OWN password (<product>-<env>-db-migrator,
         a plain string), never the app role's: DATABASE_USER is <product>_migrator,
         so a copy of the app credential fails the migration Job on wave -1. */}}
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: {{ include "qnsc.remoteKey" (list . "migrator") }}
{{- /* ── THE RUNTIME DB PASSWORDS ─────────────────────
       ONE Secret per runtime role, synced from the plain-string Key Vault secret
       the CNPG managed role itself reads (ONPREM-PLAN §6.3), so the app and the
       role can never disagree:
         <product>-db-app     <- secrets.db        api (and the worker unless dbWorker is set)
         <product>-db-worker  <- secrets.dbWorker  worker only, when the product has a worker role
       Attached by envFrom AFTER <product>-app (deployment.yaml), so the DB
       password is stored once, here, and never in the app bundle. NOT hooks:
       running Deployments mount them. The migrator has its own (above). */}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" . | nindent 4 }}
  target:
    name: {{ include "qnsc.product" . }}-db-app
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: {{ include "qnsc.remoteKey" (list . "db") }}
{{- if (.Values.secrets).dbWorker }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" . }}-db-worker
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" . | nindent 4 }}
  target:
    name: {{ include "qnsc.product" . }}-db-worker
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: {{ include "qnsc.remoteKey" (list . "dbWorker") }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* ── PER-SERVICE BUNDLES (§7.1) ────────────────────────────────────────────
       One shared bundle cannot fit every product: opshub's worker env schema
       REFUSES TO START with BETTER_AUTH_SECRET / ENTRA_CLIENT_SECRET /
       EDGE_CLIENT_IP_SECRET set, and its API refuses GRAPH_*. A product whose
       schemas demand a split sets
         secrets.serviceBundles: { api: <product>-<env>-api, worker: ... }
       and gets ONE extra ExternalSecret per named service — extract of that Key
       Vault JSON into <product>-<service>-bundle, attached by envFrom AFTER the
       shared <product>-app (later envFrom entries win key collisions, so the
       service bundle overrides the shared one). The shared `bundle` keeps
       everything both services genuinely share.
 */}}
{{- $sb := (($.Values.secrets).serviceBundles) | default dict }}
{{- range $svcName := list "api" "worker" }}
{{- $bundleKey := index $sb $svcName }}
{{- if $bundleKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" $ }}-{{ $svcName }}-bundle
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.secrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "qnsc.product" $ }}-{{ $svcName }}-bundle
  dataFrom:
    - extract:
        key: {{ $bundleKey }}
{{- end }}
{{- end }}
{{- if and $.Values.data $.Values.data.postgres.caFile }}
{{- $pg := $.Values.data.postgres }}
{{- /* ── §6.3 — THE PRODUCT'S COPY OF THE CNPG CA ─────────────────────────
       cnpg mode only. The CA is STATIC (2026-10-23 review: no rotation loop):
       a 10-year CA created once at bootstrap, applied as pg-*-ca (full,
       CNPG-managed) and pg-*-ca-pub (ca.crt ONLY) in data-<env> — the -pub
       mirror is hand-applied next to it, not synced, because nothing ever
       renews the CA. THIS ExternalSecret copies -pub into <product>-db-ca.

       `property: ca.crt` is belt AND braces: pg-*-ca-pub already holds only
       the certificate, and the property selects it again on the way in. The
       store is the cnpg-ca-<env> ClusterSecretStore, whose RBAC admits the
       -pub Secrets and nothing else (gitops platform/eso/stores-onprem.yaml).
       A future CA swap is a planned maintenance-window change: issue, apply
       both Secrets, this refresh (12 h) picks it up, roll the Deployments. */}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" $ }}-db-ca
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: cnpg-ca-{{ include "qnsc.env" $ }}
    kind: ClusterSecretStore
  target:
    name: {{ include "qnsc.product" $ }}-db-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ required "data.postgres.cluster is required when caFile is set" $pg.cluster }}-ca-pub
        property: ca.crt
{{- /* The Job's OWN copy of the CA, kept separate from the shared <product>-db-ca
       that running Deployments mount. argocd-audit 2026-11-04 M3 made both ordinary
       resources (wave -2 for this one), so a sync no longer deletes and recreates
       either Secret. The split stays: the Job's volume names this Secret and only
       this Secret, and the shared copy is never touched by a migration. */}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" $ }}-migrator-db-ca
  annotations:
    {{- include "qnsc.migratorPrereq" . | nindent 4 }}
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: cnpg-ca-{{ include "qnsc.env" $ }}
    kind: ClusterSecretStore
  target:
    name: {{ include "qnsc.product" $ }}-migrator-db-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: {{ required "data.postgres.cluster is required when caFile is set" $pg.cluster }}-ca-pub
        property: ca.crt
{{- end }}
{{- /* ── THE GRAPH CERTIFICATE (§7.1/§7.3, ON-PREM SHAPE ONLY) ──────────────
       secrets.workerOnly.graphCert names BOTH the Key Vault secret (one combined
       PEM, key + cert, stored as a plain string) and the Secret the worker mounts
       (deployment.yaml: volume `graph-cert`, key `cert.pem`, worker kind only).
       Nothing else synced it, so the worker sat in ContainerCreating on a missing
       volume Secret. Not attached by envFrom: a PEM never goes in the environment. */}}
{{- if (.Values.secrets.workerOnly).graphCert }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.workerOnly.graphCert }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" . | nindent 4 }}
  target:
    name: {{ .Values.secrets.workerOnly.graphCert }}
  data:
    - secretKey: cert.pem
      remoteRef:
        key: {{ .Values.secrets.workerOnly.graphCert }}
{{- end }}
{{- /* ── PER-VALUE APP SECRETS (ON-PREM, chart 0.14.0) ──────────────────────────
       secrets.env: { ENV_VAR_NAME: <Key Vault secret name> }. ONE ExternalSecret
       <product>-env with one `data` entry per variable (secretKey = the env var,
       remoteRef.key = the Key Vault secret, a plain string), attached by envFrom to
       every service and cronjob but NOT to the migrator Job (it reads only the DB
       credentials it already has). secrets.envApiOnly renders <product>-env-api the
       same way and is attached to http services only: for a secret a worker must
       not hold. Replaces the JSON `secrets.bundle`. */}}
{{- if include "qnsc.perValueEnv" . }}
{{- range $suffix, $key := dict "env" "env" "env-api" "envApiOnly" }}
{{- $m := index ($.Values.secrets | default dict) $key }}
{{- if $m }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "qnsc.product" $ }}-{{ $suffix }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- include "qnsc.storeRef" $ | nindent 4 }}
  target:
    name: {{ include "qnsc.product" $ }}-{{ $suffix }}
  data:
    {{- range $var := keys $m | sortAlpha }}
    - secretKey: {{ $var }}
      remoteRef:
        key: {{ index $m $var }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
