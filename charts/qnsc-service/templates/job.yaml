{{- range $name, $_ := $.Values.services }}
{{- $svc  := include "qnsc.svc"  (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind      | fromYaml }}
{{- if eq $caps.workload "Job" }}
{{- $d := $.Values.defaults }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* A fresh name per revision: a Job's pod template is immutable, so reusing
         the name makes the second sync fail. */}}
  {{- /* Digest wins (same rule as the image ref): name from its first 12 hex, so a
         digest-only values file renders and a rollback to a digest names the same
         Job again (BeforeHookCreation deletes the old one). */}}
  {{- if $svc.image.digest }}
  name: {{ $name }}-{{ $svc.image.digest | trimPrefix "sha256:" | trunc 12 }}
  {{- else }}
  name: {{ $name }}-{{ $svc.image.tag | replace ":" "-" | trunc 20 | trimSuffix "-" }}
  {{- end }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
  annotations:
    {{- /* §4 — an ArgoCD PreSync hook, NOT a Helm pre-upgrade hook. With ArgoCD
           owning the lifecycle, Helm hook failure semantics and ArgoCD's sync
           state disagree, producing releases that are "failed" in Helm and
           "Synced" in ArgoCD. PreSync blocks the sync on migration failure, which
           is the behaviour wanted. */}}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  {{- /* §4 — explicit, because the default kills a slow migration part-way, which
         is the worst possible moment. Recovery is covered by expand-and-contract
         (§13): a half-applied migration leaves a forward-compatible schema, so
         re-running the sync is safe. */}}
  activeDeadlineSeconds: {{ $svc.timeoutSeconds | default 600 }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "qnsc.labels" (list $ $name) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        {{- /* ── A NUMERIC UID, WITHOUT WHICH runAsNonRoot REFUSES TO START ────
               `runAsNonRoot: true` alone is not enough when the image's USER is a
               NAME. The kubelet cannot resolve a name to a uid without running the
               image, so it declines rather than assume:

                 Error: container has runAsNonRoot and image has non-numeric user
                 (nestjs), cannot verify user is non-root

               Every pod pulled its image successfully and then never started. The
               message is precise but easy to read as an image problem.

               1001 is what the images actually use — rova's Dockerfile builds every
               stage with `adduser --system --uid 1001`. Declaring it here rather
               than inheriting it makes the chart's guarantee independent of a
               Dockerfile it does not own: if an image ever ships a different user,
               this fails loudly instead of silently running as whoever that is. */}}
        runAsUser: {{ $svc.runAsUser | default $.Values.defaults.runAsUser | default 1001 }}
        runAsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        fsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: {{ $svc.arch | default $d.arch }}
      containers:
        - name: {{ $name }}
          image: {{ include "qnsc.image" (list $ $svc $name) }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: {{ $svc.resources.cpu | default $d.resources.cpu }}
              memory: {{ $svc.resources.memory | default $d.resources.memory }}
            limits:
              memory: {{ $svc.resources.memory | default $d.resources.memory }}
          envFrom:
            {{- /* §5d — the MIGRATOR role, never the application role. The app role
                   carries statement_timeout = 30s, which would kill the 600s
                   migration above; and DDL rights have no business on the runtime
                   role. */}}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-migrator
                {{- /* ── OPTIONAL, BECAUSE UNDER IAM AUTH IT IS LEGITIMATELY EMPTY ──
                       §7c gives the migrator its own secret PATH, and under
                       `auth: iam` there is nothing to put in it: the role is a member
                       of `rds_iam` and has no password. ESO finds zero secrets, so it
                       reports SecretSynced and creates NO Secret at all — and a
                       required secretRef then fails with

                         Error: secret "rova-migrator" not found

                       while the ExternalSecret beside it reports Ready=True. Marking
                       it optional is what lets "no credential" be a valid state
                       rather than a broken one. */}}
                optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- /* The CNPG server CA, same mount the Deployments get (§6.3) —
                   verify-full is not optional for a migrator either. */}}
            {{- if and $.Values.data $.Values.data.postgres.caFile }}
            - name: db-ca
              mountPath: {{ $.Values.data.postgres.caFile }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
          env:
            {{- /* ── THE MIGRATOR HAD NO WAY TO FIND THE DATABASE ────────────────
                   This Job emitted no DATABASE_* at all, so the only route to a host
                   was the secret above — which is empty under IAM auth. It therefore
                   could not connect by any means.
                   DATABASE_USER is the MIGRATOR role, never the application's: §5d
                   gives the app statement_timeout = 30s, which would kill the 600s
                   migration this Job exists to run, and DDL rights have no business
                   on a runtime role. */}}
            {{- if and $.Values.data $.Values.data.postgres }}
            {{- $pg := $.Values.data.postgres }}
            {{- /* Same endpoint rule as the Deployments (deployment.yaml): cnpg
                   mode goes to the cluster's -rw Service, an explicit host wins
                   otherwise. A migrator that cannot find the database fails the
                   PreSync hook — the one failure mode that STOPS a sync. */}}
            {{- if eq $pg.mode "cnpg" }}
            - name: DATABASE_HOST
              value: {{ required "data.postgres.cluster is required when mode is cnpg" $pg.cluster }}-rw.{{ required "data.postgres.namespace is required when mode is cnpg" $pg.namespace }}.svc
            - name: DATABASE_PORT
              value: "5432"
            {{- else if $pg.host }}
            - name: DATABASE_HOST
              value: {{ $pg.host | quote }}
            - name: DATABASE_PORT
              value: "5432"
            {{- end }}
            {{- with $pg.name }}
            - name: DATABASE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- /* ONPREM-PLAN §6.3 — the managed roles are <product>_app and
                   <product>_migrator, i.e. the migrator role derives from the
                   PRODUCT slug. The old derivation (<user>_migrator) made
                   user=<product>_app produce <product>_app_migrator — a role
                   nobody created (opshub_app_migrator). `migratorUser`
                   overrides explicitly for anything that differs. */}}
            {{- with $pg.migratorUser | default (printf "%s_migrator" (include "qnsc.product" $)) }}
            - name: DATABASE_USER
              value: {{ . | quote }}
            {{- end }}
            {{- with $pg.caFile }}
            - name: DATABASE_SSL_CA
              value: {{ . | quote }}
            {{- end }}
            {{- with $pg.auth }}
            - name: DATABASE_AUTH
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $.Values.defaults.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- /* Pod-level volumes — the tmp emptyDir and the CNPG CA. */}}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and $.Values.data $.Values.data.postgres.caFile }}
        - name: db-ca
          secret:
            secretName: {{ include "qnsc.product" $ }}-migrator-db-ca
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
{{- end }}
{{- end }}
