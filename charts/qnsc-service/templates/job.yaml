{{- range $name, $_ := $.Values.services }}
{{- $svc  := include "qnsc.svc"  (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind      | fromYaml }}
{{- if eq $caps.workload "Job" }}
{{- $d := $.Values.defaults }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* A fresh name per revision: a Job's pod template is immutable, so reusing
         the name makes the second sync fail. */}}
  name: {{ $name }}-{{ $svc.image.tag | replace ":" "-" | trunc 20 | trimSuffix "-" }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
  annotations:
    {{- /* §4 — an ArgoCD PreSync hook, NOT a Helm pre-upgrade hook. With ArgoCD
           owning the lifecycle, Helm hook failure semantics and ArgoCD's sync
           state disagree, producing releases that are "failed" in Helm and
           "Synced" in ArgoCD. PreSync blocks the sync on migration failure, which
           is the behaviour wanted. */}}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  {{- /* §4 — explicit, because the default kills a slow migration part-way, which
         is the worst possible moment. Recovery is covered by expand-and-contract
         (§13): a half-applied migration leaves a forward-compatible schema, so
         re-running the sync is safe. */}}
  activeDeadlineSeconds: {{ $svc.timeoutSeconds | default 600 }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "qnsc.labels" (list $ $name) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        {{- /* ── A NUMERIC UID, WITHOUT WHICH runAsNonRoot REFUSES TO START ────
               `runAsNonRoot: true` alone is not enough when the image's USER is a
               NAME. The kubelet cannot resolve a name to a uid without running the
               image, so it declines rather than assume:

                 Error: container has runAsNonRoot and image has non-numeric user
                 (nestjs), cannot verify user is non-root

               Every pod pulled its image successfully and then never started. The
               message is precise but easy to read as an image problem.

               1001 is what the images actually use — rova's Dockerfile builds every
               stage with `adduser --system --uid 1001`. Declaring it here rather
               than inheriting it makes the chart's guarantee independent of a
               Dockerfile it does not own: if an image ever ships a different user,
               this fails loudly instead of silently running as whoever that is. */}}
        runAsUser: {{ $svc.runAsUser | default $.Values.defaults.runAsUser | default 1001 }}
        runAsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        fsGroup: {{ $svc.runAsGroup | default $.Values.defaults.runAsGroup | default 1001 }}
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: {{ $svc.arch | default $d.arch }}
      containers:
        - name: {{ $name }}
          image: {{ include "qnsc.image" (list $ $svc $name) }}
          {{- with $svc.command }}
          command: {{ toJson . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: {{ $svc.resources.cpu | default $d.resources.cpu }}
              memory: {{ $svc.resources.memory | default $d.resources.memory }}
            limits:
              memory: {{ $svc.resources.memory | default $d.resources.memory }}
          envFrom:
            {{- /* §5d — the MIGRATOR role, never the application role. The app role
                   carries statement_timeout = 30s, which would kill the 600s
                   migration above; and DDL rights have no business on the runtime
                   role. */}}
            - secretRef:
                name: {{ include "qnsc.product" $ }}-migrator
          {{- with $svc.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
