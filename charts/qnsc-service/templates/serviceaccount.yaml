{{- range $name, $_ := .Values.services }}
{{- $svc := include "qnsc.svc" (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind | fromYaml }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
  annotations:
    {{- /* FOUND IN THE LOCAL BOOTSTRAP REHEARSAL (k3d, 2026-10-26): the migrator
           Job ran while the ServiceAccount it names did not exist yet, so the pod
           sat in FailedCreate ("serviceaccount "migrator" not found") until its
           activeDeadlineSeconds expired and the sync aborted.

           The original fix made this account a PreSync hook. argocd-audit
           2026-11-04 M3 replaced that: the Job and its prerequisites are now
           ORDINARY resources in consecutive sync waves, so the account is created
           once and keeps its UID (a hook recreated it on every sync). wave -2 here,
           wave -1 for the Job.

           The api/worker accounts stay normal resources too; they were never
           hooks and a recreated account would invalidate running pods' tokens. */}}
    {{- if eq $caps.workload "Job" }}
    {{- include "qnsc.migratorPrereq" $ | nindent 4 }}
    {{- end }}
{{- /* §10 — no service-account token unless the pod actually calls the API
       server. Almost none of them do. */}}
automountServiceAccountToken: {{ $svc.needsApiAccess | default false }}
{{- end }}
