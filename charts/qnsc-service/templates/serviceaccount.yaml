{{- range $name, $_ := .Values.services }}
{{- $svc := include "qnsc.svc" (list $ $name) | fromYaml }}
{{- $caps := include "qnsc.caps" $svc.kind | fromYaml }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "qnsc.labels" (list $ $name) | nindent 4 }}
  annotations:
    {{- /* FOUND IN THE LOCAL BOOTSTRAP REHEARSAL (k3d, 2026-10-26): the migrator
           Job is a PreSync hook (job.yaml), and ArgoCD runs ALL hooks before ANY
           normal sync resource — so the Job ran while the ServiceAccount it names
           did not exist yet. Into a namespace the chart does not already populate
           (every first deploy, and the §13 rebuild rehearsal), the Job pod sits in
           FailedCreate ("serviceaccount "migrator" not found") until its
           activeDeadlineSeconds expires, the hook fails, and the sync aborts.

           The fix applies to the Job's account ONLY: it is a PreSync hook on wave
           -1 (hooks are ordered by wave, so it exists before the wave-0 Job), with
           BeforeHookCreation so ArgoCD can re-apply it each sync.

           The api/worker accounts MUST stay normal resources. A hooked account is
           deleted and recreated every sync -> a new UID -> the bound tokens of the
           RUNNING pods stop validating. The migrator account is safe to recreate:
           its only pod is a Job that runs after it exists. Prerequisites of the
           Job that are also created by this chart (ExternalSecrets, SecretStore)
           follow the same rule — see externalsecret.yaml. */}}
    {{- if eq $caps.workload "Job" }}
    {{- include "qnsc.presyncPrereq" $ | nindent 4 }}
    {{- end }}
    {{- /* §7c — the role ARN is DERIVED, never passed. `infra` computes the same
           string from the same three variables, so nothing crosses the repository
           boundary and nothing can drift. */}}
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ $.Values.accountId }}:role/{{ include "qnsc.roleName" (list $ $name) }}
{{- /* §10 — no service-account token unless the pod actually calls the API
       server. Almost none of them do. */}}
automountServiceAccountToken: {{ $svc.needsApiAccess | default false }}
{{- end }}
