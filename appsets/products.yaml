# One Application per (product, environment).
#
# ── WHY A LIST GENERATOR AND NOT TWELVE FILES ────────────────────────────────
#
# §11c requires the chart version to be pinned PER APPLICATION: "Twelve
# Applications means twelve pins, which sounds like drift waiting to happen. It is
# the opposite: a pin that is behind is visible in git, and a chart change that
# only some products have taken is a state the system can be in deliberately
# rather than an accident."
#
# The lists below preserve exactly that — every pin is its own line, bumping one
# product is a one-line diff, and a product left behind is visible at a glance.
# What they do NOT duplicate is the sync policy, the project, or the destination
# shape, which should be identical everywhere and would otherwise be twelve copies
# of the same paragraph with twelve chances to diverge.
#
# The trade, recorded so nobody is surprised by it: a change to the TEMPLATE below
# reaches every Application at once. That is the §11c blast radius, moved from the
# chart to this file — which is why the template changes rarely and the list
# changes often. §11's promotion is a values-file change and touches neither.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: products
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Two generators rather than one, split by environment. The alternative — a
  # single list with `prune: {{ if eq .env "dev" }}…` — does not work: a Go
  # template opening a value makes it a YAML flow mapping, and templating a
  # BOOLEAN field is not something ApplicationSet does cleanly. A generator-level
  # template override is the supported shape, and it reads better anyway.
  generators:
    # ── dev ──────────────────────────────────────────────────────────────────
    - list:
        elements:
          # qnsc-kb migrates FIRST (§17 step 2). Production has no state file, so
          # dev is genuinely low-risk — and it proves more of the chart than
          # anything else: PgBouncer, the migrator role, the worker kind, a 1.5 GB
          # model needing a startupProbe, and the clamav sidecar.
          # chartVersion 0.11.2, NOT 0.11.1: 0.11.1 has the PreSync deadlock (the
          # migrator hook runs before its ServiceAccount exists on a first deploy).
          # Fixed in 0.11.2 (gitops#45) — never pin 0.11.1.
          - { product: kb,     env: dev, cluster: dev, chartVersion: "0.12.1" }
          - { product: opshub, env: dev, cluster: dev, chartVersion: "0.12.1" }
          - { product: rova,   env: dev, cluster: dev, chartVersion: "0.12.1" }
        template:
          # The CRD requires every generator template to carry a FULL Application
          # skeleton (metadata.name, spec.project, spec.destination) — it is
          # validated structurally before ArgoCD merges it over the base template
          # below, where the real definitions live. Values here are therefore the
          # same placeholders, repeated to satisfy validation only.
          metadata:
            name: "{{.product}}-{{.env}}"
          spec:
            project: products
            destination:
              name: "{{.cluster}}"
              namespace: "{{.product}}"
            syncPolicy:
              automated:
                prune: true
              # RespectIgnoreDifferences makes a sync honour ignoreDifferences below: without it, ignoreDifferences only hides the
              # OutOfSync status, and the next sync (selfHeal) still resets `.spec.replicas` to the chart's value, undoing kube-downscaler.
              # This is the WHOLE list, not an addition: a list at generator level REPLACES the base template's (CreateNamespace,
              # ServerSideApply, PruneLast), it does not merge with it, so the three base options are repeated here on purpose.
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
                - PruneLast=true
                - RespectIgnoreDifferences=true
            # DEV ONLY. kube-downscaler (the dev night shutdown, added with the on-prem bootstrap) scales Deployments to zero outside
            # working hours, so ArgoCD must not revert `.spec.replicas` there or the two fight on every reconcile. Prod has no
            # downscaler and keeps full replica drift detection: a prod Deployment whose replicas were changed by hand is drift.
            ignoreDifferences:
              - group: apps
                kind: Deployment
                jqPathExpressions: [".spec.replicas"]

    # ── prod ─────────────────────────────────────────────────────────────────
    - list:
        elements:
          # KB is DEV ONLY (plan H-D1). No kb-prod Application exists, so
          # dropping the row deletes nothing (prune:false does not stop the
          # ApplicationSet from removing an Application that its generator
          # no longer produces — but there is none to remove).
          # chartVersion 0.11.2, NOT 0.11.1: 0.11.1 has the PreSync deadlock (the
          # migrator hook runs before its ServiceAccount exists on a first deploy).
          # Fixed in 0.11.2 (gitops#45) — never pin 0.11.1.
          - { product: opshub, env: prod, cluster: prod, chartVersion: "0.11.2" }
          # rova is LAST (§17 step 6) and soaks for two weeks. It is also the only
          # product that actually tests the cutover — everything before it is a
          # greenfield deploy that happens to use the chart.
          - { product: rova,   env: prod, cluster: prod, chartVersion: "0.11.2" }
        template:
          # Full skeleton: same reason as the dev generator above.
          metadata:
            name: "{{.product}}-{{.env}}"
          spec:
            project: products
            destination:
              name: "{{.cluster}}"
              namespace: "{{.product}}"
            syncPolicy:
              automated:
                # §11c — "a bad render should FAIL, not delete." In dev a stale
                # resource is noise. In prod, a template bug that stops rendering
                # a Deployment would otherwise delete it, and ArgoCD would report
                # Synced while the service was gone.
                prune: false

    # lms · solodesk · ai-dev-kit are added when they exist. A prod-only product
    # simply has no dev row — §5c: "Absence is the mechanism."

  template:
    metadata:
      name: "{{.product}}-{{.env}}"           # §7c — ArgoCD Application naming
    spec:
      project: products
      destination:
        name: "{{.cluster}}"
        namespace: "{{.product}}"

      sources:
        # The chart, pinned. Never a range, never a branch (§11c). GHCR tags are
        # immutable and the packages are PUBLIC (H-D22): ArgoCD pulls anonymously,
        # no pull secret and no ECR token refresher. OCI repoURL is the FULL
        # registry path — for OCI, `chart` carries the artifact name and
        # repoURL must NOT be a bare registry (that worked for ECR's
        # namespace-in-registry layout but never matched GHCR).
        - repoURL: ghcr.io/quynhonsemiconductor/charts
          chart: qnsc-service
          targetRevision: "{{.chartVersion}}"
          helm:
            valueFiles:
              # ArgoCD deep-merges these before Helm sees them, which is why the
              # chart carries no dev/prod branch of its own.
              - $values/values/{{.product}}/base.yaml
              - $values/values/{{.product}}/{{.env}}.yaml
              - $values/values/{{.product}}/tags.{{.env}}.yaml
        - repoURL: https://github.com/quynhonsemiconductor/gitops
          targetRevision: main
          ref: values

      syncPolicy:
        automated:
          selfHeal: true
          # `prune` comes from the generator above — it is the one thing that
          # genuinely differs between dev and prod.
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Namespaces outlive any single sync and carry the labels §10's
          # NetworkPolicies select on. Never pruned, in either environment.
          - PruneLast=true
        retry:
          limit: 3
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
