# One Application per (product, environment).
#
# ── WHY A LIST GENERATOR AND NOT TWELVE FILES ────────────────────────────────
#
# §11c requires the chart version to be pinned PER APPLICATION: "Twelve
# Applications means twelve pins, which sounds like drift waiting to happen. It is
# the opposite: a pin that is behind is visible in git, and a chart change that
# only some products have taken is a state the system can be in deliberately
# rather than an accident."
#
# The lists below preserve exactly that — every pin is its own line, bumping one
# product is a one-line diff, and a product left behind is visible at a glance.
# What they do NOT duplicate is the sync policy, the project, or the destination
# shape, which should be identical everywhere and would otherwise be twelve copies
# of the same paragraph with twelve chances to diverge.
#
# The trade, recorded so nobody is surprised by it: a change to the TEMPLATE below
# reaches every Application at once. That is the §11c blast radius, moved from the
# chart to this file — which is why the template changes rarely and the list
# changes often. §11's promotion is a values-file change and touches neither.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: products
  namespace: argocd
  annotations:
    # Wave 1 (ONPREM-PLAN §11.2): apps come after the platform (waves -3..0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # ArgoCD gives every Application this set generates the resources-finalizer, so
  # deleting an Application (or this ApplicationSet, or the root app that owns
  # it) cascades into deleting that environment's workloads. Commenting out a row
  # is documented as the normal way to disable a product (scripts/render.sh), and
  # a commented-out row must not be able to remove a running environment — prod
  # especially. preserveResourcesOnDeletion keeps the generated Applications'
  # resources when they are deleted; a deliberate teardown is then an explicit
  # kubectl/argocd step, not a side effect of a one-line values edit.
  syncPolicy:
    preserveResourcesOnDeletion: true

  # ONE list generator for every (product, env) row (argocd-audit 2026-11-04 M6).
  # It replaces the earlier dev/prod split: two generators whose templates only
  # differed in `prune` (now the same everywhere, H3) and in the dev-only
  # ignoreDifferences (now a `templatePatch` below). The sync policy for all rows
  # lives once in `spec.template`, so a new knob cannot drift between environments.
  generators:
    - list:
        elements:
          # rova dev and opshub dev. kb's row returns with its dev move; today it would
          # sit Degraded. Chart 0.14.0 is the on-prem secrets shape (one Key Vault secret
          # per value, db-migrator / db-worker passwords, graph cert).
          # 0.15.0 adds the cluster-CIDR egress exclusion and allow-egress-data (dev network policies are ON).
          # 0.17.0 drops the AWS secret/IAM/IRSA shape; 0.18.0 adds the optional web component;
          # 0.19.0 makes finished Job pods disappear (ttlSecondsAfterFinished, #188); 0.19.1 puts
          # the SPA's liveness on /livez, which qnsc-liveness-probes requires (#210 — 0.19.0's web
          # Deployment was rejected in production); 0.19.2 scopes the network policies to known
          # ports and adds the optional web.apiUpstream path rova's guide proxy needs (#268);
          # 0.19.3 reports the running version (APP_VERSION/APP_COMMIT, web config appVersion)
          # so the UI can show which build serves it (#313).
          # Never pin 0.11.1 (PreSync deadlock, fixed in 0.11.2, gitops#45).
          - { product: rova,   env: dev, chartVersion: "0.20.0" }
          - { product: opshub, env: dev, chartVersion: "0.20.0" }
          # kb-dev: the values are complete (values/kb/dev.yaml) and the chart exists; this row waits for
          # the owner's kv-qnsc-dev kb-dev-* secrets (values/kb/dev.secrets.yaml) and the "KB Dev" Entra
          # redirects on kb-dev.qnsc.vn — an absent kv secret fails the whole ExternalSecret, so the row
          # is the last switch. All three dev rows move together to 0.19.3.
          - { product: kb, env: dev, chartVersion: "0.20.1" }
          # ── prod ────────────────────────────────────────────────────────────
          # A prod-only product simply has no dev row — §5c: "Absence is the mechanism."
          - { product: rova, env: prod, chartVersion: "0.20.0" }
          # opshub prod GO-LIVE (2026-11-04): the data layer is live (apps/platform-data-opshub-prod.yaml;
          # pg-opshub Healthy, first backup complete, ContinuousArchiving=True). This row deploys the
          # app itself. 0.19.3 carries `web`, the memoryLimit split and the version variables; a row
          # must never pin below the chart whose values it uses (the #163/#174 ComparisonError).
          - { product: opshub, env: prod, chartVersion: "0.20.0" }
          # kb prod (enabled 2026-11-05): pg-kb + valkey-kb-prod live with a passing restore test,
          # the kv-qnsc-prod kb-prod-* secrets exist, no `<KB_PROD_...>` placeholder remains and
          # tags.prod.yaml carries the v0.1.3 / v0.2.0 releases. 0.19.3 is the chart the live prod
          # rows run (`web`, the memoryLimit split, the version variables); values/kb/prod.yaml uses
          # the split (Burstable), so this row must not pin lower.
          - { product: kb, env: prod, chartVersion: "0.20.1" }

  template:
    metadata:
      name: "{{.product}}-{{.env}}"           # §7c — ArgoCD Application naming
      # Consumed by the global deploy-notification subscriptions
      # (platform/argocd/values.yaml): prod gets every trigger, dev only
      # failures, and the Alert templates read the values for their titles/tags.
      labels:
        qnsc.vn/product: "{{.product}}"
        qnsc.vn/env: "{{.env}}"
    spec:
      project: products
      # Three revisions, not ArgoCD's default ten: each revision is the full
      # rendered manifest set, so this is the history a whole product keeps in
      # etcd. Set on every Application this repo owns (apps/*.yaml too).
      revisionHistoryLimit: 3
      # ONE k3s cluster; environments are namespaces (ONPREM-PLAN §6.2). The
      # namespace is declared in git (platform/namespaces/onprem.yaml) with its
      # qnsc.vn/env and qnsc.vn/tenant labels, never created by a sync.
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.product}}-{{.env}}"

      sources:
        # The chart, pinned. Never a range, never a branch (§11c). GHCR tags are
        # immutable and the packages are PUBLIC (H-D22): ArgoCD pulls anonymously,
        # no pull secret and no ECR token refresher. OCI repoURL is the FULL
        # registry path — for OCI, `chart` carries the artifact name and
        # repoURL must NOT be a bare registry (that worked for ECR's
        # namespace-in-registry layout but never matched GHCR).
        - repoURL: ghcr.io/quynhonsemiconductor/charts
          chart: qnsc-service
          targetRevision: "{{.chartVersion}}"
          helm:
            valueFiles:
              # ArgoCD deep-merges these before Helm sees them, which is why the
              # chart carries no dev/prod branch of its own.
              - $values/values/{{.product}}/base.yaml
              - $values/values/{{.product}}/{{.env}}.yaml
              - $values/values/{{.product}}/tags.{{.env}}.yaml
        - repoURL: https://github.com/quynhonsemiconductor/gitops
          targetRevision: main
          ref: values

      syncPolicy:
        automated:
          prune: true       # audit H3: prod too; product namespaces own no PVC/Cluster
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          # Namespaces outlive any single sync and carry the labels §10's
          # NetworkPolicies select on. Never pruned, in either environment.
          - PruneLast=true
          # Makes a sync honour ignoreDifferences: without it, ignoreDifferences only
          # hides the OutOfSync status and the next selfHeal sync resets
          # `.spec.replicas`, undoing kube-downscaler. Only the dev rows get the
          # ignoreDifferences block (templatePatch); the option is harmless on prod.
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # DEV ONLY (argocd-audit M6). kube-downscaler (the on-prem night shutdown)
  # scales Deployments to zero outside working hours, so ArgoCD must not revert
  # `.spec.replicas` there or the two fight on every reconcile. Prod has no
  # downscaler and keeps full replica drift detection: a hand-changed replica is
  # drift. This is the only difference between rows now that prune is the same
  # everywhere, so it is a patch instead of a second generator template.
  templatePatch: |
    {{- if eq .env "dev" }}
    spec:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions: [".spec.replicas"]
    {{- end }}
