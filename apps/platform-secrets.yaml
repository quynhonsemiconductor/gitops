# The platform's own ExternalSecrets on kv-qnsc-platform: grafana-cloud, cloudflared, and the ArgoCD admin hash.
# Sync wave -1 (ONPREM-PLAN §11.2): root orders its children by wave and waits for
# each wave's Applications to be Healthy (argocd-cm Application health customization,
# platform/argocd/values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  sources:
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/secrets
      directory: { include: "external-secrets.yaml" }
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/argocd
      directory: { include: "externalsecret.yaml" }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
