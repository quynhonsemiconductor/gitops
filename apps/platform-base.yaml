# Namespaces (with their qnsc.vn labels), admission policies and the data-prod NetworkPolicy.
# prune: false — pruning a Namespace deletes everything in it, so removals are manual.
# Sync wave -3 (ONPREM-PLAN §11.2): root orders its children by wave and waits for
# each wave's Applications to be Healthy (argocd-cm Application health customization,
# platform/argocd/values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  sources:
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/namespaces
      directory: { include: "*.yaml" }
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/policy
      directory: { include: "*.yaml" }
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/networkpolicy
      directory: { include: "*.yaml" }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
