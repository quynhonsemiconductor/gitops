# Data plane: the two dev Valkey StatefulSets and the Postgres ImageCatalogs. valkey-rova.yaml joins with the
# rova prod move (PLT-B2). prune: false — these own PVCs.
# Sync wave 0 (ONPREM-PLAN §11.2): root orders its children by wave and waits for
# each wave's Applications to be Healthy (argocd-cm Application health customization,
# platform/argocd/values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: data-dev
  sources:
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/valkey
      directory: { include: "valkey-*dev.yaml" }
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/cnpg
      directory: { include: "imagecatalog.yaml" }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
