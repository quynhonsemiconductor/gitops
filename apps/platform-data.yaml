# Data plane: the two dev Valkey StatefulSets, the Postgres ImageCatalogs and the dev Cluster (pg-dev). valkey-rova and pg-rova live in platform-data-prod.yaml. prune: false — these own PVCs.
# Sync wave 0 (ONPREM-PLAN §11.2): root orders its children by wave and waits for
# each wave's Applications to be Healthy (argocd-cm Application health customization,
# platform/argocd/values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-data
  namespace: argocd
  annotations:
    # Permanent OutOfSync (audit G-07): the CNPG webhook and the StatefulSet API default fields that
    # git does not carry (managed.roles[].connectionLimit/inherit, volumeClaimTemplates apiVersion/kind/
    # status), so a client-side diff never converges. Diff server-side, through the mutating webhooks.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: data-dev
  sources:
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/valkey
      directory: { include: "valkey-*dev.yaml" }
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: platform/cnpg
      directory: { include: "{imagecatalog,pg-dev}.yaml" }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
