# The app-of-apps. The ONE manifest applied by hand after ArgoCD is installed
# (platform/argocd/bootstrap.md); everything else follows, in sync-wave order
# (ONPREM-PLAN §11.2): the AppProject, the platform-* Applications under apps/, and
# the ApplicationSet under appsets/ (wave 1, so products come after the platform).
#
# appsets/ is a second source of THIS Application. The earlier comment excluded it to
# avoid "a cycle nobody enjoys debugging at 2am", but nothing here cycles: the
# ApplicationSet generates product Applications, never this one, and leaving it out
# meant a hand-applied object that no pin or review ever touched (PLT-H1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: apps
      directory:
        recurse: false
        include: "*.yaml"
        exclude: root.yaml   # root is hand-applied and does not manage itself
    - repoURL: https://github.com/quynhonsemiconductor/gitops
      targetRevision: main
      path: appsets
      directory:
        recurse: false
        include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # prune: true (argocd-audit 2026-11-04 H3): a deleted apps/*.yaml must remove its
    # Application object, or the app runs untracked forever. Hand-written Applications
    # carry no resources-finalizer, so pruning one leaves its workloads running; the
    # ApplicationSet keeps products' resources through preserveResourcesOnDeletion.
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
