# The AppProject every product Application belongs to.
#
# §10b — ArgoCD is the one component whose reach spans every environment on the
# node (one cluster, environments are namespaces). This project is
# where that reach is bounded: an Application in it may deploy the kinds listed
# below, into product namespaces, from this repository and the chart registry, and
# nothing else.
#
# It matters because "whoever can push to gitops can deploy anything" is only
# acceptable while "anything" has an edge.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: products
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # before the ApplicationSet (wave 1) that references it
spec:
  description: Product workloads. One Application per (product, environment).

  sourceRepos:
    - https://github.com/quynhonsemiconductor/gitops
    - ghcr.io/quynhonsemiconductor/charts   # public OCI (H-D22) — EXACT string: an OCI repoURL is compared literally, the /* glob never matched anything

  # Product namespaces only, on the one local cluster (ONPREM-PLAN §6.2). The
  # namespaces are declared in git (platform/namespaces/onprem.yaml) and applied
  # by the platform bootstrap; a product sync cannot create or target any other
  # namespace. Prod namespaces join with the prod rows (PLT-B2).
  destinations:
    - { server: https://kubernetes.default.svc, namespace: rova-dev }
    - { server: https://kubernetes.default.svc, namespace: opshub-dev }
    - { server: https://kubernetes.default.svc, namespace: kb-dev }
    - { server: https://kubernetes.default.svc, namespace: rova-prod }   # the prod row is disabled until the move-night PR

  # ── What a product Application may create ─────────────────────────────────
  # An explicit allow-list rather than "*", so a chart that starts rendering
  # something unexpected fails at sync instead of succeeding quietly.
  namespaceResourceWhitelist:
    - { group: "",                            kind: Service }
    - { group: "",                            kind: ServiceAccount }
    - { group: "",                            kind: ConfigMap }
    - { group: apps,                          kind: Deployment }
    - { group: batch,                         kind: Job }
    - { group: batch,                         kind: CronJob }
    - { group: policy,                        kind: PodDisruptionBudget }
    - { group: networking.k8s.io,             kind: NetworkPolicy }
    - { group: external-secrets.io,           kind: ExternalSecret }
    # NO SecretStore. Product Applications read `kv-qnsc-dev` through the
    # ClusterSecretStores the platform owns; a product that could create its own
    # store could point it at any vault its ServiceAccount can reach. The ESO
    # store in a product namespace is platform configuration (audit 2026-11-01 #1).
    - { group: monitoring.coreos.com,         kind: PrometheusRule }

  # Cluster-scoped: nothing. A product cannot create a Namespace, a ClusterRole,
  # a CRD, or a ValidatingAdmissionPolicy — those belong to the platform
  # bootstrap, not to a chart §11c lets any engineer bump.
  clusterResourceWhitelist: []

  roles:
    - name: developer
      description: >-
        §10b — sync on dev, read-only on prod. Production changes go through a
        reviewed pull request in this repository, not through the ArgoCD UI.
      policies:
        - p, proj:products:developer, applications, get, products/*, allow
        - p, proj:products:developer, applications, sync, products/*-dev, allow
      groups:
        - qnsc:developers
