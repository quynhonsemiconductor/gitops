# Prod opshub data plane: pg-opshub (CNPG), its barman ObjectStore/backup, the nightly
# dump, valkey-opshub and the pg-opshub restore test. ONE Application for the directory
# (argocd-audit 2026-11-04 M2), the platform/data/kb-prod pattern.
#
# ADOPTION, NOT delete+create — pg-opshub owns PVCs. The former Applications
# (`platform-opshub-prod-data`, `platform-opshub-restore-test`) were removed from
# apps/ in the same PR that created this one. Hand-written Applications carry no
# resources-finalizer, so removing their CR (root prune, or the OWNER's non-cascading
# delete — exact sequence in the PR body) never touches the workloads. This app is prune:true (argocd-audit H3):
# the CNPG Cluster, the valkey StatefulSet and the ObjectStores carry
# `argocd.argoproj.io/sync-options: Prune=false,Delete=false`, so a prune cleans stale
# config but can never delete data. ADOPTION NOTE: at creation the live objects are
# still tracked by the old Applications, so the first sync adopts them (a
# SharedResourceWarning until the owner deletes the old Application CRs); nothing
# is pruned meanwhile because the old apps are prune:false and the stateful objects
# carry Prune=false,Delete=false.
#
# Sync wave 3, with the other prod data apps, so an unready kv-qnsc-prod cannot
# hold earlier waves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-data-opshub-prod
  labels:
    qnsc.vn/env: platform
  namespace: argocd
  annotations:
    # server-side diff through the CNPG/StatefulSet webhooks (audit G-07)
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  # Three revisions, not the default ten (each is a full rendered manifest set).
  revisionHistoryLimit: 3
  destination:
    server: https://kubernetes.default.svc
    namespace: data-prod
  source:
    repoURL: https://github.com/quynhonsemiconductor/gitops
    targetRevision: main
    path: platform/data/opshub-prod
    directory: { include: "*.yaml" }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
